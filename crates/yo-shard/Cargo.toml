[package]
name = "yo-shard"
description = "Shard per core runtime: single ownership, SPSC lanes, and per shard epochs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
yo-alloc = { workspace = true }
yo-common = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
yo-index = { workspace = true }
# The adjacency plane, for the cross shard traversal experiment in
# `benches/traverse.rs`. O-G1 is a question about the runtime, so the benchmark
# lives with the runtime and borrows the graph rather than the other way round.
yo-graph = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "shard"
harness = false

[[bench]]
name = "traverse"
harness = false

[target.'cfg(loom)'.dev-dependencies]
loom = { workspace = true }
