[package]
name = "yo-kv"
description = "The Redis data structures, as plain Rust types with no protocol attached"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# Only so that ARGREP can say where its plan is allowed to reach the heap.
yo-alloc.workspace = true
yo-common.workspace = true
yo-index.workspace = true

[dev-dependencies]
criterion = { workspace = true }
# Only so that a test can hold `Kind` and `ValueType` on the same numbering.
yo-format = { workspace = true }
# Only so that a test can run a chunk chain against the real log rather than
# against a vector shaped like one. Which crate owns the wiring between the
# memory engine and the record plane is not settled, and a dev dependency does
# not settle it.
yo-record = { workspace = true }

[lints]
workspace = true

