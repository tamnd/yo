[[divergence]]
id = "D-72"
title = "An unsorted FT.AGGREGATE walks its documents in document number order"
reason = "A real server indexes a hash long after the write that made it, on a background scan of the keyspace, so a document's number is the position its key came back in from that scan and not the order the keys were written. Seven keys written as g:1 to g:7 come back from a wildcard aggregation as g:2, g:6, g:3, g:1, g:5, g:7, g:4 once the scan has caught up, and the same seven keys written in the same order into a second process come back in another order, because the scan follows a hash table that is seeded per process. This side indexes on the write, so a document's number is the order it arrived in and a wildcard aggregation walks g:1 to g:7. Nothing about a reply's content turns on this, but three things about its shape do: which rows a LIMIT window lands on, which row a step that fails stops at, and the number at the front of the reply when a FILTER has thrown rows away, because that number freezes when the first row of the reply is written. A client that wants a particular order has to ask for one on either server, and a SORTBY takes the difference away for every row it can tell apart, because rows that sort the same keep the order they were walked in on both sides."
status = "permanent"
spec = "09 section 5"

