[[divergence]]
id = "D-97"
title = "_FT.DEBUG HELP names the eight subcommands that answer"
reason = "HELP on Redis 8.10.1 answers sixty two names with no usage text against any of them, and most of them are about machinery this server does not have: a garbage collector that can be forced, a worker pool that can be counted, a topology updater that can be paused, an HNSW graph that can be dumped, a phonetic hash, a prefix trie and a suffix trie, a shard connection table, and eight names that are just the search commands again. Answering that list here would be a list of things to try that mostly do not work, and a client reading it to find out what it can ask would be worse off than one that asked and got told the subcommand is unknown. So HELP names the eight that are implemented, in the order a client is likely to want them, and every name it prints answers. The unknown subcommand line is byte for byte the one Redis writes, so a client that goes looking for a name from the real list finds out the same way it would there."
status = "permanent"
