[[divergence]]
id = "D-99"
title = "redis.set_repl is accepted and does nothing"
reason = "The call chooses which of the AOF and the replication stream a script's writes go to, and there is no AOF and no replication stream here yet, so there is nothing for the choice to select between. It validates its argument exactly the way a real server does, refuses a flag that is not one of the four with the same sentence, and then returns without changing anything. Refusing the call instead would break a script that sets REPL_ALL defensively at the top and never relies on the effect, which is the common shape, and accepting it silently is only wrong once there is a stream to leave a write out of."
