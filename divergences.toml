[[divergence]]
id = "D-98"
title = "redis.log writes at every level because there is no level to filter against"
reason = "A real server compares the level a script asks for against the loglevel in its config and drops anything below it, so redis.log(redis.LOG_DEBUG, ...) is normally invisible. There is no loglevel setting here yet, so every call is written and the level goes out as part of the line rather than as a reason to drop it. The visible difference is a busier log on a server that asked for a quiet one, and it goes away on its own once the config key lands, at which point the comparison is one line of code. Dropping the low levels now instead would mean picking a threshold that nothing can configure, which is a worse answer than writing more than was asked for."
