[[divergence]]
id = "D-112"
title = "EXEC is atomic on one shard thread and not on several"
reason = "A real server runs a transaction with nothing at all in between its commands, because everything a real server does happens on one thread. Here EXEC decodes its queue and sends each command back through the dispatcher in turn, and each of those takes and lets go of the stripe locks it needs, so on a server with more than one shard thread another connection's command can land between two queued ones. The default is one shard thread and yodb serve --threads defaults to one, so on the default server the guarantee holds for the reason the reference's does: there is nobody else to run. What closes it is a lock every ordinary command takes for reading and EXEC takes for writing, sharded per thread so the read side is a local counter rather than a shared line, skipped entirely at one thread. That is a piece of work with its own measurement to do, and registering it is better than a version of it that is nearly right. What is already true either way is that a queued command is never half run: each one still holds every stripe it needs for as long as it needs, so a client can never see one command of the queue partly applied."
