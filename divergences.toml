[[divergence]]
id = "D-113"
title = "A write that turned out to change nothing still fails a watch on the key it named"
reason = "The reference marks a watched key from inside the command, at the point the command knows it has changed something, so PERSIST on a key with no deadline and GETEX with no options both leave a watch on that key alone. Here the marking happens in the dispatcher after the command has run, over the keys the command named, so both of those fail the next EXEC. The same goes for every other write that decides against itself: SETNX on a key that is there, EXPIRE XX on a key with no deadline, SREM of a member that is not in the set. Two things keep this from being the wrong kind of wrong. It only ever fails a transaction that would have succeeded and never lets one through that should have failed, and a client using WATCH has to retry on a failed EXEC anyway, so the behaviour is one a correct client already handles. What closes it is a change counter the commands report into, which is the reference's own server.dirty and is wanted for replication as well, at which point the mark happens only when the count moved. Deleting a key that was not there is already exempt, because the marking asks whether the key exists now or existed at the last look and skips it when neither is true."
