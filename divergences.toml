[[divergence]]
id = "D-103"
title = "Writing an existing global through the _G name is accepted and then undone"
reason = "Redis ships a patched Lua 5.1 with a readonly flag on the table itself and vanilla 5.1 has no such flag, so the only way to refuse a write here is a metatable, and __newindex only fires for keys the table does not have. A plain global write is caught, because a script runs in an empty environment whose __newindex fires on everything, so x = 1 and pcall = 1 both raise the sentence a real server raises. Reaching through the _G name to a field that already exists, as in _G.pcall = 1, is the one hole that leaves. Closing it would mean putting the global table behind an empty proxy, the way the redis table is, and the global table is the environment every script runs in, so that would put a metatable lookup in front of every read of every global in every script for the sake of a write nobody makes. What stops it mattering is that every run ends by walking the global table and putting back anything that moved, so a script that does this can only break itself and the next script on that thread starts from a clean table."
status = "permanent"
spec = "12 section 7"

[[divergence]]
id = "D-104"
title = "SCRIPT DEBUG takes the mode and there is no debugger behind it"
reason = "A real server answering YES or SYNC puts the connection into a Lua debugging session, where the next EVAL forks a child, stops on the first line and talks a line protocol back over the same connection until the client is done stepping. It is a whole second protocol on top of RESP and it needs a fork to be safe, since the debugged script is allowed to write and the session is allowed to be abandoned. Neither of those exists here, so the mode is validated and dropped and scripts run the way they always do. A client that turns the debugger off, which is what a library does defensively at the start of a connection, gets the same OK it would get anywhere. A client that turns it on gets an OK and then a script that runs to the end instead of stopping, which is the wrong answer, and the alternative of refusing YES outright would break the defensive NO case for nobody's benefit since a client that wanted to step would find out one command later either way."
status = "permanent"
spec = "12 section 7"

[[divergence]]
id = "D-105"
title = "cjson settings go back to their defaults at the end of every script"
reason = "A real server has one Lua interpreter for the whole process, so cjson.encode_max_depth(20) in one script is still in force for the next script and for every other connection, and that is documented behaviour a few libraries lean on. This server has an interpreter per thread, so keeping a setting would mean a script got whatever the last script that happened to land on the same thread left behind, which is a different answer depending on which thread took the connection and is worse than either choice made on purpose. Every script therefore starts from the settings the library ships with. A script that sets one and reads it back in the same run sees what it set, which covers the case that actually shows up, and a script that expects a setting to outlive it gets the defaults rather than a coin toss. Making it stick would mean one shared interpreter behind a lock, which is the thing this server is built not to have."
status = "permanent"
spec = "12 section 7"

[[divergence]]
id = "D-106"
title = "cjson refuses a document nested deeper than two thousand whatever the limit says"
reason = "Both halves of the library are plain recursion in Rust, one frame per level, so the depth a document can reach is bounded by the thread stack rather than by the setting. The setting is honoured up to two thousand levels, which is twice the default limit of a thousand, and past that the answer is the same sentence the configured limit gives rather than a crash. The only script this is visible to is one that raised encode_max_depth or decode_max_depth above two thousand on purpose and then handed over a document deeper than that, which is not a shape any real payload has. Lifting it would mean writing both halves with an explicit stack, which costs every ordinary document a heap allocation and a slower inner loop to make a pathological one work."
status = "permanent"
spec = "12 section 7"

[[divergence]]
id = "D-107"
title = "struct sizes are the sixty four bit ones on every build"
reason = "The C library reads its sizes off the compiler, so l is a C long, T is a size_t and i with no number after it is a C int, and struct.size('l') is eight on a normal server and four on a thirty two bit one. This is a port rather than a wrapper, so the sizes here are the ones the C picks on the platform Redis is actually built and shipped for, which is little endian and sixty four bit, and they do not change with the machine this happens to be running on. On the platforms anyone runs a server on the two agree byte for byte. On a thirty two bit build they would not, and the answer here is the one that keeps a packed record readable by the same script on every machine in a cluster, which is what a script packing bytes wants in the first place. Byte order is not affected, since the format string says what it wants and the default is what the machine does."
status = "permanent"
spec = "12 section 7"

[[divergence]]
id = "D-108"
title = "The members of a library table come back in a different order from the reference's"
reason = "Lua 5.1 lays a table's string keys out in a node array whose size and probe order depend on how many keys were put in and in what order, so the order pairs() walks a table in is a property of how that table was built rather than of what is in it. Every table a script builds walks the same on both servers, which is what matters, and fifty keys inserted in a shuffled order come back in the same shuffled order on either side. The tables this server builds in its own prelude are the exception, because the reference builds the same tables from C with luaL_register, which presizes the node array to the number of names it is about to set, and there is no way to presize a table from Lua. Three tables are affected: redis, cmsgpack and the global table, and all three hold exactly the same names with exactly the same values, so the only thing that differs is the order a script sees them in if it walks one. That is visible to a script through pairs, and through cjson.encode and cmsgpack.pack on a library table, which walk it the same way. Nothing documents the order and the reference's own order changes between versions as names are added, so a script reading it is reading an accident either way."
