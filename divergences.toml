[[divergence]]
id = "D-115"
title = "A published message can wait a millisecond before it goes out"
reason = "The reference publishes and delivers in the same call, because everything it does happens on one thread and the subscriber's reply buffer is right there. Here a connection belongs to the thread that accepted it and only that thread may write into its buffer, so a publish leaves an envelope in a mailbox and the subscriber's thread renders it at the end of its next batch. On a server with one shard thread, which is the default, that is the same turn and there is no wait at all. Above one thread the subscriber's thread may be asleep on its poller, and the poller has no wakeup of its own, so what keeps the message moving is that a thread with any subscriber of its own stays on the short poller wait rather than the idle one. Delivery is therefore bounded by a millisecond instead of by twenty, and a thread with no subscribers pays nothing for the rule. What closes it is a wakeup the publisher can fire, which is an eventfd on Linux and a self pipe elsewhere, and that is a change to the driver rather than to pub/sub. Ordering is not affected either way: messages to one channel arrive in the order they were published, because one mailbox is one queue."
