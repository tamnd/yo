[[divergence]]
id = "D-114"
title = "An unknown subcommand inside MULTI is queued rather than refused"
reason = "The reference looks a container command's subcommand up in the same table it looks the command up in, so CONFIG NOPE is not a command at all and is refused where the client wrote it, which kills the transaction and makes EXEC an abort. Here a container is one row in the table and the subcommand is read by the command's own body, so CONFIG NOPE is queued, answers QUEUED, and fails with the same message when EXEC runs it, leaving the rest of the queue to run. Everything else about the queue is the same, including the far more common case of a command that is not a command at all and the case of a container sent with the wrong number of arguments outright. What closes it is a subcommand table, which is the same thing missing from COMMAND INFO's subcommands field and from COMMAND COUNT, so it is one piece of work and not three. The fourth thing it closes is COMMAND GETKEYS over a container: the reference looks up the pair, fails, and answers Invalid command specified, and here the container is found and asked about its keys, so an unknown subcommand answers The command has no key arguments instead. Both are errors and both name the same problem, and the eleven containers are the whole of it. The fifth is D-137, an ACL rule naming a subcommand that does not exist, which a real server refuses at SETUSER time because it can look the pair up and this one cannot. The sixth is table::SUBCATS, the hand written list of the categories a container's subcommands hold that the container does not, which is only there because the subcommands have nowhere of their own to carry them and which ACL CAT would list from if they did."
