[[divergence]]
id = "D-116"
title = "PUBSUB CHANNELS answers in a different order"
reason = "The reference walks its own hash table and answers the channels in whatever order the buckets fall in, which is not sorted, not insertion order, and not stable across a rehash. Here the walk is over a different hash table and comes out in a different order that is equally arbitrary. There is nothing to fix, because there is no order to match: a client that cares has to sort what it gets back, and one that reads the reference's order as meaningful is reading something the reference does not promise. The same goes for PUBSUB SHARDCHANNELS and for the order of the replies UNSUBSCRIBE with no arguments sends, which walks the same kind of table on both sides. What the two do agree on exactly is the set of names, the counts and the shape of every reply."
