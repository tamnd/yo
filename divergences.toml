# The divergence register.
#
# Every place yo is knowingly not Redis, in one file, machine readable, checked
# by `cargo xtask check`. This exists because the alternative, a compatibility
# claim with unlisted exceptions, is how every Redis compatible product loses
# its users' trust exactly once.
#
# A new divergence needs a row here in the same commit that creates it. Any
# command marked `divergent = true` in commands.toml must name a row that is in
# this file, and every row here must be named by something, so a divergence
# cannot be added and then quietly forgotten and a row cannot outlive the thing
# it described.
#
# `status` is one of:
#   permanent   this is the design, and it is not going to change
#   until        it goes away when the milestone named in `resolved_by` lands

[[divergence]]
id = "D-1"
title = "OBJECT ENCODING returns skiplist for a counted B+ tree"
reason = "The string is an encoding name that clients test for, not a structural claim. Returning a novel string breaks tools for no benefit."
status = "permanent"
spec = "12 section 2"

[[divergence]]
id = "D-2"
title = "VLINKS returns partition neighbours in permissive mode"
reason = "There is no HNSW graph to walk, so there are no layer by layer links to report. The partition neighbours are the honest answer to the question the command is asking."
status = "permanent"
spec = "10 section 9"

[[divergence]]
id = "D-3"
title = "GRAPH.QUERY is not supported"
reason = "By decision. The whole point of the product is that there is no query language to learn, so shipping one anyway to claim a compatibility box would be shipping the thing we said we would not."
status = "permanent"
spec = "11 section 7"

[[divergence]]
id = "D-4"
title = "DEBUG subcommands outside the tested subset return ERR"
reason = "They are internal to Redis's implementation and several of them report on structures that do not exist here."
status = "permanent"
spec = "12 section 10"

[[divergence]]
id = "D-5"
title = "CONFIG parameters with no yo analogue are accepted and ignored"
reason = "CONFIG GET returns the stored value, so configuration management tools round trip. Refusing them instead would break every tool that writes a whole config file."
status = "permanent"
spec = "12 section 10"

[[divergence]]
id = "D-6"
title = "MEMORY USAGE reports yo's own accounting"
reason = "The numbers are smaller and they are real. The method is documented rather than the number being adjusted to look like Redis's."
status = "permanent"
spec = "12 section 10"

[[divergence]]
id = "D-7"
title = "Latency characteristics differ under SPOP, LPOP and LINSERT"
reason = "They are faster. Listed because a test that asserts a shape of latency rather than a bound on it may notice."
status = "permanent"
spec = "12 section 10"

[[divergence]]
id = "D-8"
title = "A string is capped just under 2 MiB rather than at 512 MiB"
reason = "A value lives in one arena segment and the arena hands out at most one segment in one piece. A value past the cap is a YO_ERR_FULL carrying Redis's own message, not a panic."
status = "until"
resolved_by = "M5"
spec = "06 section 2"

[[divergence]]
id = "D-9"
title = "Expiry is lazy only"
reason = "A key past its deadline is dropped when something touches it, at the exact millisecond. A key nobody ever touches again holds its memory until the active cycle in the maintenance slice lands."
status = "until"
resolved_by = "M5"
spec = "14 section 1"

[[divergence]]
id = "D-10"
title = "LCS refuses a table larger than 64 million cells"
reason = "Redis has no explicit limit and fails on the allocation instead, which on a server that has overcommitted is a kill rather than an error. LCS on two large strings is the easiest accidental denial of service in the string group, so the limit is a number and the failure is the same failure on every machine."
status = "permanent"
spec = "08 section 2"

[[divergence]]
id = "D-11"
title = "The float counters count in f64 rather than in the C long double"
reason = "INCRBYFLOAT and INCREX BYFLOAT use a long double in Redis, which is eighty bit on x86-64 and a hundred and twenty eight bit on aarch64, so Redis already does not agree with itself across machines. f64 gives the same answer everywhere. A value that needs more than seventeen significant digits differs, and nothing else does."
status = "permanent"
spec = "08 section 2"

[[divergence]]
id = "D-12"
title = "HELLO and INFO report the server as redis 8.8.0"
reason = "Every client library in the world branches on that pair to decide which commands exist, and a driver that reads yo there falls back to its oldest code path or refuses to connect outright. The honest answer is in the yo_version field of INFO, next to redis_version, and nothing else in the engine claims to be Redis."
status = "permanent"
spec = "12 section 9"

[[divergence]]
id = "D-13"
title = "COMMAND INFO sends empty tips, key specs and subcommands"
reason = "The first, last and step triple is filled in and correct, which is what a cluster aware client routes on, and COMMAND GETKEYS answers for the one command whose keys are not where the triple says. The three fields after it describe request policies and key flags that nothing in this engine has yet, and an invented answer is worse than an empty one because a client that finds the field trusts it."
status = "until"
resolved_by = "M6"
spec = "12 section 9"

[[divergence]]
id = "D-14"
title = "CONFIG reports nine settings and refuses a change to any of them"
reason = "A real server carries hundreds of settings and lets a client change most of them at runtime. Nine of them mean something here, and none of them can move yet, so CONFIG GET answers about those nine and CONFIG SET accepts a write that changes nothing and refuses one that does not. The refusal uses the same sentence a real server uses for a setting that really is immutable. Accepting a change nothing acts on would be worse: a client that sets maxmemory and gets an OK has been told it has a limit."
status = "until"
resolved_by = "M5"
spec = "12 section 9"

[[divergence]]
id = "D-15"
title = "DBSIZE counts a key that is past its deadline until somebody reads it"
reason = "Both servers answer DBSIZE from the size of the index rather than by walking it, so both count keys that are past their deadline and have not been touched since. The difference is what happens next: Redis runs an active expiry cycle that takes a sample of them out every tick, and there is no active cycle here yet, so a dead key sits in the count until a read runs into it. Making DBSIZE walk the index instead would close the gap by turning an O(1) command into an O(N) one, which is the wrong trade for a number that is already approximate on a real server."
status = "until"
resolved_by = "M4"
spec = "14 section 1"

[[divergence]]
id = "D-16"
title = "SCRIPT and FUNCTION answer for an empty cache and refuse the rest"
reason = "There is no Lua here until M6, so nothing can be loaded and nothing can run. The subcommands that are exactly right on a server whose script cache and library set are empty are answered, which is SCRIPT FLUSH, SCRIPT EXISTS, FUNCTION FLUSH, FUNCTION LIST, FUNCTION DELETE and both HELPs. The ones that would need an interpreter are not there at all and report unknown subcommand, because an OK that did nothing is worse than an error: a client that loads a script and gets an OK believes it can call it. FUNCTION STATS is the borderline one and it is refused, since a real server lists LUA in its engines map and an empty map would be a different answer rather than the same one."
status = "until"
resolved_by = "M6"
spec = "12 section 7"

[[divergence]]
id = "D-17"
title = "PEXPIREAT clamps a deadline past the year 4199"
reason = "Redis holds a key's deadline in a full signed long, so PEXPIREAT key 9223372036854775807 stores that number and PTTL reads it back. A record here holds the deadline in forty six bits, which runs out in the year 4199, so anything past that is clamped to the top of the range. The command answers 1 either way and the key does not expire either way, so the only thing a client can see is PTTL naming a different absurd number than the absurd number it asked for. The alternative is refusing the command, which would break a client that uses a large constant to mean never, and the other alternative is widening the record, which would cost eighteen bits on every key that has a deadline to hold a range no clock will reach."
status = "permanent"
spec = "08 section 4"

[[divergence]]
id = "D-18"
title = "An array holds four gigabytes of long values per key and one gigabyte per value"
reason = "Values of eight bytes or more go into one growable blob per key and the position word points into it with a thirty two bit start and a thirty bit length, which is what makes an array cost eight bytes and the payload per element where Redis pays a tagged pointer and a malloc header on top. The price is those two ceilings, and a write that would cross either is refused with an error rather than truncated. Redis has no such limit because it allocates each value on its own. Four gigabytes of long values in one array key is already past what a single key should hold, and the refusal is loud, so a client that hits it finds out rather than reading back a value it did not write."
status = "permanent"
spec = "08 section 1"

[[divergence]]
id = "D-19"
title = "A slice goes dense on how wide it is as well as how full it is"
reason = "Redis turns a sparse slice into a dense one once it holds more than ten elements, whatever indices those elements sit at. Sparse costs about ten bytes an element here and dense costs eight bytes for every position in the window it covers, so ten elements spread over a thousand positions are eight kilobytes dense and a hundred bytes sparse. A slice here goes dense only when it is over that count and its span is at most twice its population, which is the same rule read as a memory question rather than a count. The only commands that report which of the two a slice is in are ARINFO FULL and the numbers OBJECT and MEMORY USAGE give back, and the difference it makes to those last two is that the number is smaller."
status = "permanent"
spec = "08 section 1"

[[divergence]]
id = "D-20"
title = "ARINFO describes our directory, and super-dir-entries is always zero"
reason = "The first three fields ARINFO reports are the count, the length and the next insert index, and those are properties of the array a client wrote and they match Redis exactly. Everything after them describes how the array is laid out, and the layout is not the same one Redis has, so slices, directory-size, dense-slices, sparse-slices and the three averages are honest numbers about our structure rather than the same numbers a real server would print. The clearest case is super-dir-entries, which counts the second directory level Redis grows above the first one when a single level would waste too much room. There is no second level here, so the field is always zero. It is still in the reply because a client reading the map by field name should find every field it expects rather than have to handle a missing one, and a zero reads correctly as no second level."
status = "permanent"
spec = "08 section 1"

[[divergence]]
id = "D-21"
title = "AROP adds in a double where Redis adds in a long double"
reason = "SUM, MIN and MAX accumulate in a C long double on Redis, and a long double is three different types depending on where it was built: eighty bit extended on x86-64, IEEE binary128 on aarch64 Linux, and a plain sixty four bit double on Apple silicon. Redis's own answer to the same AROP therefore already depends on which machine it is running on, so there is no single number to match. This accumulates in an f64 everywhere, which is the Apple silicon answer and the same answer D-11 gives for the float counters. The difference only shows up in the last digits of a long sum of values that do not add exactly, and it never shows up at all for MIN, MAX or for sums that stay inside what a double holds exactly. Matching the widest of the three would mean carrying a software extended precision accumulator on every platform to reproduce a number Redis itself does not reproduce across its own builds."
status = "permanent"
spec = "08 section 1"

[[divergence]]
id = "D-22"
title = "ARGREP RE follows TRE's parser in the three places Redis disagrees with itself"
reason = "Redis compiles an RE predicate with the bundled TRE and then matches it through a literal fast path that is a separate implementation, and the two do not always answer the same thing. This engine is TRE's syntax read off its parser and measured against it, roughly a quarter of a million comparisons, and the three answers that differ are all cases where there is no single Redis answer to match. First, a byte an escape produced is not case folded under NOCASE: TRE only folds a byte it read straight out of the pattern, so \\x41 is A and never a, while the fast path folds it for a pattern that is nothing but a literal. Second, a nul byte inside an element is an ordinary byte here, while TRE's matcher stops at the first one and the fast path does not, so a and [a] do not match the element a followed by a nul on Redis and a* does. Third, an empty alternation arm that follows an arm holding only an assertion still matches here, while TRE's epsilon removal lets the assertion kill it, so \\B| matches the element - here and does not there. The first follows TRE because that is what compiles the pattern, and the other two are the POSIX correct answer to a question Redis answers two ways."
status = "permanent"
spec = "08 section 1"

[[divergence]]
id = "D-23"
title = "maxmemory is honoured to within one two megabyte segment"
reason = "Redis allocates every value through jemalloc and gets the pages back as soon as a key is freed, so a maxmemory of four megabytes is a real four megabytes. Records here live in arena segments of two megabytes and a segment only stops counting when compaction has moved the last live record out of it, so evicting keys moves the number in two megabyte steps rather than smoothly. What a client sees is that a server told to hold four hundred megabytes holds four hundred megabytes give or take one segment, which is a quarter of a percent, and a server told to hold four megabytes may settle at two. The alternative is a smaller segment, which costs a syscall and a header per two megabytes of keyspace on every server whether or not it has a limit, to buy precision that only matters to a limit small enough to be a test rather than a deployment."
status = "permanent"
spec = "14 section 5"
