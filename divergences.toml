# The divergence register.
#
# Every place yo is knowingly not Redis, in one file, machine readable, checked
# by `cargo xtask check`. This exists because the alternative, a compatibility
# claim with unlisted exceptions, is how every Redis compatible product loses
# its users' trust exactly once.
#
# A new divergence needs a row here in the same commit that creates it. Any
# command marked `divergent = true` in commands.toml must name a row that is in
# this file, and every row here must be named by something, so a divergence
# cannot be added and then quietly forgotten and a row cannot outlive the thing
# it described.
#
# `status` is one of:
#   permanent   this is the design, and it is not going to change
#   until        it goes away when the milestone named in `resolved_by` lands

[[divergence]]
id = "D-1"
title = "OBJECT ENCODING returns skiplist for a counted B+ tree"
reason = "The string is an encoding name that clients test for, not a structural claim. Returning a novel string breaks tools for no benefit."
status = "permanent"
spec = "12 section 2"

[[divergence]]
id = "D-2"
title = "VLINKS returns partition neighbours in permissive mode"
reason = "There is no HNSW graph to walk, so there are no layer by layer links to report. The partition neighbours are the honest answer to the question the command is asking."
status = "permanent"
spec = "10 section 9"

[[divergence]]
id = "D-3"
title = "GRAPH.QUERY is not supported"
reason = "By decision. The whole point of the product is that there is no query language to learn, so shipping one anyway to claim a compatibility box would be shipping the thing we said we would not."
status = "permanent"
spec = "11 section 7"

[[divergence]]
id = "D-4"
title = "DEBUG subcommands outside the tested subset return ERR"
reason = "They are internal to Redis's implementation and several of them report on structures that do not exist here."
status = "permanent"
spec = "12 section 10"

[[divergence]]
id = "D-5"
title = "CONFIG parameters with no yo analogue are accepted and ignored"
reason = "CONFIG GET returns the stored value, so configuration management tools round trip. Refusing them instead would break every tool that writes a whole config file."
status = "permanent"
spec = "12 section 10"

[[divergence]]
id = "D-6"
title = "MEMORY USAGE reports yo's own accounting"
reason = "The numbers are smaller and they are real. The method is documented rather than the number being adjusted to look like Redis's."
status = "permanent"
spec = "12 section 10"

[[divergence]]
id = "D-7"
title = "Latency characteristics differ under SPOP, LPOP and LINSERT"
reason = "They are faster. Listed because a test that asserts a shape of latency rather than a bound on it may notice."
status = "permanent"
spec = "12 section 10"

[[divergence]]
id = "D-8"
title = "A string is capped just under 2 MiB rather than at 512 MiB"
reason = "A value lives in one arena segment and the arena hands out at most one segment in one piece. A value past the cap is a YO_ERR_FULL carrying Redis's own message, not a panic."
status = "until"
resolved_by = "M5"
spec = "06 section 2"

[[divergence]]
id = "D-9"
title = "Expiry is lazy only"
reason = "A key past its deadline is dropped when something touches it, at the exact millisecond. A key nobody ever touches again holds its memory until the active cycle in the maintenance slice lands."
status = "until"
resolved_by = "M5"
spec = "14 section 1"

[[divergence]]
id = "D-10"
title = "LCS refuses a table larger than 64 million cells"
reason = "Redis has no explicit limit and fails on the allocation instead, which on a server that has overcommitted is a kill rather than an error. LCS on two large strings is the easiest accidental denial of service in the string group, so the limit is a number and the failure is the same failure on every machine."
status = "permanent"
spec = "08 section 2"

[[divergence]]
id = "D-11"
title = "The float counters count in f64 rather than in the C long double"
reason = "INCRBYFLOAT and INCREX BYFLOAT use a long double in Redis, which is eighty bit on x86-64 and a hundred and twenty eight bit on aarch64, so Redis already does not agree with itself across machines. f64 gives the same answer everywhere. A value that needs more than seventeen significant digits differs, and nothing else does."
status = "permanent"
spec = "08 section 2"

[[divergence]]
id = "D-12"
title = "HELLO and INFO report the server as redis 8.8.0"
reason = "Every client library in the world branches on that pair to decide which commands exist, and a driver that reads yo there falls back to its oldest code path or refuses to connect outright. The honest answer is in the yo_version field of INFO, next to redis_version, and nothing else in the engine claims to be Redis."
status = "permanent"
spec = "12 section 9"

[[divergence]]
id = "D-13"
title = "COMMAND INFO sends empty tips, key specs and subcommands"
reason = "The first, last and step triple is filled in and correct, which is what a cluster aware client routes on, and COMMAND GETKEYS answers for the one command whose keys are not where the triple says. The three fields after it describe request policies and key flags that nothing in this engine has yet, and an invented answer is worse than an empty one because a client that finds the field trusts it."
status = "until"
resolved_by = "M6"
spec = "12 section 9"

[[divergence]]
id = "D-14"
title = "CONFIG reports nine settings and refuses a change to any of them"
reason = "A real server carries hundreds of settings and lets a client change most of them at runtime. Nine of them mean something here, and none of them can move yet, so CONFIG GET answers about those nine and CONFIG SET accepts a write that changes nothing and refuses one that does not. The refusal uses the same sentence a real server uses for a setting that really is immutable. Accepting a change nothing acts on would be worse: a client that sets maxmemory and gets an OK has been told it has a limit."
status = "until"
resolved_by = "M5"
spec = "12 section 9"

[[divergence]]
id = "D-15"
title = "DBSIZE counts a key that is past its deadline until somebody reads it"
reason = "Both servers answer DBSIZE from the size of the index rather than by walking it, so both count keys that are past their deadline and have not been touched since. The difference is what happens next: Redis runs an active expiry cycle that takes a sample of them out every tick, and there is no active cycle here yet, so a dead key sits in the count until a read runs into it. Making DBSIZE walk the index instead would close the gap by turning an O(1) command into an O(N) one, which is the wrong trade for a number that is already approximate on a real server."
status = "until"
resolved_by = "M4"
spec = "14 section 1"

[[divergence]]
id = "D-16"
title = "SCRIPT and FUNCTION answer for an empty cache and refuse the rest"
reason = "There is no Lua here until M6, so nothing can be loaded and nothing can run. The subcommands that are exactly right on a server whose script cache and library set are empty are answered, which is SCRIPT FLUSH, SCRIPT EXISTS, FUNCTION FLUSH, FUNCTION LIST, FUNCTION DELETE and both HELPs. The ones that would need an interpreter are not there at all and report unknown subcommand, because an OK that did nothing is worse than an error: a client that loads a script and gets an OK believes it can call it. FUNCTION STATS is the borderline one and it is refused, since a real server lists LUA in its engines map and an empty map would be a different answer rather than the same one."
status = "until"
resolved_by = "M6"
spec = "12 section 7"

[[divergence]]
id = "D-17"
title = "PEXPIREAT clamps a deadline past the year 4199"
reason = "Redis holds a key's deadline in a full signed long, so PEXPIREAT key 9223372036854775807 stores that number and PTTL reads it back. A record here holds the deadline in forty six bits, which runs out in the year 4199, so anything past that is clamped to the top of the range. The command answers 1 either way and the key does not expire either way, so the only thing a client can see is PTTL naming a different absurd number than the absurd number it asked for. The alternative is refusing the command, which would break a client that uses a large constant to mean never, and the other alternative is widening the record, which would cost eighteen bits on every key that has a deadline to hold a range no clock will reach."
status = "permanent"
spec = "08 section 4"

[[divergence]]
id = "D-18"
title = "An array holds four gigabytes of long values per key and one gigabyte per value"
reason = "Values of eight bytes or more go into one growable blob per key and the position word points into it with a thirty two bit start and a thirty bit length, which is what makes an array cost eight bytes and the payload per element where Redis pays a tagged pointer and a malloc header on top. The price is those two ceilings, and a write that would cross either is refused with an error rather than truncated. Redis has no such limit because it allocates each value on its own. Four gigabytes of long values in one array key is already past what a single key should hold, and the refusal is loud, so a client that hits it finds out rather than reading back a value it did not write."
status = "permanent"
spec = "08 section 1"

[[divergence]]
id = "D-19"
title = "A slice goes dense on how wide it is as well as how full it is"
reason = "Redis turns a sparse slice into a dense one once it holds more than ten elements, whatever indices those elements sit at. Sparse costs about ten bytes an element here and dense costs eight bytes for every position in the window it covers, so ten elements spread over a thousand positions are eight kilobytes dense and a hundred bytes sparse. A slice here goes dense only when it is over that count and its span is at most twice its population, which is the same rule read as a memory question rather than a count. The only commands that report which of the two a slice is in are ARINFO FULL and the numbers OBJECT and MEMORY USAGE give back, and the difference it makes to those last two is that the number is smaller."
status = "permanent"
spec = "08 section 1"

[[divergence]]
id = "D-20"
title = "ARINFO describes our directory, and super-dir-entries is always zero"
reason = "The first three fields ARINFO reports are the count, the length and the next insert index, and those are properties of the array a client wrote and they match Redis exactly. Everything after them describes how the array is laid out, and the layout is not the same one Redis has, so slices, directory-size, dense-slices, sparse-slices and the three averages are honest numbers about our structure rather than the same numbers a real server would print. The clearest case is super-dir-entries, which counts the second directory level Redis grows above the first one when a single level would waste too much room. There is no second level here, so the field is always zero. It is still in the reply because a client reading the map by field name should find every field it expects rather than have to handle a missing one, and a zero reads correctly as no second level."
status = "permanent"
spec = "08 section 1"

[[divergence]]
id = "D-21"
title = "AROP adds in a double where Redis adds in a long double"
reason = "SUM, MIN and MAX accumulate in a C long double on Redis, and a long double is three different types depending on where it was built: eighty bit extended on x86-64, IEEE binary128 on aarch64 Linux, and a plain sixty four bit double on Apple silicon. Redis's own answer to the same AROP therefore already depends on which machine it is running on, so there is no single number to match. This accumulates in an f64 everywhere, which is the Apple silicon answer and the same answer D-11 gives for the float counters. The difference only shows up in the last digits of a long sum of values that do not add exactly, and it never shows up at all for MIN, MAX or for sums that stay inside what a double holds exactly. Matching the widest of the three would mean carrying a software extended precision accumulator on every platform to reproduce a number Redis itself does not reproduce across its own builds."
status = "permanent"
spec = "08 section 1"

[[divergence]]
id = "D-22"
title = "ARGREP RE follows TRE's parser in the three places Redis disagrees with itself"
reason = "Redis compiles an RE predicate with the bundled TRE and then matches it through a literal fast path that is a separate implementation, and the two do not always answer the same thing. This engine is TRE's syntax read off its parser and measured against it, roughly a quarter of a million comparisons, and the three answers that differ are all cases where there is no single Redis answer to match. First, a byte an escape produced is not case folded under NOCASE: TRE only folds a byte it read straight out of the pattern, so \\x41 is A and never a, while the fast path folds it for a pattern that is nothing but a literal. Second, a nul byte inside an element is an ordinary byte here, while TRE's matcher stops at the first one and the fast path does not, so a and [a] do not match the element a followed by a nul on Redis and a* does. Third, an empty alternation arm that follows an arm holding only an assertion still matches here, while TRE's epsilon removal lets the assertion kill it, so \\B| matches the element - here and does not there. The first follows TRE because that is what compiles the pattern, and the other two are the POSIX correct answer to a question Redis answers two ways."
status = "permanent"
spec = "08 section 1"

[[divergence]]
id = "D-23"
title = "maxmemory is honoured to within one two megabyte segment"
reason = "Redis allocates every value through jemalloc and gets the pages back as soon as a key is freed, so a maxmemory of four megabytes is a real four megabytes. Records here live in arena segments of two megabytes and a segment only stops counting when compaction has moved the last live record out of it, so evicting keys moves the number in two megabyte steps rather than smoothly. What a client sees is that a server told to hold four hundred megabytes holds four hundred megabytes give or take one segment, which is a quarter of a percent, and a server told to hold four megabytes may settle at two. The alternative is a smaller segment, which costs a syscall and a header per two megabytes of keyspace on every server whether or not it has a limit, to buy precision that only matters to a limit small enough to be a test rather than a deployment."
status = "permanent"
spec = "14 section 5"

[[divergence]]
id = "D-24"
title = "SORT ALPHA compares bytes and not the server's collation"
reason = "Redis compares strings with strcoll when there is no STORE and with a byte compare when there is, because a stored result has to be the same on every replica. It calls setlocale(LC_COLLATE, \"\") at startup, so the order SORT ALPHA puts two strings in is a property of the environment the server was started in and not of the data, and the same server started twice under two locales answers differently. strcoll also stops at the first zero byte, so two members that differ only after a zero compare equal. This compares bytes everywhere, which is the STORE behaviour applied to every call, is what a client already gets from Redis under the C locale that almost every deployment runs, and is the only choice that makes the answer reproducible."
status = "permanent"
spec = "05 section 4"

[[divergence]]
id = "D-25"
title = "WAIT and WAITAOF answer at once instead of waiting out the timeout"
reason = "Both commands ask whether this connection's writes have got somewhere durable, and both of them can only ever answer zero here. There is no replication, so no replica has acknowledged anything, and appendonly is fixed at no and cannot be set, so there is no local file to be behind either. Redis in the same state gives the same numbers and gets there by blocking the client for the whole timeout first, because on a real server a replica could connect and acknowledge during that window. Nothing can arrive here during that window, so waiting would be a sleep with a known answer at the end of it, and the one thing it would buy is that a test measuring how long WAIT 1 100 takes would see a hundred milliseconds. The numbers a client reads are identical either way, and this goes away by itself the day replication lands, at which point the wait becomes real rather than a formality."
status = "until"
resolved_by = "M8"
spec = "12 section 8"

[[divergence]]
id = "D-26"
title = "RESTORE checks IDLETIME and FREQ and then drops them"
reason = "Both options set eviction metadata on a real server, so a key restored with IDLETIME 3600 arrives already an hour stale and one restored with FREQ 200 arrives hot. There is no eviction here yet, and the store has readers for that metadata and no writer, so a restored key starts with the idle time and the counter any new key gets. Both numbers are still parsed and range checked rather than skipped, because the four error messages are the whole of what a client can see about these two options today, and a client that sends FREQ 300 should be told it is out of range whether or not anybody is going to act on 200. What a client can observe is OBJECT IDLETIME and OBJECT FREQ answering the same thing for a restored key as for a freshly written one, and that stops being a divergence when the eviction milestone gives the metadata a writer."
status = "until"
resolved_by = "M5"
spec = "14 section 5"

[[divergence]]
id = "D-27"
title = "XINFO STREAM leaves out the six idempotency fields"
reason = "Redis 8.10 answers sixteen pairs and six of them are about the idempotency tracking it grew in 8.6: idmp-duration, idmp-maxsize, pids-tracked, iids-tracked, iids-added and iids-duplicates. That feature is a window in which a producer's own entry id is remembered so a retried XADD is recognised as the same write rather than appended twice, and there is none of it here, so there is nothing behind those numbers. Sending them as zeros would be worse than leaving them out, because zero is a real reading for four of them and a client that sees iids-duplicates 0 has been told the deduplication ran and found nothing rather than that it never ran. Ten pairs come back instead, in the same order Redis sends them in, so a client reading fields by name gets the same answer for every field it can find and finds nothing where a feature does not exist. This closes when XCFGSET and XIDMPRECORD land with the tracking behind them."
status = "until"
resolved_by = "M8"
spec = "08 section 7"

[[divergence]]
id = "D-28"
title = "radix-tree-keys and radix-tree-nodes count listpack nodes"
reason = "Both fields describe the rax Redis keeps its stream nodes in, where the keys are the first id of each node and the nodes are the internal tree nodes holding them, so a stream of three listpacks under one branch reports three keys and two nodes and the second number moves with the shape of the tree and not only with the data. The storage here is a node list and not a rax, so there is no tree to count and the honest reading of both is the number of listpack nodes, with a floor of one on the second because a real server reports a root node for an empty stream. What a client can do with these fields is watch them to see how the stream is laid out underneath, and they still do that: keys is exact, and nodes moves the same way for the same reason. Nothing in the reply shape changes and no client that reads the two as a health signal reads them differently. This is what the structure is and it is not going to grow a rax to make two diagnostic numbers match, so it is permanent."
status = "permanent"
spec = "08 section 7"

[[divergence]]
id = "D-29"
title = "maxmemory moves values to the file instead of throwing keys away"
reason = "Redis answers a memory limit by evicting, which loses data, because memory is the only place it keeps anything. There is a file here, and the right answer to a memory limit on a system with a file under it is to move data to the file rather than delete it. So a database with a store attached demotes the values the maxmemory-policy picks, under exactly that policy, and every key a client wrote is still there afterwards and still answers with what was stored in it. Eviction is the right answer to a storage limit and that limit is the new maxstore setting, which is bytes on the file, minus one for no limit and zero for a file that may hold nothing. A storage budget of zero means migration cannot make room, so eviction is all that is left and the server behaves exactly as Redis does, which makes maxstore 0 the documented setting for a drop in cache. What a client can see is that evicted_keys stays at zero while memory comes down, and that DBSIZE does not fall. INFO memory reports maxstore, the bytes on the file and which of the two regimes is running, so an operator never has to work it out from three settings. A server with no store attached is in the evict regime and is Redis in every respect, which is every server until the file work attaches one. The one policy that reads differently is noeviction, which under the migrate regime still moves values. It says do not lose data and moving a value to the file loses none, so victims are picked the way allkeys-lru picks them and the promise the setting was made for is kept. The alternative is a server that was given a file, was given a limit, and answers writes with OOM until somebody finds the third setting that turns the file on, which is a trap rather than a default. Under the evict regime noeviction is unchanged and refuses the write."
status = "permanent"
spec = "14 section 4.1"

[[divergence]]
id = "D-30"
title = "RESTORE reads past the idempotency block on a newer stream payload and drops it"
reason = "A Redis 8.10 dumps a stream as type 27, which is the type 21 payload with a per group count and a stream wide idempotency block added on the end of it. The block holds the tracking window, the window size, the names of the producers that have been seen and the two counters that say how many producer ids arrived and how many of them were repeats. None of that has anything behind it here, for the reason D-27 gives, so the block is read to find the end of the payload and then dropped and the key restores with everything else in it intact. This is a smaller loss than it sounds, because the payload only ever carries the producer names and never any of the ids recorded against them, so a real Redis loading its own dump comes back with pids-tracked and iids-tracked at zero as well. Checked on 8.10.1 by recording two ids under one producer, dumping the key, restoring the payload under another name and asking: the restored key tracks no producers and no ids, exactly as this one does. The two counts inside the block that have only ever been seen as zero are refused rather than skipped when they are not, because nothing has been seen to write one and what follows a nonzero count cannot be read off a server, so guessing at it would be inventing a format instead of reading one. A payload this server writes goes out as type 21, which is the same data in a shape more servers accept, and a real 8.10.1 restores it and reports the same stream. This closes when the idempotency tracking lands with XCFGSET and XIDMPRECORD."
status = "until"
resolved_by = "M8"
spec = "14 section 5"

[[divergence]]
id = "D-31"
title = "VADD REDUCE is refused rather than ignored"
reason = "REDUCE asks for the vector to be projected onto fewer dimensions on the way in, using a random projection built when the set is created. The projection itself is not the problem, since the rotation this index already applies is one, but what it changes is what the set is: a client that sends 300 dimensions under REDUCE 100 has a 100 dimensional set afterwards, and VDIM has to say 100, and VEMB gives back the projection and not the vector. Accepting the option and storing the full vector anyway would leave that client with a set three times the size it budgeted for, being told by VDIM that it is the size it asked for, which is worse than being told the option is not here. So it is an error, and a client that wants the reduction can do it on its own side where it can see the matrix it used."
status = "until"
resolved_by = "M6"
spec = "10 section 9"

[[divergence]]
id = "D-32"
title = "NOQUANT, BIN and Q8 are recorded and change nothing"
reason = "The three of them pick how a vector set stores a vector: full precision floats, one bit a dimension, or one byte a dimension. This stores the full precision vector and a one bit RaBitQ code beside it whatever is asked for, and the search reads the codes to pick candidates and then the floats to rank them. That is at least as accurate as NOQUANT, which is the most accurate of the three, and it uses the memory of NOQUANT plus a thirty second, so a client asking for BIN to save memory does not get the saving. Refusing the options instead would break clients that pass BIN as a tuning hint and would gain them nothing, since the accuracy they would lose by being refused is accuracy they were trying to trade away in the first place. VINFO reports back what was asked for rather than what is stored, so quant-type says bin when BIN was sent, and that is the one field where this register is what a client has to read to know what happened. This closes when the format freeze decides whether a collection can be told to drop its floats."
status = "until"
resolved_by = "M6"
spec = "10 section 9"

[[divergence]]
id = "D-33"
title = "VSIM FILTER-EF raises the effort rather than bounding it"
reason = "FILTER is here now and it is a filter inside the scan, which is the part that matters and the part that has to be right. What is not the same is the number beside it. In Redis FILTER-EF is a ceiling on how much of the graph a filtered search may walk before it gives up, because the graph walk can wander a long way looking for the few nodes that match. The scan here does not wander: it reads the partitions nearest the query, and when a filter is selective it keeps going into further partitions until it has enough answers or until it has spent the widen budget in the tuning, so the giving up is already bounded and is bounded by the index rather than by the client. So the number a client sends raises how much is asked for, which is the same knob EF turns, and it cannot lower it. The consequence a client can see is that a filter matching almost nothing comes back with fewer answers than COUNT rather than with an error or with the whole set read, and that is the trade every filtered vector index makes. TRUTH FILTER is the way to ask for every match and get it, since that measures every vector in the set and the filter still decides which ones are measured. Zero means no limit in Redis and changes nothing here, which is the same behaviour by a different route, so it is not an error."
status = "permanent"
spec = "10 section 9"

[[divergence]]
id = "D-34"
title = "An object's members come back in key order and not in insertion order"
reason = "Members are stored sorted by length and then by bytes, which is what makes a member lookup a binary search that mostly compares lengths, so the order a client wrote them in is not kept anywhere. RedisJSON keeps insertion order, because it stores an object as a vector of pairs and appends. Every reply that writes an object out shows the difference, which is JSON.GET and JSON.MGET on any path that matched an object, and JSON.SET shows it on the way back rather than on the way in. It also shows in the order of the matches themselves rather than only in the bytes, because a wildcard over an object walks the members in the order they are stored: JSON.ARRLEN on $.* answers the same lengths and nils in a different order here, and so does every other command that answers one thing per match. A client that reads a wildcard reply by position has to be reading a wildcard over an array for that to mean anything anyway, and over an array the order is the same here as it is there. It is not a correctness difference for any client that treats a JSON object as a map, which is what the format says it is and what every JSON library does, and it is a difference for a client that compares two documents as text. The trade is deliberate: insertion order costs a linear scan on every member lookup, on every level of every path, and a path read is the operation the whole document model exists to make fast. The order here is at least total and deterministic, so the same document always writes the same bytes, which RedisJSON does not promise either: the object JSON.GET builds for several paths at once comes out of a hash map there and comes out in the order the paths were asked in here."
status = "permanent"
spec = "09 section 2"

[[divergence]]
id = "D-35"
title = "JSON.MGET reports every key it reads in its key spec"
reason = "RedisJSON registers JSON.MGET with one key at position one, which is wrong on its face: the command reads every argument but the last. COMMAND INFO there answers first key 1, last key 1, step 1, and here it answers first key 1, last key -2, step 1, which is what MGET itself answers in the same shape. This is a divergence because a client can read the numbers, and it is the right way round because everything that decides what a command may touch reads them too. An ACL rule that grants one key pattern would let a user read any key at all through JSON.MGET on a server that believes the module's registration, and a cluster would route a cross slot JSON.MGET to whichever node held the first key and answer from there."
status = "permanent"
spec = "12 section 2"

[[divergence]]
id = "D-36"
title = "A JSON write that fails on one match leaves the whole document alone"
reason = "An insert at an index the array does not reach is the error index out of bounds, and against a path that matched several arrays RedisJSON inserts into each one it can and returns the error on the first one it cannot, leaving the inserts it had already made in the document. JSON.ARRINSERT walks the matches from the last one back to the first, so the arrays that keep their insert are the ones after the one that failed rather than the ones before it: checked on 8.10.1 on {\"a\":[[1],[2,3]]}, where an insert at index two answers the error and the document comes back as {\"a\":[[1],[2,3,9]]}. The number family is the same rule walked the other way, since it goes forwards and a match that overflows leaves the matches before it already added to: {\"y\":5,\"x\":9223372036854775807} incremented on $.* answers the overflow error with y at six. Here the whole command is refused and the document is not touched. This is deliberate rather than an oversight. A command that answers an error and has already written half of what it was asked to write cannot be replayed, cannot be rolled back and cannot be reasoned about by a client that sees only the error, and every write here goes through one list of edits applied together so that a failure anywhere means none of them happen. Matching RedisJSON would mean giving that up for the two commands that refuse an argument rather than clamping it, and the client that would notice the difference is one that sent an index or an operand it already knows is wrong for some of the values it named."
status = "permanent"
spec = "09 section 2"

[[divergence]]
id = "D-37"
title = "The JSON text a command refuses is refused in different words"
reason = "Every JSON command that takes a value takes it as JSON text and has to say something when the text is not JSON. RedisJSON hands the argument to serde_json and sends its message back, so a bare word is expected value at line 1 column 1 and a trailing token is trailing characters at line 1 column 5. The parser here is not serde_json and its messages say what was wrong and how far into the text it got, so the same two arguments answer this is not the start of a value, at byte 0 of the JSON text and more text after the value the document is, at byte 4 of the JSON text. Neither is a code a client can branch on, and a client that shows the message to a person is showing them a sentence that says the same thing either way. It is registered because yo-compat compares error lines byte for byte and because there is no way to close it short of writing serde_json's line numbers into a parser that does not count lines, which would be inventing a position rather than reporting one. What is copied is the prefix, which is not the same on every command: JSON.SET, JSON.ARRAPPEND, JSON.ARRINSERT, JSON.MERGE and JSON.MSET send the message on its own, and JSON.ARRINDEX, JSON.STRAPPEND and the three in the number family send the same message with an ERR in front of it. That is a rule about which command the client sent rather than a rule about parse errors, it is what a client sees, and it costs one helper to follow. The one message that is copied exactly is bad input number, which is what the number family answers for text that is valid JSON but is not a number, because that one is not a parser message."
status = "permanent"
spec = "09 section 2"

[[divergence]]
id = "D-38"
title = "A JSON number is an integer or a double and there is no unsigned rung between them"
reason = "RedisJSON stores a number as one of three things, an i64, a u64 or a double, which is what serde_json does. This stores two, an i64 that is written as narrowly as the value allows and an f64, so a number above the largest i64 is held as a double: 18446744073709551615 comes back from JSON.GET there as itself and here as 1.8446744073709552e19, and JSON.TYPE says integer there and number here. The rung costs a tag and a branch on every number read to buy exactly the range from 2^63 to 2^64, which is a range no client is doing arithmetic in and reaches only by writing an unsigned 64 bit id into a document. A client with those ids should be sending them as strings anyway, which is what JSON itself recommends and what every JavaScript client is forced into by the same limit one bit further down. The visible edge is JSON.NUMINCRBY on the largest i64 there is, which answers numeric overflow here and answers on RedisJSON either the next number up or the same overflow error depending on whether the value sits in an array or in an object, since only one of their two update paths climbs onto the u64 rung. Copying that would mean copying which of their code paths a value happened to arrive by."
status = "permanent"
spec = "09 section 2"

[[divergence]]
id = "D-39"
title = "A number write that overflows does not put a null in the array or take the server down"
reason = "This is the same failed write D-36 is about, seen on a path that matched more than one number, and it is registered on its own because the two shapes RedisJSON answers with are not partial writes but damage. On 8.10.1 a JSON.NUMMULTBY by 1e308 against {\"a\":[7,7]} on $.a[*] answers ERR result is not a number and leaves the document as {\"a\":[null,7]}, a null written over the element the multiply failed on, so a document that held numbers now holds a null that nothing put there. The same command on a recursive path can take the whole server down instead: {\"a\":[[7]]} and {\"a\":[7,7]} on $..* both kill the process, while {\"a\":[[7,7]]} on the same path only leaves the null behind. An object member is not damaged either way, so {\"x\":7,\"y\":7} on $.* answers the error with the document intact. Here the command is refused as one piece, the document is not touched and the server stays up. The entry exists because yo-compat runs the wildcard paths and a server that died would otherwise read as a timeout rather than as a difference, and because anybody comparing the two by hand should know that the reference is the one behaving badly."
status = "permanent"
spec = "09 section 2"

[[divergence]]
id = "D-40"
title = "The path a command refuses is refused in different words, and two odd paths are read differently"
reason = "The other half of D-37. Every JSON command takes a path and has to say something when the path does not parse, and RedisJSON answers with its parser generator's line, so $[ is Error occurred at position 2, Error at position 2: expected one of the following: '<string>[,<string>,...]', '<number>', ['start:end:steps'], '*'. The parser here says what it wanted and how far into the path it got, so the same argument answers a `[` with no `]` after it, at byte 0 of the path. Both go out without an ERR in front of them, which is copied, and neither is a code a client can branch on. Two paths are read differently rather than reported differently. A path that starts with a $ and then is not JSONPath is taken by RedisJSON as a legacy path naming a member of that whole name, so JSON.SET key $$bad 1 writes a member called $$bad, while here it is a path error. A legacy path wrapped in quotes goes the other way: 'a' and \"a\" are a path error there and name a member called a here, quotes included, because a legacy path is a name and nothing else. Both are edges of a syntax nobody documents, both are reachable only by sending a path that is already wrong, and copying either one means copying which of their two parsers happened to get the string first."
status = "permanent"
spec = "09 section 2"

[[divergence]]
id = "D-41"
title = "JSON.MERGE onto a value inside an array of plain numbers works rather than answering bad object type"
reason = "On 8.10.1 a JSON.MERGE at a path that matched anything sitting inside an array whose elements are all numbers of one kind answers ERR bad object type and writes nothing, whatever the patch is. {\"a\":[1,2]} on $.a[0] is refused, and so are $.a[*], $.a[0:1], .a[0] and $..a[0], while the same document with one string, one null, one boolean, one container or even one double among the integers merges fine, and JSON.SET at the same path has never had any trouble with it. {\"a\":[1]} on $.a[0] is refused too, so it is not about the number of elements. That is an internal encoding showing through: a run of numbers of one kind is not held the way a general array is held, and the merge path is the one place that notices. Here the merge is done, because a client that stored [1,2] and a client that stored [1,\"x\"] are asking the same question and there is no rule anybody could write down that answers one and refuses the other. It is registered because yo-compat compares byte for byte and the reference is the one refusing."
status = "permanent"
spec = "09 section 2"

[[divergence]]
id = "D-42"
title = "JSON.DEBUG MEMORY answers this encoding's byte count and not RedisJSON's"
reason = "The command reports how much memory the value at a path takes, and the two servers do not store a document the same way, so there is no arrangement under which the same document answers the same number twice. RedisJSON reports what its allocator handed out for the tree it built, which is why a three member object with a two element array in it comes back as 168 bytes there. This reports the length of the encoded value, which is the number of bytes the document actually occupies in the file and in memory, since the encoding is the storage. The shapes match: a legacy path is one integer, a JSONPath is an array of them, a key that is not there is a zero on a legacy path and an empty array on a JSONPath, and a legacy path that matched nothing is ERR Path does not exist. Only the numbers differ, they are smaller here, and a client that branches on the exact byte count of a document on another server is measuring that server."
status = "permanent"
spec = "09 section 2"

[[divergence]]
id = "D-43"
title = "A filter's =~ is a POSIX extended regular expression and not the Rust regex crate's flavour"
reason = "RedisJSON compiles the right hand side of =~ with the Rust regex crate. This uses the engine in yo-common, the one ARGREP already runs on, which is POSIX extended syntax over bytes with a Thompson construction behind it. Both are unanchored, both mind their case, and both read a character class, a repetition, an alternation, a group and the two anchors the same way, so every pattern anyone writes by hand against a document field means the same thing on either server. They part company on the corners the two syntaxes name differently: the Perl shorthands \\d, \\w and \\s, the non greedy ??, the named group and the lookaround are the regex crate's and are not POSIX, and where POSIX reads them as a literal the regex crate reads them as a class. A pattern that will not compile matches nothing on both, which is the one corner that was worth matching exactly, because the reference answers an empty array there rather than refusing the path. Taking the regex crate into yo-doc would put it in the crate the C ABI links against for the sake of syntax nobody uses in a filter, so the engine already in the workspace is the one this runs."
status = "permanent"
spec = "09 section 2"

[[divergence]]
id = "D-44"
title = "Four corners of a projection expression are read differently, and one that does not parse is refused rather than dropped"
reason = "A projection is the expression form of a path that JSON.GET, JSON.MGET and JSON.RESP take, and 8.10.1 parses it with a generated parser whose recovery rules show through in four places. A leading space kills it there, so ` $.a + 1` answers an empty array while the same text with nothing in front of it answers the sum, and here the space is skipped and the sum comes back either way. A method chained onto a method parses there and answers nothing, so $.a.sum().length() is an empty array, and here it is a path error, because a method takes an operand and the answer of one is not an operand. A path wrapped in parentheses is read two ways on the same server: ($.a) is a projection for JSON.GET and answers the value, while the same argument to JSON.CLEAR or JSON.NUMINCRBY is read as the ordinary path $.a and really writes, so there is no single behaviour to copy and here it is a projection everywhere and every command but the three refuses it. And an expression that parses as neither a projection nor a path is dropped rather than reported: JSON.GET key '$.a' '$.a +' answers only the first path there, JSON.MGET with the same argument answers a nil per key, and JSON.TYPE, JSON.OBJLEN and JSON.OBJKEYS answer nil, while all of them are a path error here. Every one of the four is reachable only by sending an expression that is already malformed or already ambiguous, and what comes back on the reference is an empty array, a nil or a silently shorter reply rather than anything a client could branch on."
status = "permanent"
spec = "09 section 2"

[[divergence]]
id = "D-45"
title = "A key built by HIMPORT SET is an ordinary hash and OBJECT ENCODING says so"
reason = "HIMPORT arrived in 8.10 alongside a new pair of hash encodings, template-listpack and template-array, which store the field names once for a family of keys that share a fieldset instead of once per key. The command surface is exact here and the storage saving is answered a different way, because a hash in this engine already interns its field names per collection and already has a size ladder underneath it, and adding a second representation for the same saving is a storage project rather than a command. Everything a client can read off a key built by HIMPORT SET is identical: the fields, the values, the order they come back in, the count, the deadline that the replaced value took with it, and how every other hash command behaves on it afterwards. Two things differ and both are the encoding rather than the data. OBJECT ENCODING answers listpack or hashtable where the reference answers template-listpack or template-array, and a key built from a fieldset of two hundred fields climbs the size ladder here where the reference's template form stays a template whatever its size. A client that branches on the encoding string of a hash is measuring the server it was written against, which is the same argument D-1 makes about the sorted set."
status = "permanent"
spec = "08 section 3"

[[divergence]]
id = "D-46"
title = "A sealed backup holds the dataset as it stood at START, and the incremental file in it is empty"
reason = "BACKUP on 8.10.1 works by taking the multi part append only file apart: START writes the base RDB there and then, every write between START and SEAL lands in the incremental AOF beside it, and SEAL closes the pair off with a manifest, so what you get back is the dataset as it stood at SEAL. All three files land at the same moments here and LIST names them at the same moments, because the base really is written during START, and the difference is what is inside the second file. There is no append only file underneath this server, so there is no log of the writes between the two calls to copy into the incremental file, and it is written empty with startoffset 0 and endoffset 0 in the manifest. A sealed backup is therefore a point in time copy taken at START rather than at SEAL, it is internally consistent either way, and a real redis-server started on the directory reads it and comes up with the keys in it. Three smaller things follow from the same place. The snapshotting state is documented and can never be observed, because the base file is finished before START answers, so a status poll can only ever catch idle, incrementing, sealed or failed. The error field of BACKUP STATUS, which is empty on the reference unless a backup failed, carries a count here when the dataset holds keys that have no RDB shape at all, the graph, vector and sparse array kinds, since the alternative is a server with one vector set in it being unable to back up anything else. And BACKUP START with an argument after it answers an arity error naming backup rather than backup|start, because COMMAND INFO reports one arity for the container the way the reference does and the per subcommand table that would carry the better name is not built yet. Every subcommand takes exactly two words, so nothing legal is refused by that."
status = "permanent"
spec = "08 section 3"
