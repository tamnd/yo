[[divergence]]
id = "D-101"
title = "SCRIPT KILL always answers NOTBUSY because a script cannot run long"
reason = "A real server runs a script on the thread that took the command and lets it go past busy-reply-threshold, at which point other connections start getting BUSY and SCRIPT KILL is how you get out of it. There is no time limit here and no way to reach a running script from another connection, so the state SCRIPT KILL exists to break out of never exists and the command has nothing to say but NOTBUSY. The sentence is the one a real server writes for an idle server, so a client that calls it as part of a recovery path gets the answer it would get there when nothing is stuck. A time limit is worth having on its own and it brings the rest of this with it."
