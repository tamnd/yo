spec = "12 section 7"

[[divergence]]
id = "D-109"
title = "FUNCTION LIST lists libraries and functions in the order they were loaded"
reason = "The reference keeps libraries in one hash table and the functions inside a library in another, and it walks both to build the reply, so the order a client reads is whatever order the hash landed the names in. That order is not the load order, it is not alphabetical, and it changes when a name is added or removed because the table rehashes. This server keeps both in a vector and answers in the order they went in, which is the load order for libraries and the registration order for the functions inside one. The contents are identical either way, name for name, description for description and flag for flag, and the reply is a list rather than a map so nothing about it says the order means anything. A client that wants a stable order gets one here and gets an accident there, and the only thing that could break is a test that hard codes the accident."
