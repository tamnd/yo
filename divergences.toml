[[divergence]]
id = "D-100"
title = "redis.acl_check_cmd checks that the command exists and that the arity fits"
reason = "The call is supposed to answer whether the current user is allowed to run the command with those arguments, and there are no users and no rules here, so the honest part of the answer is the part that does not depend on them. It looks the command up, refuses a name that is not a command with the sentence a real server uses, refuses an argument count the command itself would refuse, and otherwise answers true. On a server with the default user and no restrictions that is the same answer a real one gives, which is the case a script is usually written against. It becomes a real check rather than a shape check when ACL lands, and until then answering false for something it cannot evaluate would be worse, since a script that guards a call on this would skip work it is allowed to do."
