[[divergence]]
id = "D-121"
title = "XREAD counts one keyspace lookup per stream where a real server counts two"
reason = "keyspace_hits and keyspace_misses agree with a real server command for command across every group, measured against 8.10.1 over a hundred and eighty five cases, and XREAD is the one shape where the number of lookups differs rather than the answer. Redis looks each stream up twice, once in the command itself to settle the identifier it was given and check the type, and once again to serve the entries out, and it counts both, so XREAD on a name that is not there adds two to the misses. Here the stream is looked up once, because the read is done under a hold that is taken over every named stream at the start and the entries come out of the same visit that resolved the identifier. The keymiss notification is not affected and still fires twice per stream, since that is said by the walk in front of the command and the walk models Redis's two lookups. Matching the counters would mean adding a second probe of every stream to a command that does not need one, on the path M7 is measured on, for a statistic. So the events agree and the counter is off by one lookup per stream on this one command."
status = "permanent"
spec = "12 section 6"

[[divergence]]
id = "D-122"
title = "The bundled modules on a real server add their own lookups to the two counters"
reason = "This one runs the other way round, since it is a real server counting something we do not. Redis calls moduleNotifyKeyspaceEvent before the check that would drop the event for the classes nobody subscribed to, so a module subscriber is told about every write whatever notify-keyspace-events says, and one of the modules that ships with 8.10.1 opens the event key in database zero when it is told. That lookup goes through the same lookupKey the counters live in, so SET k v on a fresh server adds one to keyspace_hits and DEL k adds one to keyspace_misses, and the same two lines run in database nine count the other way, because the key the module opens is in database zero and is not there. MODULE UNLOAD cannot take any of the four loadable modules out, so there is no way to turn it off and no way for a client to tell the module's lookups from its own. The numbers here are the ones a server with no modules loaded would report, which is the rule the counters are documented by, and every case in the comparison is measured with the module's share taken out by running it twice, once with database zero empty and once with a decoy under every name."
status = "permanent"
spec = "12 section 6"

[[divergence]]
id = "D-123"
title = "CLIENT INFO and CLIENT LIST report yo's own accounting, and a pause lets go on the next turn"
reason = "The container has ID, GETNAME, SETNAME, SETINFO, INFO, LIST, KILL, PAUSE, UNPAUSE, REPLY, NO-EVICT, NO-TOUCH and HELP, and it does not have TRACKING or the two that go with it. HELP lists what is here rather than what Redis has, on purpose, so a client reading it to find out what it can send is not told about a subcommand that would be refused. Most of this row is about the report, which INFO gives for one connection and LIST gives once per connection. Nine of the forty fields describe memory a real server holds per client and yo does not hold in the same shape, so they are answered honestly rather than left out, since the tooling that parses this splits the line on spaces and looks for names it knows. A connection here has one reply buffer and not a buffer plus a list of reply blocks, and it has no shared reply objects at all, so oll, omem, omem-shared and omem-unshared are zero and obl is the length of the one buffer. tot-mem is the room the two buffers are holding rather than a walk of every allocation the client is behind, which is the same number INFO memory counts a connection as. qbuf and qbuf-free are the read buffer as of the last read or flush and not as of this instant, and the read buffer here is compacted as soon as nothing points into it, so a connection that has just been framed reports nothing waiting where a real server still reports the bytes of the command it is running. argv-mem is the bytes of the arguments of the last command, and Redis's is a running sum it keeps across the command's life. avg-pipeline-len-sum and avg-pipeline-len-cnt are commands run and reads that carried them, so dividing one by the other gives the pipeline depth the field is named for, and a real server's pair is off by the command doing the asking. The flags field carries the five letters yo can be in the state of, which is P, x, U, e and T, out of Redis's nineteen: there is no tracking, no replication link, no ASAP close and no read only replica here to be in the state of. user is always default and redir is always minus one until there is an ACL and client side caching to make them anything else. Two of those fields are read differently by the two commands. A connection describing itself knows what its reply buffer held before the command started writing and which protocol the reply being composed is in, and a connection describing somebody else has only what that connection published at its last flush, so obl and resp on a LIST line are as of the other connection's last turn. Killing a connection on another thread is not immediate either. The kill sets a bit on the row and the thread that owns the connection lets go of it at its next turn through the loop, which is the same turn a reply would have gone out on, so a client that was about to be answered can still be answered before the socket goes. A real server frees the client inside the command. The pause has the same shape of lag at both ends. A connection whose command was held is let go on the next turn of the loop it is on rather than inside the command that ended the pause, and a pause that runs out on a quiet server is noticed on that thread's next turn, which the loop keeps short while it is holding anybody. So a held command runs a turn late and never earlier than it should, and both ends of that were measured against 8.10.1 and came back inside the same bucket. What a pause covers is also narrower here. Redis stops active expiry and eviction for the length of one as well, so that a failover cannot lose a write it has not replicated, and yo keeps both running: nothing a client can read changes, because a key past its deadline reads as missing either way, but the deletion is not held back the way a real server holds it back."
status = "until"
resolved_by = "M8"
spec = "12 section 9"

[[divergence]]
id = "D-124"
title = "A monitor is fed at the end of the batch rather than inside the command"
reason = "The line itself agrees with a real server everywhere it was measured, which is seventy cases covering the format, the quoting, the database, what is fed and what is not, the transaction order, the script order, the redaction, the keyspace refusal, the pause exemption and the two monitors that get identical bytes. What differs is when the line arrives. A real server writes it into the monitor's reply buffer from inside call, so a monitor that pipelined two commands of its own reads its first reply, then the line for it, then its second reply. Here the command runs on whichever thread its connection landed on and the monitor is on whichever thread it landed on, so the line goes into that thread's mailbox and is delivered at the end of the batch, the way a published message is. A monitor that sends one command at a time and reads the answer sees the same order a real server gives, because the batch is that one command. A monitor that pipelines gets both of its replies and then both of the lines. Nothing else is affected: lines about other connections are in the order the commands ran in, since one mailbox is drained in order, and the stamp is read when the line is rendered rather than when it is delivered, so the times are the times the commands ran at. Fixing it means the feed writing into a reply buffer another thread owns, which is the thing the mailbox exists to avoid, so it stays until there is a reason to pay for it. Three of the probes a comparison would use name commands yo has not got yet, which is MEMORY USAGE, LASTSAVE and ROLE, and those are an unknown command here rather than a command that was hidden."
status = "permanent"
spec = "12 section 9"

[[divergence]]
id = "D-125"
title = "BGSAVE writes the file before it answers, so no save is ever in progress"
reason = "A real server forks and the child writes the file out of a copy on write image while the parent carries on serving. There is no fork here, so BGSAVE builds the image and writes the file before it answers, and then says Background saving started. Everything a client reads about that reply agrees with a real server: the sentence is the same, LASTSAVE has already moved when the reply arrives, rdb_saves has already counted it and the file on disk is complete. What differs is the window in the middle. rdb_bgsave_in_progress is a zero that is never anything else, so a script that waits for it to go to one and back to zero waits forever rather than one tick, and the Background save already in progress error a real server gives a second BGSAVE cannot happen here because there is never a first one still running. The cost is paid by the client that asked rather than by nobody: a BGSAVE on a large dataset holds the thread it is on for as long as the file takes to write, where a real server hands that to a child. The fix is a writer thread that takes a consistent read of the keyspace, which needs the same borrowing walk the snapshot writer already wants, so it goes with that work rather than in front of it."
status = "permanent"
spec = "07 section 5"

[[divergence]]
id = "D-126"
title = "BGREWRITEAOF answers the sentence and rewrites nothing"
reason = "There is no append only file here. appendonly reads no, it is an immutable setting and it cannot be set to yes, so a client that looks before it asks already knows there is nothing to rewrite. The command is here because tooling calls it blind on the way to something else, and refusing it would break a script that has no way to act on the refusal. So it answers Background append only file rewriting started, adds one to aof_rewrites and does nothing, and a client that polls aof_rewrite_in_progress afterwards reads the zero it is waiting for. The one thing that could mislead somebody is aof_rewrites counting rewrites that did not happen, and it counts requests rather than files for exactly that reason: the number says how many times the command was called, which is true, and aof_enabled next to it says there was nothing to write. Durability here belongs to the file the keyspace sits on and is already on disk before a command returns, which is what makes an append only file a second copy rather than the copy, and that is why there is not one."
status = "permanent"
spec = "07 section 5"

[[divergence]]
id = "D-128"
title = "DEBUG QUICKLIST-PACKED-THRESHOLD is remembered and read by nothing"
reason = "On a real server this is the size above which a list element stops being packed into a listpack node and gets a plain node of its own, and a test suite turns it down to a few bytes so that a list of short strings takes the path a list of long ones would. There are no quicklists here. A list is a rope of arena runs and what decides whether an element sits inline or gets its own run is the run layout and not a threshold anybody can set, so there is nothing for the number to change. It is accepted rather than refused because the suite that sets it carries on regardless of the answer and a refusal would read as the command missing, and the value is kept rather than dropped so that the day a size threshold does mean something here it is already being parsed and bounded the way the reference parses and bounds it. The bound is the reference's real one, bigger than nothing and no bigger than four gigabytes less a megabyte, which is not what its own error sentence claims."
status = "permanent"
spec = "12 section 9"

[[divergence]]
id = "D-129"
title = "DEBUG SLEEP holds one thread rather than the whole server"
reason = "A real server is one thread doing the commands, so DEBUG SLEEP stops everything and that is what it is for: a test that wants a slow command to block another client, or wants a timeout to fire. Here the connection lands on one of several shard threads and the sleep holds that one, so another connection on another thread carries on. Running the server with --threads 1 gives the reference behaviour exactly, and that is the answer for a test that needs it rather than a lock across every thread, because a lock every command has to take on the way in would cost the whole design to make one debug command block harder. What still works on any number of threads is the part most tests actually use, which is that the sleeping connection itself is late by the time asked for."
status = "permanent"
spec = "12 section 9"

[[divergence]]
id = "D-130"
title = "COMMAND DOCS sends no doc_flags field"
reason = "A real server tags a handful of commands in COMMAND DOCS with doc_flags, which is a set holding some of deprecated, syscmd and comingsoon, and leaves the field out of every command that has none. Nothing here carries any of the three, so the field is left out everywhere rather than sent empty, which is what the reference does for a command with no flags and is why this only shows on the few that have one. DEBUG is the first of those to ship here, and its syscmd tag means what it says: this is a command for the system and not for a user, so a documentation generator hides it. Nothing branches on it and no client library reads it, which is why it is written down rather than invented. It goes in with the rest of the documentation fields, next to the arguments list and the replies, which is the same change as D-13's tips and key specs and wants the same new column in the command table."
status = "until"
resolved_by = "M8"
spec = "12 section 9"

[[divergence]]
id = "D-131"
title = "DEBUG RELOAD takes MERGE and does nothing with it"
reason = "On a real server MERGE is what makes a key that is in the file and also in memory legal. Without it a NOFLUSH reload that finds a name twice logs RDB has duplicated key and then takes the server down with a Guru Meditation, which is measured against 8.10.1 rather than read off the documentation: the reference dies on the spot. A key arriving over one that is already there is an ordinary import here, the same import RESTORE REPLACE, COPY and MOVE all use, so the word has nothing to turn on and NOFLUSH on its own behaves the way NOFLUSH MERGE does. The word is accepted rather than refused because a suite that sends it is asking for the behaviour it already gets, and refusing it would read as the option missing. Nothing a client can see is worse off, and one thing is better, which is that a debug command cannot end the process."
status = "permanent"
spec = "12 section 9"

[[divergence]]
id = "D-132"
title = "A reload is not one instant of the keyspace"
reason = "A real server forks for the save and then loads on the one thread that runs commands, so nothing can be written between the two halves and the dataset that comes back is exactly the dataset that went out. Here the save walks one stripe of one database at a time, the load walks the file the same way, and another connection on another thread can write in between. A key written after its stripe was walked and before the load reaches it is dropped by the flush, which is the visible cost: on a real server the same write would either be in the file or arrive after the reload and survive. This is the same window SAVE already has, for the same reason, and it closes with the same change, which is a writer that takes a consistent read of the whole keyspace. Running with --threads 1 removes it entirely, because then there is no other thread to write, and that is what the compatibility suite runs under."
status = "permanent"
spec = "12 section 9"

[[divergence]]
id = "D-133"
title = "DEBUG RELOAD refuses rather than dropping a key with no RDB form"
reason = "A graph, a vector index and a sparse array have no RDB type byte, so they are not in the file a save writes and the count of what was left out is already reported as yo_rdb_last_save_skipped_keys. A reload flushes and reads the file back, so on a dataset holding one of those the flush would be a delete dressed as a round trip. Rather than do that quietly it answers with the number of keys that would go and says to use NOFLUSH, which keeps them and lets everything else land on top. Nothing on a real server can be in this position, since every type it has can be written, so there is no reference behaviour to match and the sentence is ours. A client that wants the reference behaviour on a dataset that is all Redis types never sees this, because the count is nought and the reload goes ahead."
status = "permanent"
spec = "12 section 9"

[[divergence]]
id = "D-134"
title = "DEBUG OBJECT points at the record rather than at an object header"
reason = "A real server prints the address of the robj, which is a heap allocation holding the type, the encoding, the reference count, the LRU field and a pointer to the data. There is no such header here. A value is a record in an arena, with the type and the encoding and the access field packed into the front of it and the body in a slot the record names, so the nearest thing to the address Redis prints is where that record currently sits. That is what at answers. Nothing on either server can dereference the number, since it is on the other side of a socket, and the two things a person does with it both still work: telling two values apart, and watching one address stop changing across a run. What does not work is comparing the number against anything, because it moves when the arena the record is in compacts, which is a thing a real server's pointer does too when the value is rewritten. It is printed in the same 0x form so that a suite reading the line by field finds a number where it expects one."
status = "permanent"
spec = "12 section 9"

[[divergence]]
id = "D-135"
title = "DEBUG SDSLEN reports no spare room and no allocator rounding"
reason = "Six numbers come back and two of them are about the data. key_sds_len and val_sds_len are the lengths of the name and the value and they are exact here. The other four are about jemalloc: the avail pair is the room the sds header left on the end of the buffer for the next append, and the zmalloc pair is what the allocator actually handed back for the request, which is why the reference answers a 32 for a one byte key and a nought for a value that is embedded in the object header rather than allocated at all. Neither question exists here. A name is stored packed into the record with nothing after it and a string value is stored at exactly its length, so the honest answer to how much spare room is on the end is nought and the honest answer to how many bytes were taken is the length, and those are what the line says. A suite that reads this command reads the two lengths, which is why it is worth answering at all, and a suite that asserts on the other four is asserting on the allocator the reference was built against rather than on anything Redis promises."
status = "permanent"
spec = "12 section 9"

[[divergence]]
id = "D-136"
title = "A negative zero score keeps its sign in a small sorted set"
reason = "ZADD k -0 m and then ZSCORE k m answers -0 here and 0 on a real server, but only while the sorted set is small enough to be listpack encoded. Make the same set big enough to be a skiplist and the reference answers -0 as well, which is what says this is the storage and not the parser: a listpack stores the score as the text d2string wrote, that text is -0, and the listpack turns anything that reads as an integer back into one on the way in, so the sign is gone before anything reads it again. A skiplist keeps the double itself and nothing rounds it. Here a score is a double wherever it is kept, so both encodings answer the same thing, and the thing they answer is the one the client sent. DEBUG DIGEST-VALUE shows the same difference for the same reason, since the score goes into the digest as the text it prints as. Nothing else can see it: negative zero compares equal to zero, sorts in the same place and adds the same way, so the only way to tell the two servers apart is to ask for the score back and read the sign."
status = "permanent"
spec = "5 section 3"

[[divergence]]
id = "D-137"
title = "A rule naming a subcommand that does not exist is accepted"
reason = "ACL SETUSER u +config|nope is an unknown command on a real server and is taken here. Redis gives every subcommand its own row in the command table with its own bit, so it can tell a subcommand that exists from one that does not; there are no subcommand rows here yet, which is D-114, so a rule of that shape goes through the mechanism Redis keeps for the other case, a list of first arguments a command is allowed with. That mechanism is Redis's own and it is what a real server uses for +get|somearg, so the gate reaches the same answer as the reference for every rule an operator would actually write: +config|get lets CONFIG GET through and nothing else, and the describe path reads it back the same way. The difference is only in what happens to a typo, which a real server catches at SETUSER time and this one lets stand as a rule that never matches anything. The deny side is the same shape: -config|get is taken and enforced, because a container that was allowed outright keeps a short list of first arguments it is refused with, and -config|nope is taken and never matches anything, while -get|nope is refused outright the way a real server refuses it, since GET has no subcommands for a rule to be about. Command categories work the same way round and are exact, because the categories a container's subcommands hold beyond the container's own are written down in table::SUBCATS, so -@admin reaches CONFIG GET and leaves CONFIG HELP alone. It goes away with the subcommand table, and so do the other two halves of it, which are that ACL GETUSER cannot report a subcommand as its own allowed command and that ACL CAT cannot list one."
status = "until"
resolved_by = "M8"
spec = "12 section 3"

[[divergence]]
id = "D-138"
title = "CONFIG SET takes the same setting twice and keeps the last value"
reason = "CONFIG SET maxmemory 0 maxmemory 0 answers OK here and is refused on a real server with CONFIG SET failed (possibly related to argument 'maxmemory') - duplicate parameter. The reference reads the names in one pass and the values in another, which is why it can see a repeat at all: the first pass looks each name up and puts it in a set, and a name already in the set is the refusal. It matches on the setting rather than on the spelling, so hash-max-ziplist-entries and hash-max-listpack-entries are the same name twice, and an unknown name is found before a repeat is, since the lookup comes first. Here the names and the values are read together in one pass, each setting is staged into its own slot, and a second write to a slot simply overwrites the first, so the command takes the last value and applies it. Nothing else about the command differs: the whole set is still read and checked before any of it is applied, which is the part that matters when one command names several settings and the third one is wrong. It goes away when CONFIG SET is split into the two passes the reference uses, which is also what would let an unknown name be reported ahead of a value that could not be parsed."
status = "until"
resolved_by = "M8"
spec = "12 section 2"
