reason = "The tree a profile prints carries a time on every iterator and the list of steps carries one on every step. Ours are real for the three that cost nothing to take, which are how long the words took to read, how long the query took to turn into something walkable and how long the whole command took, and real for the root of the tree, which is the whole walk. Everything under the root and every step in the list reports nothing, because reading a clock twice for every document a branch answers costs more than answering it does and this is a command a client is allowed to run in production. The shape of the tree also differs in one place that is not about time. A real server splits a numeric or a geo range into one child iterator per index block under a union, so a range over a wide index prints a union of a dozen leaves where we print one leaf naming the ends of the range, and the reading counts underneath are per block where ours are per range. There is a third difference, which shows up under a bare LIMIT on an aggregation. A real server runs the pipeline a row at a time and stops walking as soon as the window is full, so FT.AGGREGATE i * LIMIT 0 3 over six documents reports three reads and two rows through the index step. We walk the whole answer and then cut it, so the same command reports six and six. The rows that come back are the same either way and only the counts differ. The counts everywhere else are measured to match, down to the way a branch asked twice for the same document counts it once."
status = "until"
resolved_by = "M8"
spec = "09 section 5"

[[divergence]]
id = "D-91"
title = "Every vector field is searched exactly, whatever index the schema asked for"
reason = "A schema declares a vector field as FLAT or as HNSW, and this side stores both the same way: every document's vector at full precision in one flat run of floats, with a KNN and a range each a pass over it. FLAT is exactly that already, so a FLAT field behaves identically. An HNSW field asked for a graph and gets an exact answer instead, which is more than the graph promises rather than less, because a graph is an approximation with a recall short of one and a pass has perfect recall by construction. So an HNSW field on this side never misses a neighbour a real server would have found, and can find one a real server misses. The cost is the pass, which is linear in the number of documents that have written to the field where a graph is meant to be sublinear, and that is the part a later change replaces with a real graph. Everything about the reply is identical in the meantime: the same neighbours come back in the same order, the distances match to the last digit on all four metrics, EF_RUNTIME and the other graph knobs parse and are accepted and simply have nothing to tune, and a query that narrows before it measures narrows first on both sides."
status = "until"
resolved_by = "M6"
spec = "10 section 3"

[[divergence]]
id = "D-92"
title = "A WITHSORTKEYS sort key on a numeric field is always tagged as a number"
reason = "A sort key comes back with a sigil in front of it saying what kind of thing it is, `#` for a number and `$` for a string, and a real server picks the sigil from where it read the value rather than from what the schema calls the field. There is exactly one cell where that shows. A numeric field that is not SORTABLE, sorted on by a query that loads the whole document, is read back off the key as text on a real server and so comes back as `$1` where we say `#1`. Every other combination already matches: a SORTABLE numeric is `#` on both sides whatever else the query asked for, the same non-sortable numeric under NOCONTENT or under a RETURN is `#` on both sides because neither loads the key, and a text field is `$` on both sides throughout. The value itself is identical in all of them and only the one leading byte differs, so a client that reads the number rather than the tag sees no difference at all. This is old and has nothing to do with vectors; it turned up while comparing a vector query that happened to sort on a plain numeric field."
status = "until"
resolved_by = "M8"
spec = "09 section 2"

[[divergence]]
id = "D-94"
title = "An index FILTER that names no field does not crash the server"
reason = "FT.CREATE c PREFIX 1 c: FILTER 1==1 SCHEMA t TEXT is accepted by Redis 8.10.1 and then the first write under the prefix kills it. HSET c:1 t alpha segfaults, signal 11 at address 0xfffffffffffffff8 inside redisearch.so in rlookup::RLookup::load_rule_fields, and the container has to be recreated. Reproduced twice from a clean container. The cause is visible from the shape of the thing: the filter is evaluated over a row loaded from the key, the row is built out of the fields the expression names, an expression naming none leaves nothing to load and the loader walks off the end of it. Here the same create is accepted and the same write is filtered on a constant, so 1==1 indexes every key under the prefix and 0 indexes none, which is what the expression says. There is nothing to match on the other side because the other side is a crash rather than an answer, and copying it is not on the table."
status = "permanent"
spec = "09 section 2"

[[divergence]]
id = "D-95"
title = "_FT.DEBUG answers without having to be turned on at startup"
reason = "Redis refuses every _FT.DEBUG subcommand with `Debug commands are disabled, please follow the redis configuration guide to enable them` unless the server was started with enable-debug-command. That gate is on the container command rather than on any one subcommand, so a default install has the whole family and can use none of it, and the only way to turn it on is a restart. Here they always answer. Nothing in the eight that are implemented writes anything: they read the term dictionary, one posting list, one tag or numeric field, one row of the document table and the document number counter, and every one of them is a question the same client could answer more slowly with FT.SEARCH and FT.INFO. A debugging aid that needs a restart before it can be used is not there at the moment somebody needs it, which is the only moment it is worth having. A client that wants the gate can refuse the command itself; a client that has the gate cannot ask for the answer."
status = "permanent"
spec = "09 section 5"

[[divergence]]
id = "D-96"
title = "DUMP_NUMIDX answers one range where a real server answers several"
reason = "A real server keeps a numeric field as a tree of ranges and splits a range once it holds enough distinct values, so a dump of one comes back as a list of lists with one list per range: three hundred documents over three hundred values answer four ranges here of 134, 123, 35 and 8 documents, and the split points depend on the order the values arrived in as well as on the values. We keep one ordered list per field, so a dump answers exactly one list holding every document in the field, ascending and each once, and a field nobody has written to answers no lists at all rather than one empty one. The documents named are the same set on both sides, including the numbers that belong to documents which have since been deleted or rewritten, because neither server walks the list to take those out. The outer nesting is the whole of the difference and it is a report about the shape of the index rather than about its contents, which is why it is not worth building a range tree to match."
