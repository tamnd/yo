[[divergence]]
id = "D-110"
title = "A library's own variables are per thread rather than per process"
reason = "The reference runs every function in one interpreter behind one lock, so a local declared at the top of a library is one variable for the whole server and a counter kept in one counts every call. This server has an interpreter per thread and compiles a library separately in each of them, so a library that keeps state in a local keeps one copy per thread that has run it, and a counter counts the calls that landed on that thread. What a library registers is the same everywhere: the names, the descriptions and the flags come from one load on one thread and are kept once for the server, so FUNCTION LIST and FCALL agree from every connection. What differs is only state a library keeps for itself between calls. The reference's own documentation tells a library not to do that, because the value is lost on every reload and never reaches a replica, so a library that follows the advice cannot tell the difference. Closing it would mean one interpreter behind one lock for the whole server, which is the thing this design exists to avoid."
