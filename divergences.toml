[[divergence]]
id = "D-120"
title = "A module read at an empty key complains about its arguments where a real server answers nothing"
reason = "JSON.GET nk with a path that does not parse answers a nil on a real server and an error here, and JSON.TYPE does the same, and VSIM at a name that is not there answers an empty array however bad the COUNT behind it is. The reason is the order the two do the work in. A module on a real server opens its key first and reads the rest of the line afterwards, so a key that is not there ends the command before the arguments are ever looked at, and the not there answer is whatever that command gives for an empty key. Here the arguments are parsed on the way in, the same way every core command parses them, and the parse fails before anything is looked up. The key miss notifications are the same on both sides, because those are said in front of the command by the dispatch path rather than from inside the parse. What differs is the reply to a line that is wrong in two ways at once, which is a shape nobody sends on purpose. Fixing it means each of these commands checking the key before it reads its own arguments, which is a change to a dozen module readers and is worth doing on its own."
