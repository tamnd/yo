[[divergence]]
id = "D-111"
title = "A dumped payload is stamped with an older version and picks the plainest type"
reason = "DUMP and FUNCTION DUMP both hand back the same framing a real server does, and the bytes inside it are not always identical. Two things differ and both are deliberate. The version in the footer is twelve here and fifteen on 8.10.1, because what that number promises is how old a server can be and still read the payload, so writing the lowest version that covers every shape this server produces makes a payload loadable by more servers rather than fewer. The other is the type byte, where each kind goes out as the plainest legal type for it rather than as the newest one. That only shows on lists today: a list goes out as the type 1 every Redis since 2.6 reads, where 8.10.1 writes the quicklist type 18 and packs the elements into listpack nodes inside it, so the two payloads hold the same list in different shapes and are different lengths. The strings inside are LZF compressed now, on the same rule and with the same compressor Redis uses, so that half of this note is gone. Neither of the two that are left changes what a payload means. A payload written here loads into 8.10.1 and a payload written there loads here, which is checked in both directions for every kind, for function libraries and for values large enough to be compressed. What a client can see is the length of the bulk string and the two version bytes, so anything comparing two payloads byte for byte across servers will see this, and nothing that restores one will. DEBUG OBJECT's serializedlength is the same measurement with the framing taken off, so it reads differently on the same list for the same reason, and it is a second view of this rather than a divergence of its own."
status = "permanent"
