[[divergence]]
id = "D-118"
title = "SMOVE says the destination is new before it says the member left the source"
reason = "A real server publishing the new class for SMOVE says srem on the source, then del if that was the last member, then new on the destination and sadd. Here the new comes first and the other three follow, in the right order among themselves. The reason is where the two halves come from. The srem and the del are said by the command once the move is done and it knows what happened, and the new is said by the storage layer at the moment the key appears, which is inside the move. That is the order every other command wants, because new is meant to arrive in front of the write that caused it, and SMOVE is the one place where the write that caused it is the second half of a pair whose first half is news of its own. Getting it exactly right would mean either splitting the move into two calls that publish in between, which gives up the single hold that makes SMOVE atomic across two stripes, or working out in front of the move what the move is going to do, which puts two more reads on the path for every client that has notifications on and duplicates the operation's own rules in the layer above it. Neither is worth it for the position of one event in a class that is off by default and that Redis leaves out of A on purpose. The set of events is the same, and a client on the default flags sees no difference at all, since new is not one of the classes A turns on."
