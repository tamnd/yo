name: ci

# What runs on every push and every pull request, and nothing else. The rule for
# this file is that a pull request finds out in under three minutes, because a
# check that takes longer than the time it takes to context switch is a check
# people learn to ignore.
#
# Everything that cannot meet that budget lives in deep.yml, which runs nightly,
# on demand against any branch, and on a pull request labelled `deep`. Miri,
# ThreadSanitizer, fuzzing, the release test matrix, the benchmark smoke run and
# the cold build from source are all there. None of them has ever caught something that only
# appears between one commit and the next, and all of them were making the
# common case slow.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are large, slow to save and restore, and useless
  # across the fresh checkout every job gets. Turning them off makes the cache
  # smaller and the build faster, which is the opposite of what the name
  # suggests and is the right call on a runner.
  CARGO_INCREMENTAL: 0
  # Debug info is most of what rustc emits and most of what the linker then has
  # to chew through, and no CI job here reads a backtrace line number. Turning
  # it off is the single biggest saving in this file, worth about a third of the
  # wall clock on Windows and most of the cache size everywhere.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting and lints first, so a run that is going to fail on style fails in
  # under a minute instead of after the test matrix.
  style:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          # Only main writes the cache. A pull request reads main's and skips
          # the upload, which is twenty to forty seconds a job that nobody was
          # getting anything back for: the next pull request has a different
          # cache key anyway.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      # Would this tree publish. Not the real dry run, which builds every crate
      # from its own tarball and costs minutes; this is the manifest half of it,
      # which is where the failures actually are. A path dependency with no
      # version, a missing description, a keyword crates.io will not take: all
      # of those are refused here in about a second. Finding them at the tag
      # instead means a version number that has been used and cannot be reused,
      # so the fix is a release nobody wanted to cut.
      - run: cargo package --workspace --no-verify --allow-dirty
      # A workflow file that does not parse produces a run with no jobs in it,
      # which reports as a failure with nothing to click on and no log. That is
      # the worst failure mode CI has, because the thing that broke is invisible
      # in the check list. One unquoted colon in a `run:` line is enough to do
      # it. Parsing them here costs a second and puts the error next to the
      # line number.
      - name: the workflow files parse
        run: |
          python3 - <<'PY'
          import sys, yaml, pathlib
          bad = False
          for p in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              try:
                  yaml.safe_load(p.read_text())
              except yaml.YAMLError as e:
                  bad = True
                  print(f"{p}: {e}")
          sys.exit(1 if bad else 0)
          PY

  # Debug only. The release matrix moved to deep.yml, because building the whole
  # workspace twice was most of this job and a bug that shows up only under
  # optimisation is a nightly problem rather than a per commit one.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked

  # The floor stays green too. Held about six months behind stable, and the
  # number lives in AUDIT-2026-08.md section 1 so there is one place to bump it.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # rust-toolchain.toml pins the working toolchain, and it has to be out of
      # the way for this job to test what it says it tests.
      - run: rm rust-toolchain.toml
      - run: cargo test --workspace --locked

  # The SPSC lane and the stripe lock are the two places where two threads touch
  # the same bytes. Loom enumerates the interleavings a weak memory model allows
  # rather than hoping the test machine produces the interesting one. Cheap
  # enough to stay on the fast path.
  loom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test -p yo-shard --release --locked --lib spsc::loom
        env:
          RUSTFLAGS: --cfg loom
          LOOM_MAX_PREEMPTIONS: "3"
      - run: cargo test -p yo-common --release --locked --lib lock::loom
        env:
          RUSTFLAGS: --cfg loom
          LOOM_MAX_PREEMPTIONS: "3"

  # Documentation is part of the interface. A broken intra doc link is a broken
  # link in the published API reference, so it fails the build.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: rm rust-toolchain.toml
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings --cfg docsrs

  # Crash injection. The full hundred thousand trial gate is a release step and
  # takes half a minute on a quiet machine, which is too long to spend on every
  # push, so this runs a fifth of it across four shapes instead. The shapes
  # matter more than the count: a small page reaches a boundary every few
  # records, a large one almost never does, forty records per trial means the
  # fault usually lands in the first page, and sync durability leaves so little
  # in flight that it exercises a different kind of wreckage from the default.
  #
  # Seeds are fixed rather than drawn from the clock. A job that picks its own
  # seeds finds more, but it fails once a month on a seed nobody wrote down,
  # which is not a bug report.
  crash:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release --locked -p yo-crash --bin yo-crash
      - name: twenty thousand faults, four shapes
        run: |
          ./target/release/yo-crash --trials 8000
          ./target/release/yo-crash --trials 4000 --page-len 8192 --records 400 --seed 2000000
          ./target/release/yo-crash --trials 4000 --page-len 65536 --records 800 --seed 3000000
          ./target/release/yo-crash --trials 2000 --records 40 --seed 4000000
          ./target/release/yo-crash --trials 2000 --sync --seed 5000000

  # The header and the model are generated, and a generated file that somebody
  # edited by hand is a header that no longer matches the library. This job
  # regenerates both and fails if the result differs from what is checked in.
  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask check

  # Y7 says a command path does not allocate, which is a claim that decays the
  # moment nothing checks it. This builds a debug yodb with the allocation check
  # in report mode, sends about nine thousand commands covering every type and
  # fails if anything asked the allocator for memory. Debug on purpose: release
  # inlines the frames into each other and the report comes back naming
  # `serve_command` for everything, which tells nobody anything.
  #
  # It is here and not in `deep.yml` because the fix is nearly always one line
  # and the person who wants to know is the one who just wrote it.
  alloc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask alloc

  # The C header is the surface every binding sits on, so it gets compiled the
  # way a caller would compile it: two compilers, every dialect they support,
  # warnings as errors. Then the example is linked and run, because a header
  # that compiles and a library that works are two different claims.
  capi:
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: examples/c/build.sh ${{ matrix.cc }}
        env:
          CXX: ${{ matrix.cc == 'gcc' && 'g++' || 'clang++' }}
