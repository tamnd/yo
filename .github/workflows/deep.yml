name: deep

# The checks that cannot finish in the three minutes ci.yml is held to. Miri
# under both borrow models, ThreadSanitizer over the crates that have two
# threads in them, the fuzzers, the release test matrix, the benchmark smoke run
# and a cold build from source with no cache and no toolchain file.
#
# They run nightly, on demand against any ref, and on a pull request carrying
# the `deep` label. A milestone pull request should carry that label, because a
# milestone is exactly when the format, the unsafe blocks and the benchmarks all
# move at once. An ordinary patch does not need it.
#
# Every job has a timeout. On 2026-08-26 a Miri job sat on one test for five
# hours and seventeen minutes and was killed by the runner's own six hour
# ceiling, which is a long time to wait to be told nothing. A job that hangs
# should say so while somebody is still awake.
#
# Reproducing a Miri shard locally is one shard at a time:
#
#     MIRIFLAGS="-Zmiri-deterministic-floats -Zmiri-strict-provenance \
#       -Zmiri-disable-isolation" \
#       cargo +nightly miri nextest run --locked -p yo-record --test-threads 4 \
#         -E 'not test(/^compact::/)'
#
# One at a time and not the whole matrix at once. Miri holds the interpreted
# program's whole heap, and eleven of them side by side will take every
# gigabyte a laptop has and start swapping, which looks like a hang and is one.

on:
  schedule:
    # 03:00 UTC, which is the quiet end of the runner queue.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: The branch, tag or sha to run against
        required: false
        default: main
  pull_request:
    types: [opened, synchronize, reopened, labeled]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

concurrency:
  group: deep-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request only gets these if somebody asked for them. Everything else
  # that triggers this workflow runs the lot.
  wanted:
    runs-on: ubuntu-latest
    # Reading the labels back needs saying out loud. The default for this
    # repository is read on everything, so this changes nothing today, and it
    # keeps the job working if that default is ever tightened.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      ref: ${{ steps.pick.outputs.ref }}
      shards: ${{ steps.shards.outputs.list }}
      borrows: ${{ steps.decide.outputs.borrows }}
    steps:
      # A pull request is checked out at its head and not at `refs/pull/N/merge`.
      # The merge ref stops existing the moment the pull request is merged, and
      # merging as soon as the local checks are green means this workflow is
      # often still queued when that happens, so half the deep runs failed in
      # checkout with `couldn't find remote ref` and told nobody anything about
      # the code. The head ref is permanent.
      - id: pick
        env:
          INPUT: ${{ github.event.inputs.ref }}
          NUMBER: ${{ github.event.pull_request.number }}
          REF: ${{ github.ref }}
        run: |
          set -u
          if [ -n "$INPUT" ]; then
            echo "ref=$INPUT" >> "$GITHUB_OUTPUT"
          elif [ -n "$NUMBER" ]; then
            echo "ref=refs/pull/$NUMBER/head" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$REF" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.pick.outputs.ref }}
          # Deep enough to diff a pull request against its base and against the
          # commit the last run already covered.
          fetch-depth: 0
      # Whether to run at all, and how much Miri to run when we do.
      #
      # Two borrow models on every shard is 72 jobs and a couple of hours of
      # runner time for one push. That is the right amount for a nightly run and
      # the wrong amount to sit through while working, so a pull request gets
      # stacked borrows and the nightly run gets both. Stacked is the model the
      # unsafe code was written against, tree borrows disagrees with it rarely,
      # and when it does the nightly run says so the same day rather than the
      # same minute.
      #
      # A push that only moves prose does not need any of this. That is not a
      # nicety: a changelog line on a pull request that already ran deep costs
      # seven minutes and tells nobody anything.
      #
      # The label is read back from the API rather than taken from the event.
      # The event carries a snapshot of the labels at the moment it was made,
      # and opening a pull request with labels already on it delivers the
      # `labeled` events first and the `opened` event after, with the older
      # snapshot in it. The `opened` run then sees no label, decides to skip,
      # and cancels the three real runs on its way past, because they share a
      # concurrency group. The whole thing reports success without having run
      # anything, which is the failure this job exists to avoid.
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          NUMBER: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          # Everything that is not a pull request runs the lot.
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo 'borrows=["stacked","tree"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'borrows=["stacked"]' >> "$GITHUB_OUTPUT"
          labels=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${NUMBER}" \
            --jq '.labels[].name')
          if ! printf '%s\n' "$labels" | grep -qx deep; then
            echo "no deep label, skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `prose_only <sha>` is true when nothing but markdown has changed
          # since that commit. An unknown or unrelated commit, which is what a
          # force push leaves behind, is not an answer, so it runs.
          prose_only() {
            git cat-file -e "$1^{commit}" 2>/dev/null || return 1
            changed=$(git diff --name-only "$1" HEAD)
            [ -n "$changed" ] || return 1
            ! printf '%s\n' "$changed" | grep -qv '\.md$'
          }
          if prose_only "$BASE"; then
            echo "the whole pull request is prose, skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$ACTION" = "synchronize" ] && prose_only "$BEFORE"; then
            echo "this push is prose on top of a run that already happened, skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      # The Miri matrix is one job per crate, and the list comes from the
      # manifest rather than from a copy of it kept in this file. A crate added
      # next month gets interpreted without anybody remembering to come back
      # here, which is the only way a list like this stays true.
      #
      # `yo-record` is the exception and gets two shards, because its compaction
      # tests are half the crate on their own and there is a limit to how far
      # they can shrink. A `page_len` under 8192 is refused by the log config,
      # and the number of records is what decides how many pages leave the
      # resident window, so below about eight hundred records there is no stable
      # region left and the pass has nothing to walk. Splitting them off is
      # worth 90 seconds against 55 locally even with nextest already running
      # four at a time. If that crate ever stops being the slowest, this special
      # case should go.
      #
      # `yo-resp`, `yo-cli`, `yo-kv` and `yo-graph` are split by count, and the
      # table in the step below says how many ways. They are split for a
      # different reason than `yo-record`. Miri spends about six seconds starting a process before it
      # runs a line of the test in it, and nextest gives every test its own
      # process, so `yo-resp` has a floor of over an hour before any of its six
      # hundred and thirty tests does any work. Nothing in the source can be
      # shrunk to fix that, because the cost is per test rather than per
      # operation. Splitting by count weakens no test and nextest does the
      # splitting itself, so no list of test names has to be kept true here as
      # tests are added.
      #
      # One crate is left out, and it is worth being straight about what that
      # costs. `yo-doc` has tests that take over two minutes each interpreted.
      # The fix is to go through it test by test, shrinking the ones where the
      # count is incidental and skipping the ones where the count is the claim,
      # which is what `yo-resp` got and what it needs. That is its own piece of
      # work and it is issue 418. It has no unsafe code of its own.
      #
      # `yo-index` was one of the five and is back in. It took one number: the
      # walk that grows the map underneath itself put 64 keys back for every 8 it
      # walked, so the map grew eight times faster than the walk ate it and the
      # loop ran until the directory had doubled its way out from under the whole
      # thing. That number was left at 64 when the starting population was cut
      # for Miri, which kept the ratio and so kept the cost. The crate now runs
      # all 57 of its tests in under seven minutes.
      #
      # `yo-vector` was the second one back, and it went the same way. Thirteen
      # tests are recall or error figures and are skipped, each saying so. The
      # rest were made small, three numbers at a time, because a corpus size and
      # a posting size set the partition count between them and cutting one
      # without the other gives a collection that never splits and a test that
      # passes without looking at anything. Cutting the width matters more than
      # either, since a rotation is the width squared and every insert and every
      # query pays for one. Shrinking it also turned up a real bug: a split and a
      # merge undoing each other forever, which cost the compiled test run half
      # its time as well. All 86 of its tests now run in about ten minutes.
      #
      # `yo-kv` was the third one back, and finding out why it was slow took two
      # goes. Timing it on a laptop said the cost was spread evenly over all
      # 1131 tests, which would have meant no amount of shrinking could help and
      # only a wider split would. That was wrong, and it was wrong because a
      # laptop runs the tests four at a time and charges the waiting to whoever
      # is measuring. The numbers that count came from the runner itself, out of
      # the six shard logs of the run that timed out. Across the 856 tests that
      # finished there, the median is 10.9 seconds, which is the process floor
      # and nothing more, while the mean is 42.5 seconds and twenty six tests
      # are over half of the total. So it is outliers after all, and the worst
      # of them never appeared in any log because it never finished: an estimate
      # checked at ten, a hundred, a thousand, ten thousand and a hundred
      # thousand elements, which is a hundred and eleven thousand insertions
      # under an interpreter.
      #
      # Seventy eight tests were made smaller and eight are skipped. The skipped
      # ones are all error bounds and encoding sizes, where the count is the
      # claim and a smaller version measures something else. The rest keep an
      # assert that would fail if the smaller number had made them vacuous, and
      # that was checked by forcing every Miri branch on and running the whole
      # suite compiled, which caught two of them relying on a size written down
      # twice. Where a test crosses a threshold rather than counts to one, the
      # threshold moves instead of the test being skipped: the listpack band is
      # a runtime limit, so under Miri it comes down and the field count comes
      # down with it, over the same boundary in the same code. Its eighteen
      # unsafe lines are interpreted now, which is what leaving it out had been
      # costing.
      #
      # `yo-graph` was the fourth one back. Its two planes are three orders of
      # magnitude apart interpreted: an `Adjacency::link` is a push onto a run,
      # and a `Graph::link` puts a document for each end and one for the edge,
      # and a document put hashes and indexes. So the cuts are large and they
      # are written as a pair of sizes at each test rather than through one
      # divide, because a tenth of a count chosen for a native run is usually
      # still too big to interpret and now and then small enough to make the
      # test vacuous. Twelve tests are skipped and every one of them is a
      # measurement: bits an edge, bytes an edge, how close a sampled estimate
      # lands, a margin one numbering beats another by, and two stack depths
      # that are the claim. The rest were made smaller and then checked by
      # forcing every Miri branch on and running the whole suite compiled. That
      # run also turned up a real bug in `modularity`, which panics on a label
      # above the node count although its documentation says any grouping will
      # do, and that is issue 462. The crate now runs all 162 of its remaining
      # tests in eleven minutes single threaded, against at least ninety five
      # before, and the slowest one is under two minutes.
      - id: shards
        run: |
          rm rust-toolchain.toml
          # The filter is its own field rather than part of an args string. A
          # nextest filter needs single quotes around it in the shell, and a
          # single quote inside this jq program would close the program instead,
          # which is a syntax error the runner reports six lines away from the
          # cause. The run step below passes each field as its own argument.
          echo "list=$(cargo metadata --no-deps --format-version 1 | jq -c '
            ["yo-doc"] as $out
            | { "yo-resp": 6, "yo-cli": 2, "yo-kv": 8, "yo-graph": 2 } as $split
            | [ .packages[].name
                | select(. != "yo-record" and ($split[.] | not) and (IN($out[]) | not))
                | {id: ., pkg: ., filter: "", part: ""} ]
            + [ {id: "yo-record-compact", pkg: "yo-record", filter: "test(/^compact::/)", part: ""},
                {id: "yo-record-rest", pkg: "yo-record", filter: "not test(/^compact::/)", part: ""} ]
            + [ $split | to_entries[] as $s
                | range(1; $s.value + 1)
                | {id: "\($s.key)-\(.)", pkg: $s.key, filter: "", part: "count:\(.)/\($s.value)"} ]
            | sort_by(.id)')" >> "$GITHUB_OUTPUT"
      - run: echo "deep checks requested for ${{ github.event.inputs.ref || github.ref }}"

  # Every unsafe block in the workspace, interpreted. Miri is slow, so the
  # arena's segment tests and the format's bit flip sweeps run at a reduced size
  # rather than being skipped: the scale goes away, the coverage does not.
  #
  # Tree borrows is stricter about aliasing than stacked borrows and catches a
  # different class of mistake, so both are worth running, and the nightly run
  # runs both. A pull request gets stacked only, because tree is also the slower
  # of the two by about 60 percent and the same crate under both models is 34
  # jobs for one push. The list comes from `wanted`.
  #
  # `cargo miri test --workspace` walks the crates one after another, so the
  # wait is the sum of all of them and the workspace is only ever as fast as
  # every crate added together. One job per crate makes the wait the slowest
  # single crate instead. Interpreting the whole tree costs the same either way,
  # it just does not all happen on one runner.
  #
  # Run through nextest rather than the built in harness, which is what gets a
  # shard down from the sum of its tests to the slowest one. `cargo miri test`
  # is one process, and libtest's threads do not help because Miri interprets
  # threads on a single core. nextest runs each test as its own process, so the
  # four cores a runner has are four tests being interpreted at once: `yo-record`
  # locally went from 322.7 seconds to 121.2 at 359 percent CPU. Four Miri
  # processes on the heaviest crate peaked at 865 MB between them, so the
  # parallelism costs memory in megabytes and buys minutes.
  #
  # nextest does not run doctests. They still run in `ci.yml` on every push, so
  # what is lost is the doctests being interpreted, not the doctests.
  miri:
    needs: wanted
    if: needs.wanted.outputs.run == 'true'
    name: miri (${{ matrix.borrows }}, ${{ matrix.shard.id }})
    runs-on: ubuntu-latest
    # Forty rather than the twenty five the other long jobs get. The heaviest
    # shard is a third of an hour on a quiet laptop and a runner is not a quiet
    # laptop, and this runs at three in the morning against nothing, so the only
    # thing a tighter bound would buy is a red run on a slow morning.
    timeout-minutes: 40
    strategy:
      # One shard failing is a real finding and every other shard's result is
      # still worth having, so a failure does not cancel its siblings.
      fail-fast: false
      matrix:
        borrows: ${{ fromJSON(needs.wanted.outputs.borrows) }}
        shard: ${{ fromJSON(needs.wanted.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.wanted.outputs.ref }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: taiki-e/install-action@v2.87.0
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          # Every shard builds a different subset of the tree with the same
          # nightly, so without a key of its own they would race for one cache
          # entry and each keep evicting the others'.
          key: ${{ matrix.borrows }}-${{ matrix.shard.id }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: rm rust-toolchain.toml
      # Pinned to four rather than left to follow the core count, so that a
      # bigger runner cannot quietly turn this into sixteen interpreters and an
      # out of memory kill that reads like a hang.
      #
      # A shard with no filter is a whole crate or a count of one, and either is
      # allowed to come out empty: `yo-derive` is a proc macro whose only job
      # happens in the compiler, so its shard finds nothing and nextest calls an
      # empty run a failure. A shard with a filter is a hand written half of
      # `yo-record`, and that one finding nothing means the filter has stopped
      # matching, so it keeps the default and stays a failure.
      #
      # The fields go in through the environment and into an array rather than
      # being pasted into the command line, so that a filter with a space or a
      # quote in it stays one argument.
      - run: |
          set -u
          args=(--locked -p "$PKG" --test-threads 4)
          if [ -n "$FILTER" ]; then
            args+=(-E "$FILTER")
          else
            args+=(--no-tests pass)
          fi
          if [ -n "$PART" ]; then
            args+=(--partition "$PART")
          fi
          cargo miri nextest run "${args[@]}"
        env:
          PKG: ${{ matrix.shard.pkg }}
          FILTER: ${{ matrix.shard.filter }}
          PART: ${{ matrix.shard.part }}
          # The flags used to live in a matrix `include`, which does not survive
          # the borrow list being decided at run time: an include entry naming a
          # value the matrix no longer has is a job of its own with no shard in
          # it rather than a merge into nothing.
          #
          # `-Zmiri-deterministic-floats` is there because Miri does not hand
          # `ln`, `log2` and `log10` to the host. It works them out itself and
          # then, by default, moves the answer a little either way on purpose, to
          # catch code that leans on a precision the language does not promise.
          # Three tests here read a score or a size back and compare it against
          # what a real Redis answered, digit for digit, and that is the point of
          # them: the width of a sketch is `ceil` of one `log10` over another and
          # comes out 2 instead of 1 when the two no longer cancel, and the older
          # search scorer is `floor` of a `log2` and drops to zero when its 1.0
          # arrives as 0.9999999999999999. Neither is a bug, because a real libm
          # is the same function twice and cancels, and neither is what Miri is
          # here to look for. The flag keeps the answers exact and leaves the
          # aliasing and provenance checks doing the job this workflow wants.
          MIRIFLAGS: >-
            -Zmiri-deterministic-floats
            ${{ matrix.borrows == 'tree'
              && '-Zmiri-tree-borrows -Zmiri-disable-isolation'
              || '-Zmiri-strict-provenance -Zmiri-disable-isolation' }}

  # Every shard is its own check name and there are getting on for forty of
  # them, which is more than a branch protection rule wants to know about, and
  # the count moves whenever a crate is added or a split is retuned. That is why
  # the number is not written down here. This is the one to require.
  miri-done:
    needs: [wanted, miri]
    if: always() && needs.wanted.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "miri: ${{ needs.miri.result }}"
          test "${{ needs.miri.result }}" = success

  # ThreadSanitizer, which is the other half of what Miri gives and not a
  # repeat of it. Miri interprets threads on one core, so it finds the races it
  # can reason about and misses the ones that need two cores really running at
  # once, and it cannot go near a socket at all, which is where every test of
  # `yodb serve --threads N` lives. TSan runs the real binary on the real
  # machine and watches every access, so it sees the server accepting on four
  # threads into one keyspace and Miri never will.
  #
  # Five crates rather than the workspace, and they are the five that have two
  # threads in them: the spin lock and the SPSC lane in `yo-common` and
  # `yo-shard`, the striped keyspace in `yo-kv`, the engine over a shared server
  # in `yo-resp`, and the serve loop in `yo-cli`. Interpreting the rest would
  # add minutes to find nothing, because a crate whose tests are single threaded
  # has nothing for a race detector to see.
  #
  # `-Zbuild-std` is not optional: the standard library ships without
  # instrumentation, so without rebuilding it every synchronisation inside
  # `std` is invisible and TSan reports a race on every channel and every mutex
  # in the tree.
  tsan:
    needs: wanted
    if: needs.wanted.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.wanted.outputs.ref }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: rm rust-toolchain.toml
      - id: host
        run: |
          echo "triple=$(rustc -vV | sed -n 's/^host: //p')" >> "$GITHUB_OUTPUT"
      # One command and not five, so the standard library is instrumented once
      # rather than once per crate.
      - run: |
          cargo test -Zbuild-std --target ${{ steps.host.outputs.triple }} \
            --locked -p yo-common -p yo-shard -p yo-kv -p yo-resp --lib
        env:
          # No `-D warnings` here, unlike everywhere else in this file. The flag
          # reaches the standard library too because of `-Zbuild-std`, and a
          # nightly std that emits one warning would fail this job for something
          # nobody in this tree wrote. Warnings are already denied by `style`
          # and by every other job.
          RUSTFLAGS: -Zsanitizer=thread
      - run: |
          cargo test -Zbuild-std --target ${{ steps.host.outputs.triple }} \
            --locked -p yo-cli --bin yodb
        env:
          # No `-D warnings` here, unlike everywhere else in this file. The flag
          # reaches the standard library too because of `-Zbuild-std`, and a
          # nightly std that emits one warning would fail this job for something
          # nobody in this tree wrote. Warnings are already denied by `style`
          # and by every other job.
          RUSTFLAGS: -Zsanitizer=thread

  # Fuzz targets are built and run briefly, so a target that stops compiling is
  # caught the next morning rather than the next time somebody remembers to run
  # the fuzzer.
  fuzz:
    needs: wanted
    if: needs.wanted.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.wanted.outputs.ref }}
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2.87.0
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: rm rust-toolchain.toml
      # The target is named rather than left to cargo-fuzz, which defaults it to
      # the platform its own binary was built for. install-action has no
      # cargo-fuzz of its own and falls back to cargo-binstall, which fetches the
      # musl build, so the default came out as x86_64-unknown-linux-musl and the
      # build died on a missing musl std with a sanitizer error on top. Nothing
      # here wants to be fuzzed against musl. `rustc -vV` is the host this job is
      # actually running on and is right whoever assembled the toolchain.
      - id: host
        run: |
          echo "triple=$(rustc -vV | sed -n 's/^host: //p')" >> "$GITHUB_OUTPUT"
      - run: cargo fuzz build --target ${{ steps.host.outputs.triple }}
      # All of them at once rather than one after another. Each is a minute and
      # they used to be a minute each in a row for no reason: they share nothing
      # and a runner has cores sitting idle through all but one of them.
      - name: sixty seconds per target, all of them at once
        run: |
          pids=""
          for t in $(cargo fuzz list); do
            cargo fuzz run --target ${{ steps.host.outputs.triple }} "$t" -- -max_total_time=60 -rss_limit_mb=2048 &
            pids="$pids $!"
          done
          rc=0
          for p in $pids; do wait "$p" || rc=1; done
          exit $rc
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  # The optimised build, on all three platforms. A bug that only appears under
  # optimisation is real and worth a job, it is just not worth one per commit.
  test-release:
    needs: wanted
    if: needs.wanted.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.wanted.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo test --workspace --locked --release

  # The benchmarks have to keep compiling and keep running. This does not
  # measure anything, it runs one iteration of each so that a benchmark which
  # panics or no longer builds is caught here rather than on the bench box.
  bench-smoke:
    needs: wanted
    if: needs.wanted.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.wanted.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      # Fat link time optimisation, one codegen unit and debug info are what the
      # bench profile owes the numbers on the bench box. This job produces no
      # numbers, so it owes them nothing and pays several minutes for them.
      #
      # `YO_BENCH_SMOKE` shrinks the inputs the same way. Filling a ten million
      # key map to look it up once proves nothing that filling a thousand does
      # not, and it is most of what this job was spending its time on.
      - run: cargo bench --workspace --locked -- --test
        env:
          CARGO_PROFILE_BENCH_LTO: "false"
          CARGO_PROFILE_BENCH_CODEGEN_UNITS: "16"
          CARGO_PROFILE_BENCH_DEBUG: "false"
          YO_BENCH_SMOKE: "1"

  # The M1 exit gate, which is a hundred thousand injected faults with zero
  # silent corruptions. Every push runs twenty thousand in `ci.yml`, because
  # twenty thousand catches a regression and fits in the budget. The gate number
  # lives here instead, where the shapes can also be varied: page sizes on both
  # sides of the default, a record count small enough that most trials land in
  # the first page, and a run in sync mode where every append is its own
  # durability boundary.
  crash-gate:
    needs: wanted
    if: needs.wanted.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.wanted.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release --locked -p yo-crash --bin yo-crash
      # Seeds do not overlap between shapes, so a failure names one run and one
      # seed and reproduces from the command line with no other setup.
      - name: a hundred thousand faults, five shapes
        run: |
          ./target/release/yo-crash --trials 40000
          ./target/release/yo-crash --trials 20000 --page-len 8192 --records 400 --seed 2000000
          ./target/release/yo-crash --trials 20000 --page-len 65536 --records 800 --seed 3000000
          ./target/release/yo-crash --trials 10000 --records 40 --seed 4000000
          ./target/release/yo-crash --trials 10000 --sync --seed 5000000

  # Somebody with nothing but rustup should be able to clone and build. No
  # cache, no toolchain file, no repository specific setup. This is the one job
  # here that is deliberately slow, because a cache would defeat its point.
  from-source:
    needs: wanted
    if: needs.wanted.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.wanted.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace --release --locked
      - run: cargo test --workspace --release --locked --no-fail-fast
