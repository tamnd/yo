name: deep

# The checks that cannot finish in the three minutes ci.yml is held to. Miri
# under both borrow models, the fuzzers, the release test matrix, the benchmark
# smoke run and a cold build from source with no cache and no toolchain file.
#
# They run nightly, on demand against any ref, and on a pull request carrying
# the `deep` label. A milestone pull request should carry that label, because a
# milestone is exactly when the format, the unsafe blocks and the benchmarks all
# move at once. An ordinary patch does not need it.
#
# Every job has a timeout. On 2026-08-26 a Miri job sat on one test for five
# hours and seventeen minutes and was killed by the runner's own six hour
# ceiling, which is a long time to wait to be told nothing. A job that hangs
# should say so while somebody is still awake.
#
# Reproducing a Miri shard locally is one shard at a time:
#
#     MIRIFLAGS="-Zmiri-strict-provenance -Zmiri-disable-isolation" \
#       cargo +nightly miri test --locked -p yo-record -- --skip compact::
#
# One at a time and not the whole matrix at once. Miri holds the interpreted
# program's whole heap, and eleven of them side by side will take every
# gigabyte a laptop has and start swapping, which looks like a hang and is one.

on:
  schedule:
    # 03:00 UTC, which is the quiet end of the runner queue.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: The branch, tag or sha to run against
        required: false
        default: main
  pull_request:
    types: [opened, synchronize, reopened, labeled]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

concurrency:
  group: deep-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request only gets these if somebody asked for them. Everything else
  # that triggers this workflow runs the lot.
  wanted:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'deep') }}
      ref: ${{ github.event.inputs.ref || github.ref }}
      shards: ${{ steps.shards.outputs.list }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      # The Miri matrix is one job per crate, and the list comes from the
      # manifest rather than from a copy of it kept in this file. A crate added
      # next month gets interpreted without anybody remembering to come back
      # here, which is the only way a list like this stays true.
      #
      # `yo-record` is the exception and gets two shards. Its compaction tests
      # are half the crate on their own and they cannot be made smaller: a
      # `page_len` under 8192 is refused, and the number of records is what
      # decides how many pages leave the resident window, so a smaller workload
      # leaves no stable region to compact. Splitting them off is the only way
      # that crate stops setting the wall clock for the whole workflow. If it
      # ever stops being the slowest, this special case should go.
      - id: shards
        run: |
          rm rust-toolchain.toml
          echo "list=$(cargo metadata --no-deps --format-version 1 | jq -c '
            [ .packages[].name
              | select(. != "yo-record")
              | {id: ., args: "--locked -p \(.)"} ]
            + [ {id: "yo-record-compact", args: "--locked -p yo-record --lib compact::"},
                {id: "yo-record-rest", args: "--locked -p yo-record -- --skip compact::"} ]
            | sort_by(.id)')" >> "$GITHUB_OUTPUT"
      - run: echo "deep checks requested for ${{ github.event.inputs.ref || github.ref }}"

  # Every unsafe block in the workspace, interpreted. Miri is slow, so the
  # arena's segment tests and the format's bit flip sweeps run at a reduced size
  # rather than being skipped: the scale goes away, the coverage does not.
  #
  # Tree borrows is stricter about aliasing than stacked borrows and catches a
  # different class of mistake, so both are worth running.
  #
  # `cargo miri test --workspace` walks the crates one after another, so the
  # wait is the sum of all of them and the workspace is only ever as fast as
  # every crate added together. One job per crate makes the wait the slowest
  # single crate instead. Interpreting the whole tree costs the same either way,
  # it just does not all happen on one runner.
  miri:
    needs: wanted
    if: needs.wanted.outputs.run == 'true'
    name: miri (${{ matrix.borrows }}, ${{ matrix.shard.id }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # One shard failing is a real finding and every other shard's result is
      # still worth having, so a failure does not cancel its siblings.
      fail-fast: false
      matrix:
        borrows: [stacked, tree]
        shard: ${{ fromJSON(needs.wanted.outputs.shards) }}
        include:
          - borrows: stacked
            flags: -Zmiri-strict-provenance -Zmiri-disable-isolation
          - borrows: tree
            flags: -Zmiri-tree-borrows -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.wanted.outputs.ref }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          # Every shard builds a different subset of the tree with the same
          # nightly, so without a key of its own they would race for one cache
          # entry and each keep evicting the others'.
          key: ${{ matrix.borrows }}-${{ matrix.shard.id }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: rm rust-toolchain.toml
      - run: cargo miri test ${{ matrix.shard.args }}
        env:
          MIRIFLAGS: ${{ matrix.flags }}

  # Twenty four shards is twenty four check names, which is more than a branch
  # protection rule wants to know about. This is the one to require.
  miri-done:
    needs: [wanted, miri]
    if: always() && needs.wanted.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "miri: ${{ needs.miri.result }}"
          test "${{ needs.miri.result }}" = success

  # Fuzz targets are built and run briefly, so a target that stops compiling is
  # caught the next morning rather than the next time somebody remembers to run
  # the fuzzer.
  fuzz:
    needs: wanted
    if: needs.wanted.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.wanted.outputs.ref }}
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2.9.2
      - run: rm rust-toolchain.toml
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz build
      - name: sixty seconds per target
        run: |
          for t in $(cargo fuzz list); do
            cargo fuzz run "$t" -- -max_total_time=60 -rss_limit_mb=4096
          done
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  # The optimised build, on all three platforms. A bug that only appears under
  # optimisation is real and worth a job, it is just not worth one per commit.
  test-release:
    needs: wanted
    if: needs.wanted.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.wanted.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo test --workspace --locked --release

  # The benchmarks have to keep compiling and keep running. This does not
  # measure anything, it runs one iteration of each so that a benchmark which
  # panics or no longer builds is caught here rather than on the bench box.
  bench-smoke:
    needs: wanted
    if: needs.wanted.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.wanted.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo bench --workspace --locked -- --test

  # Somebody with nothing but rustup should be able to clone and build. No
  # cache, no toolchain file, no repository specific setup. This is the one job
  # here that is deliberately slow, because a cache would defeat its point.
  from-source:
    needs: wanted
    if: needs.wanted.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.wanted.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace --release --locked
      - run: cargo test --workspace --release --locked --no-fail-fast
