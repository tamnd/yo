name: release

# A tag is what a release is cut from. Nothing here produces one from an
# untagged tree, because a release nobody can point at is not a release.
#
# The manual trigger is the recovery path and it is not decoration. A tag push
# runs the copy of this file that is *in the tag*, which is the one thing about
# release workflows that surprises everyone once: a fix landed on main after a
# tag was cut does not apply to that tag, ever, and the tag cannot be moved to
# pick it up. v0.3.5 is the worked example. It was tagged before the publish
# became a loop that waits out crates.io's rate limit, its own copy of this file
# ran a plain `cargo publish --workspace`, and it stopped on the first refusal
# with one crate of eighteen uploaded.
#
# So dispatching this from `main` with `tag:` set is how a half finished release
# is finished: main's workflow, the tag's code. Both halves matter, and the
# `ref:` on every checkout below is the half that makes it the tag's code.
#
# That also means `main` has to be allowed to deploy to the `crates.io`
# environment. It was not, and the first attempt to use this path was refused in
# one second by the deployment branch policy, which is a confusing failure
# because the job never starts and so has no steps and no log. If this ever goes
# back to only allowing `v*` tags then this input may as well be deleted, since
# there is no ref it can be dispatched from that has both the fixed workflow and
# the tagged code.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build the release from
        required: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

# Read by default and written by the one job that has to write. The publishing
# credential is not a GitHub permission at all, it is the environment secret on
# the `crates` job, so nothing here needs to be widened for it.
permissions:
  contents: read

# Two tags pushed close together would otherwise race each other through the
# same publish, and the loser would be the one that finds the version already
# uploaded. Not cancelled, because cancelling a run halfway through nineteen
# uploads is the worst of both.
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # The tag, the version in Cargo.toml and the changelog have to agree before
  # anything else runs. All three drift, and finding out after the release is
  # published means the fix is another release.
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: v
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          manifest=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$manifest" != "$version" ]; then
            echo "tag $tag says $version, Cargo.toml says $manifest" >&2
            exit 1
          fi
          if ! grep -q "^## $version " CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

  # The same gates the branch runs, against the tag rather than against a
  # branch tip that has since moved.
  verify:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --locked --release

  # `dx/12` §5 step 2: the release does not go out under a name the project has
  # stopped owning. This calls the weekly workflow rather than repeating its two
  # commands, so there is one definition of the check and no way for the release
  # copy and the weekly copy to drift apart.
  names:
    needs: check
    uses: ./.github/workflows/names.yml

  # crates.io, before the GitHub release rather than after it. The release notes
  # tell people to add a dependency, and a release that says so while the crate
  # is not there yet is a broken instruction for however long the gap lasts.
  #
  # Everything in the workspace goes up, not just `yodb`. crates.io has no way
  # to publish a crate without publishing what it depends on, so the eighteen
  # members are part of the release whether or not anyone is meant to depend on
  # them directly. `dx/12` §2 has the row saying so. `xtask` is `publish = false`
  # and stays out on its own.
  crates:
    needs: [check, verify, names]
    runs-on: ubuntu-latest
    # Long, because the publish waits out crates.io's rate limit on a new crate
    # name rather than failing on it, and eighteen new names is hours the first
    # time. Every release after this one finishes in the first few minutes.
    timeout-minutes: 330
    # The token lives on an environment and not loose in the repository secrets,
    # so it is reachable from this job and from nothing else, and so the review
    # rules and the audit log are the environment's rather than being absent.
    environment: crates.io
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: false

      # What is already up there at this version. A publish is not a transaction
      # across nineteen crates: if the ninth upload fails on a network blip the
      # first eight are permanent, and re-running the job would then die on
      # "crate version already uploaded" without saying which one it meant. So
      # ask first and exclude what is done, which makes re-running the job the
      # fix for a partial release rather than a second failure.
      - name: What is already published
        id: done
        run: |
          v="${{ needs.check.outputs.version }}"
          all=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish != []) | .name')
          exclude=""
          n=0
          left=0
          for p in $all; do
            n=$((n + 1))
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H 'user-agent: yo release workflow (https://github.com/tamnd/yo)' \
              "https://crates.io/api/v1/crates/$p/$v")
            case "$code" in
              200) echo "$p $v is already up"; exclude="$exclude --exclude $p" ;;
              404) left=$((left + 1)) ;;
              *) echo "crates.io answered $code for $p, not guessing" >&2; exit 1 ;;
            esac
          done
          echo "$left of $n still to publish"
          echo "left=$left" >> "$GITHUB_OUTPUT"
          echo "exclude=$exclude" >> "$GITHUB_OUTPUT"

      # The real dry run, which packages each crate and builds it from its own
      # tarball. It catches the file that was never committed and only compiles
      # because it is sitting in the working tree, which the manifest check in
      # `ci` cannot see. Slow, and worth it exactly once per release.
      - name: Would it publish
        if: steps.done.outputs.left != '0'
        run: cargo publish --workspace --locked --dry-run ${{ steps.done.outputs.exclude }}

      # crates.io rate limits a brand new crate name far harder than a new
      # version of one that already exists: roughly one every ten minutes
      # against one a minute, and the first release of this workspace is
      # eighteen new names at once. `cargo publish --workspace` stops dead on
      # the first 429, so without this the release goes out one crate per manual
      # re-run and takes eighteen of them.
      #
      # So the publish is a loop. Each pass asks crates.io what is still missing,
      # publishes what it can, and when it is turned away it reads the time
      # crates.io named in the refusal and sleeps until then. Progress is
      # measured against the registry rather than against what cargo thinks it
      # did, so a pass that uploads three crates and then gets refused is three
      # crates of progress and not a failure. This is nearly free from the second
      # release onwards, where nothing is a new name and the first pass finishes.
      - name: Publish
        if: steps.done.outputs.left != '0'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -o pipefail
          v="${{ needs.check.outputs.version }}"
          all=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish != []) | .name')
          deadline=$(( $(date +%s) + 5 * 60 * 60 ))
          pass=0
          while :; do
            pass=$((pass + 1))
            exclude=""
            left=0
            for p in $all; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' \
                -H 'user-agent: yo release workflow (https://github.com/tamnd/yo)' \
                "https://crates.io/api/v1/crates/$p/$v")
              case "$code" in
                200) exclude="$exclude --exclude $p" ;;
                404) left=$((left + 1)) ;;
                *) echo "crates.io answered $code for $p, not guessing" >&2; exit 1 ;;
              esac
            done
            if [ "$left" = 0 ]; then
              echo "pass $pass: everything is up"
              break
            fi
            echo "pass $pass: $left still to publish"
            if cargo publish --workspace --locked --no-verify $exclude 2>&1 | tee out.txt; then
              continue
            fi
            # Anything that is not the rate limit is a real failure and stops here.
            grep -q '429 Too Many Requests' out.txt || exit 1
            # crates.io names the second it will take the next one, so wait for
            # that rather than guessing an interval that is wrong either way.
            when=$(sed -n 's/.*Please try again after \(.*\) and see.*/\1/p' out.txt | head -1)
            next=$(date -d "$when" +%s 2>/dev/null || echo 0)
            now=$(date +%s)
            [ "$next" -gt "$now" ] || next=$((now + 600))
            if [ "$next" -gt "$deadline" ]; then
              echo "the next window is past this job's five hours, re-run it" >&2
              exit 1
            fi
            echo "rate limited, waiting $((next - now))s until $when"
            sleep $((next - now + 5))
          done

      # `names.toml` says `free` for a name until something is published under
      # it, and after this job eighteen of those rows are wrong. Nothing here
      # can fix them, because the file lives in the commit the tag points at and
      # a release does not push. So say it, in the summary, where whoever cut the
      # release will read it.
      - name: Remind
        if: steps.done.outputs.left != '0'
        run: |
          echo "Run \`cargo xtask reserve audit\` on main and commit the result." \
            >> "$GITHUB_STEP_SUMMARY"
          echo "The \`yo-*\` rows in names.toml still say \`free\` and are now \`released\`." \
            >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [check, verify, names, crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      # The release body is the changelog section, not a generated commit list.
      # A commit list tells you what was typed; the changelog tells you what it
      # costs you, which is the only thing worth reading.
      - name: Cut the changelog section
        run: |
          awk -v v="${{ needs.check.outputs.version }}" '
            $0 ~ "^## " v " " { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag || github.ref_name }}" \
            --title "v${{ needs.check.outputs.version }}" \
            --notes-file release-notes.md \
            --verify-tag
