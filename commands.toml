arity = 1
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Puts the protocol back to RESP2 as well as the database back to zero, which is the half that is easy to miss and leaves a pooled connection speaking the wrong one."

[[command]]
name = "QUIT"
group = "connection"
since = "1.0.0"
arity = -1
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The reply is written before the socket closes, so this answers with a flow decision rather than doing anything to the connection itself."

# --------------------------------------------------------------------- server

[[command]]
name = "COMMAND"
group = "server"
since = "2.8.13"
arity = -1
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-13"
notes = "COUNT, LIST, INFO, DOCS, GETKEYS and HELP. GETKEYS is the one a cluster aware client routes on, so MSETEX, whose keys are not where the first, last and step triple says, is special cased there rather than being answered wrongly."

[[command]]
name = "CONFIG"
group = "server"
since = "2.0.0"
arity = -2
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-14"
notes = "Every setting is fixed for the life of the process, so SET accepts a write that changes nothing and refuses everything else rather than pretending to have taken it."

[[command]]
name = "INFO"
group = "server"
since = "1.0.0"
arity = -1
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-12"
notes = "Only the fields this layer can stand behind. There is no rdb_last_save_time because there is no save, and a field that is not there is a client falling back rather than a client believing a zero. The CPU section was absent for the same reason and is there now, from one getrusage call, because Redis's own unit/info-command asks for used_cpu_user by name and because a monitoring tool graphs it against wall clock to tell a busy server from a waiting one."

[[command]]
name = "DBSIZE"
group = "server"
since = "1.0.0"
arity = 1
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-15"
notes = "The size of the index, not a walk over it, which is what Redis does too. A key that is past its deadline and has not been read since is counted by both servers, and Redis then takes it out on its next active expiry tick where we wait for somebody to read it."

[[command]]
name = "FLUSHALL"
group = "server"
since = "1.0.0"
arity = -1
plan = "none"
bounded = "inherent"
