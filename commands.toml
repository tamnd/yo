# The command audit, machine readable.
#
# Every command gets a storage plan and a bound or materialise verdict before it
# ships, and `cargo xtask check` enforces that: a command with no storage plan
# does not ship. This is the discipline aki's audit used over 250 commands, and
# the reason it is a file rather than a document is that a document goes stale
# and nobody notices.
#
# plan is one of:
#   point         one record, found by key
#   cursor        walks a structure, answers incrementally
#   merge         reads more than one key and combines them
#   metadata      answers from the header without reading the value
#   whole-value   reads or rewrites the entire value
#   none          touches no key at all, which only the connection, scripting
#                 and server groups are allowed to claim
#
# bounded is one of:
#   inherent      the answer is small whatever the value is
#   yes           the answer could be large and is bounded rather than built
#   risk          the cost follows the size of the value, and that is noted
#
# wire is one of:
#   verified      the argument order is checked against a real Redis
#   unverified    the storage half is done and the argument order is not settled
#   none          no dispatch layer for it yet, and none needed to check it
#
# divergent names a row in divergences.toml. A command that has one and names a
# row that is not there fails the check.

# ---------------------------------------------------------------- group budget
#
# A group's status is one of:
#   shipped   every command in the group is listed here
#   partial   some are, and the group is being worked through
#   planned   none are yet
#
# The expected counts came out of a running Redis 8.8, from the group field of
# COMMAND DOCS rather than from an ACL category. The two do not agree and the
# group is the right one of the two: ACL counts every subcommand separately, so
# it puts CLIENT at nineteen and OBJECT at five, and a container command is one
# command to implement and one row here. The names on the left are ours and two
# of them are splits of one of Redis's: what Redis calls generic is keyspace
# plus expiry here, because they land in different milestones.

[[group]]
name = "string"
expected = 26
status = "shipped"
doc = "08 section 2"
# 12 section 3 says 28. A real Redis 8.8 answers COMMAND LIST FILTERBY ACLCAT
# string with 26, which is 22 classic names plus 8.4's MSETEX, DELEX and DIGEST
# and 8.8's INCREX. The extra two in the spec look like SUBSTR and the SET
# option forms being counted separately. The spec number comes down to 26 at
# the M2 wrap up.

[[group]]
name = "bitmap"
expected = 7
status = "planned"
doc = "08 section 8"

[[group]]
name = "list"
expected = 22
status = "shipped"
doc = "08 section 6"
# All twenty two, the five blocking ones included. What a parked client costs is
# a copy of the keys it named and a walk over the waiter list per command, and
# the walk is behind a check that anybody is parked at all, so a server with no
# blocked clients pays a load and a branch. The machinery is not list shaped and
# the blocking stream and sorted set reads will use the same registry.

[[group]]
name = "hash"
expected = 28
status = "shipped"
doc = "08 section 3"

[[group]]
name = "set"
expected = 17
status = "shipped"
doc = "08 section 4"
# All seventeen are here. What is left on the set is not commands, it is the
# inline and native bands of the size ladder and the escalation of a hot key,
# and neither of those changes an answer.

[[group]]
name = "zset"
expected = 35
status = "shipped"
doc = "08 section 5"
# All thirty five are here, keyspace and wire both. The wire went out in five
# batches the way the list did: the ten that answer about one member or count,
# the ten range spellings, the algebra and the draw and the scan, and then the
# six pops with the three that wait among them.

[[group]]
name = "array"
expected = 18
status = "shipped"
doc = "08 section 1"

[[group]]
name = "stream"
expected = 20
status = "planned"
doc = "08 section 7"

[[group]]
name = "hyperloglog"
expected = 5
status = "planned"
doc = "08 section 8"

[[group]]
