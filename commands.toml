# The command audit, machine readable.
#
# Every command gets a storage plan and a bound or materialise verdict before it
# ships, and `cargo xtask check` enforces that: a command with no storage plan
# does not ship. This is the discipline aki's audit used over 250 commands, and
# the reason it is a file rather than a document is that a document goes stale
# and nobody notices.
#
# plan is one of:
#   point         one record, found by key
#   cursor        walks a structure, answers incrementally
#   merge         reads more than one key and combines them
#   metadata      answers from the header without reading the value
#   whole-value   reads or rewrites the entire value
#   none          touches no key at all, which only the connection, scripting
#                 and server groups are allowed to claim
#
# bounded is one of:
#   inherent      the answer is small whatever the value is
#   yes           the answer could be large and is bounded rather than built
#   risk          the cost follows the size of the value, and that is noted
#
# wire is one of:
#   verified      the argument order is checked against a real Redis
#   unverified    the storage half is done and the argument order is not settled
#   none          no dispatch layer for it yet, and none needed to check it
#
# divergent names a row in divergences.toml. A command that has one and names a
# row that is not there fails the check.

# ---------------------------------------------------------------- group budget
#
# A group's status is one of:
#   shipped   every command in the group is listed here
#   partial   some are, and the group is being worked through
#   planned   none are yet
#
# The expected counts came out of a running Redis 8.8, from the group field of
# COMMAND DOCS rather than from an ACL category. The two do not agree and the
# group is the right one of the two: ACL counts every subcommand separately, so
# it puts CLIENT at nineteen and OBJECT at five, and a container command is one
# command to implement and one row here. The names on the left are ours and two
# of them are splits of one of Redis's: what Redis calls generic is keyspace
# plus expiry here, because they land in different milestones.

[[group]]
name = "string"
expected = 26
status = "shipped"
doc = "08 section 2"
# 12 section 3 says 28. A real Redis 8.8 answers COMMAND LIST FILTERBY ACLCAT
# string with 26, which is 22 classic names plus 8.4's MSETEX, DELEX and DIGEST
# and 8.8's INCREX. The extra two in the spec look like SUBSTR and the SET
# option forms being counted separately. The spec number comes down to 26 at
# the M2 wrap up.

[[group]]
name = "bitmap"
expected = 7
status = "shipped"
doc = "08 section 8"
# All seven, over the same string values the string group writes, which is why
# STRLEN on a bitmap answers and SETBIT on something SET left behind works. The
# kernels are in yo-kv's bits module and they are plain loops over u64 words
# rather than intrinsics, because the loop is what the compiler already turns
# into the vector instructions the machine has.

[[group]]
name = "list"
expected = 24
status = "shipped"
doc = "08 section 6"
# All twenty four, the six blocking ones included. What a parked client costs is
# a copy of the keys it named and a walk over the waiter list per command, and
# the walk is behind a check that anybody is parked at all, so a server with no
# blocked clients pays a load and a branch. The machinery is not list shaped and
# the blocking stream and sorted set reads use the same registry.

[[group]]
name = "hash"
expected = 29
status = "shipped"
doc = "08 section 3"
# All twenty nine, HIMPORT and its four subcommands included. That one came with
# Redis 8.10 along with a pair of template encodings that store the field names
# once for a family of keys sharing a schema rather than once per key. The
# command is here in full and the encoding is not, because a hash in this engine
# already interns its field names per collection and the saving is one the size
# ladder answers a different way. Everything a client can read off a key built
# this way matches, and the encoding string does not, which is D-45.

[[group]]
name = "set"
expected = 19
status = "shipped"
doc = "08 section 4"
# All nineteen are here, keyspace and wire both, including the two counting
# commands Redis 8.10 added. Those two cost almost nothing to add because the
# union and the difference already walked with a callback, so all they needed was
# the limit SINTERCARD's walk already carried and somewhere to stop.
# What else is left on the set is not commands, it is the inline and native
# bands of the size ladder and the escalation of a hot key, and neither of those
# changes an answer.

[[group]]
name = "zset"
expected = 35
status = "shipped"
doc = "08 section 5"
# All thirty five are here, keyspace and wire both. The wire went out in five
# batches the way the list did: the ten that answer about one member or count,
# the ten range spellings, the algebra and the draw and the scan, and then the
# six pops with the three that wait among them.

[[group]]
name = "array"
expected = 18
status = "shipped"
doc = "08 section 1"

[[group]]
name = "graph"
expected = 10
status = "shipped"
doc = "11 section 7"
# Ten and no query language, which is the design and not a gap. There is no
# G.QUERY and there is not going to be one: a traversal on the wire says which
# way it is going, and anything that needs a plan is written as typed methods
# against the embedded API where the compiler checks it before it runs.

[[group]]
name = "json"
expected = 25
status = "shipped"
doc = "09 section 2"
# All twenty five, which are the ones that read and write a value at a path, the
# whole array family, the four that ask how big something is, the three that do
# arithmetic, the one that appends to a string, the merge patch, the multi key
# write and the two odd ones that answer RESP types and byte counts. The count
# is RedisJSON 2.8 as it ships inside Redis 8, read off COMMAND LIST FILTERBY
# ACLCAT json on a running one rather than off the documentation, which lists
# NUMMULTBY and NUMPOWBY as deprecated and still registers them.

[[group]]
name = "vector"
expected = 12
status = "shipped"
doc = "10 section 9"
# Redis's twelve, with Redis's names and Redis's argument order, over an index
# that is not the one Redis has. That is the whole point of the group: the
# reason to keep the command surface exactly is so a client can be pointed at
# either server without a change, and the reason to keep a different index is
# that a partition index answers the same question on a thirty second of the
# memory. Where the difference reaches the wire it is D-2 for VLINKS, D-31 and
# D-32 for the two options that ask for something the index does not have, and
# D-33 for the one number beside FILTER that means something else here.

[[group]]
name = "bloom"
expected = 11
status = "shipped"
doc = "11 section 8"
# Ten public commands and BF.DEBUG, which is not documented anywhere and is in
# the @bloom ACL category on a real server, so COMMAND LIST FILTERBY ACLCAT
# bloom answers eleven names and this has to as well. The whole group is byte
# compatible rather than behaviour compatible, because BF.SCANDUMP hands a
# client the filter's own bytes and a client that dumps from one server and
# loads into another is the reason the two commands exist. That fixes the
# geometry, the growth rule, the error tightening, MurmurHash64A and the bit
# order, none of which are the ones anybody would pick today.

[[group]]
name = "cuckoo"
expected = 14
status = "shipped"
doc = "11 section 8"
# Thirteen public commands and CF.DEBUG, which is undocumented and is in the
# @cuckoo ACL category on a real server the same way BF.DEBUG is in @bloom. The
# group is byte compatible rather than behaviour compatible for the same reason
# the Bloom group is: CF.SCANDUMP hands a client the filter's own fingerprints
# and CF.LOADCHUNK takes them back, so the geometry, MurmurHash64A, the
# fingerprint, the alternate bucket and the order a full bucket is kicked in are
# all fixed by the format rather than chosen.

[[group]]
name = "cms"
expected = 6
status = "shipped"
doc = "11 section 8"
# Six commands and no undocumented seventh, so this is the smallest of the three
# sketch groups. Nothing here hands a client the counters the way BF.SCANDUMP
# hands over a filter, but the layout is copied all the same, because CMS.MERGE
# only works between sketches of the same width and depth and two servers that
# hashed differently would merge into a sketch whose counts mean nothing. The
# hash is MurmurHash2 over thirty two bits with the row number for a seed, the
# cell is the hash taken modulo the width, and both constructors round the way
# the module rounds, down to CMS.INITBYPROB computing its width in a double and
# its depth in a float.

[[group]]
name = "topk"
expected = 7
status = "shipped"
doc = "11 section 8"
# Seven commands and no undocumented eighth. This is the one sketch family that
# keeps the items rather than only counting them, so it is the one that can
# answer what the commonest things were rather than how often a named thing
# happened. The structure is heavy keeper, and the hash, the fingerprint seed,
# the bucket arithmetic, the heap sift and the order TOPK.LIST comes out in are
# all copied from the module. The decay draw is not, because the module draws it
# from rand() and so does not agree with itself between two runs of the same
# commands, which is D-49.

[[group]]
name = "tdigest"
expected = 14
status = "shipped"
doc = "11 section 8"
# Fourteen commands and no undocumented fifteenth, the largest of the four sketch
# families and the only one of them that is about an ordering rather than a
# membership or a count. The digest is the merging variant of Dunning's, ported
# from the module's own C at the commit its submodule pins, arithmetic and
# rounding and unstable sort included. That last one reads like a bug to fix and
# is not: two servers behind one load balancer have to answer the same p99 for
# the same samples, and the tie order out of the sort is visible in the answer
# when several centroids share a mean.

[[group]]
name = "ts"
expected = 21
status = "partial"
doc = "11 section 9"
# Twenty one commands, and the sixteen here are the key type, everything that
# writes a sample into one or reports on it, the two that read a span back with
# the aggregation grammar, the three that search on labels and the two that read
# a span out of every series at once. Compaction rules and the three commands
# 8.10 added come next.
# Samples are squeezed with
# Gorilla, which is what the module does too, so a series read at a steady rate
# costs a couple of bits a sample rather than sixteen bytes. Every error sentence
# and both of the two the module writes with no ERR in front of them are copied
# word for word, and so is the option scan that lets a key called RETENTION be
# the RETENTION keyword.

[[group]]
name = "stream"
expected = 20
status = "partial"
doc = "08 section 7"

[[group]]
name = "hyperloglog"
expected = 5
status = "shipped"
doc = "08 section 8"
notes = "A sketch is an ordinary string with a documented layout, so these are string commands that refuse a string that is not a sketch. Byte for byte compatible with Redis, which is the only thing worth aiming at here: the format is what a client sees, so a sketch GET out of a real server and SET into us counts the same, and one built here counts the same over there. MurmurHash64A with the seed 0xadc83b19, the three sparse opcodes, the 3000 byte promotion threshold and Ertl's estimator are all copied rather than improved on."

[[group]]
name = "geo"
expected = 10
status = "shipped"
doc = "08 section 8"
notes = "A geo key is a sorted set with a 52 bit interleave of longitude and latitude for a score, so the whole group is arithmetic on the way in and on the way out and the sorted set commands keep working on it. Six of the ten are one search written six ways and share one parser, because six parsers is six chances to accept an option in one spelling and refuse it in another."

[[group]]
name = "pubsub"
expected = 9
status = "planned"
doc = "12 section 6"

[[group]]
name = "keyspace"
expected = 29
status = "shipped"
doc = "14"
# Twenty nine is what 8.10.1 answers for its generic group once the five OBJECT
# subcommands are counted as the one command they are dispatched as. The nine
# expiry commands are in here rather than in a group of their own, because a
# deadline lives in the key's record and EXPIRE is dispatched down the same path
# DEL is. There was an expiry group in this file that listed none of them and
# claimed nine, which was two names for one group and a count nobody could check.
# Nothing is left. MIGRATE came last and it is the only command in the group
# that talks to another server, which is why it needed the file format DUMP and
# RESTORE brought in and a socket on top of that. MOVE, SORT, SORT_RO, WAIT and
# WAITAOF were the rest of it and they landed together because none of them
# needs anything the store did not already have.
# DEL, UNLINK, EXISTS and TYPE landed in M2 and the rest are in M3. The four were
# not a random quarter of the group, they are what Redis's own test suite needs
# before it will run one file. OBJECT is here now because the size ladder is not
# finished until a client can see which rung a key is on. RENAME, RENAMENX, COPY
# and TOUCH came next because none of them needs anything the store did not
# already have. KEYS, SCAN and RANDOMKEY needed a cursor over the index that
# survives a resize, which is the one thing on this list that was a change to
# the index rather than three more rows, and it landed with them.

[[group]]
name = "transactions"
expected = 5
status = "planned"
doc = "12 section 4"

[[group]]
name = "scripting"
expected = 8
status = "partial"
doc = "12 section 7"
# SCRIPT and FUNCTION are here in M2 with the subcommands that are exactly right
# on a server with no interpreter, because Redis's own test suite says SCRIPT
# FLUSH and FUNCTION FLUSH before every start_server block. The six that need
# Lua, which is EVAL, EVALSHA, EVAL_RO, EVALSHA_RO, FCALL and FCALL_RO, are M6.

[[group]]
name = "connection"
expected = 8
status = "partial"
doc = "12 section 9"

[[group]]
name = "server"
expected = 32
status = "partial"
doc = "12 section 9"

# --------------------------------------------------------------------- strings

[[command]]
name = "SET"
group = "string"
since = "1.0.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-8"
notes = "One record written, one freed. NX, XX and the four IF forms all decide against a single probe, and GET reports what that probe found whether or not the write went ahead. IFNE holds on a key that is not there, since a key that is not there is not equal to anything."

[[command]]
name = "GET"
group = "string"
since = "1.0.0"
arity = 2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One probe. The value is handed back as a slice of the record it lives in, or as an integer that becomes digits only when the reply is written."

[[command]]
name = "GETSET"
group = "string"
since = "1.0.0"
arity = 3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The one string command that cannot avoid a copy, because the record the old value lived in is freed before the caller sees it."

[[command]]
name = "GETDEL"
group = "string"
since = "6.2.0"
arity = 2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Copies for the same reason GETSET does."

[[command]]
name = "GETEX"
group = "string"
since = "6.2.0"
arity = -2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Adding or removing a deadline changes the record's length, so it is a rewrite and not an overwrite. Plain GETEX changes nothing and is a read."

[[command]]
name = "SETNX"
group = "string"
since = "1.0.0"
arity = 3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"

[[command]]
name = "SETEX"
group = "string"
since = "2.0.0"
arity = 4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A zero or negative time to live is an error and not a delete."

[[command]]
name = "PSETEX"
group = "string"
since = "2.6.0"
arity = 4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"

[[command]]
name = "MSET"
group = "string"
since = "1.0.1"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-8"
notes = "One point write per pair, in order."

[[command]]
name = "MSETNX"
group = "string"
since = "1.0.1"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-8"
notes = "Every key is checked before anything is written, so a duplicate key inside one call does not defeat itself."

[[command]]
name = "MGET"
group = "string"
since = "1.0.0"
arity = -2
plan = "point"
bounded = "yes"
status = "shipped"
wire = "verified"
notes = "Every dead key is reaped first, then the whole answer is read from a store nobody is going to mutate, which is what lets all the values borrow at once instead of being copied out one at a time."

[[command]]
name = "APPEND"
group = "string"
since = "2.0.0"
arity = 3
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
divergent = "D-8"
notes = "Reads the value and writes it back with the tail attached, so repeated appends are quadratic in the final length. Redis amortises this with sds spare capacity and we do not yet. The band that fixes it is the log region in M5."

[[command]]
name = "STRLEN"
group = "string"
since = "2.2.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The record header carries the length, so nothing reads the value. An int encoded value counts its digits arithmetically rather than formatting them."

[[command]]
name = "SETRANGE"
group = "string"
since = "2.2.0"
arity = 4
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
divergent = "D-8"
notes = "Same rewrite as APPEND, and a write past the end pads with zero bytes. A write of nothing to a key that is not there creates nothing and answers zero."

[[command]]
name = "GETRANGE"
group = "string"
since = "2.4.0"
arity = 4
plan = "point"
bounded = "yes"
status = "shipped"
wire = "verified"
notes = "Slices the record rather than copying it, except for an int encoded value whose digits do not exist anywhere until somebody asks."

[[command]]
name = "SUBSTR"
group = "string"
since = "1.0.0"
arity = 4
plan = "point"
bounded = "yes"
status = "shipped"
wire = "verified"
notes = "The same command as GETRANGE under an older name, deprecated in Redis since 2.0.0 and still answered."

[[command]]
name = "INCR"
group = "string"
since = "1.0.0"
arity = 2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One probe, one add, one eight byte store back into the record the probe landed on. No arena append, no free, no rehash. This is the command M2's gate is about."

[[command]]
name = "DECR"
group = "string"
since = "1.0.0"
arity = 2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"

[[command]]
name = "INCRBY"
group = "string"
since = "1.0.0"
arity = 3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"

[[command]]
name = "DECRBY"
group = "string"
since = "1.0.0"
arity = 3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Carried through as a subtraction rather than turned into an addition, because negating first would overflow on i64::MIN."

[[command]]
name = "INCRBYFLOAT"
group = "string"
since = "2.6.0"
arity = 3
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The result is stored as text and never as an integer, because Redis reports embstr afterwards even when the number came out whole. The reply is written by a different printer from every other double in the server: it goes through ld2string in its human mode rather than d2string, and human mode is a fixed point conversion, so INCRBYFLOAT of ten to the thirtieth answers a one and thirty zeros where ZSCORE would answer 1e+30 for the same number."

[[command]]
name = "LCS"
group = "string"
since = "7.0.0"
arity = -3
plan = "merge"
bounded = "risk"
status = "shipped"
wire = "verified"
divergent = "D-10"
notes = "A table the size of the product of the two lengths, in time and in memory. The one string command that is not a probe and a store, and the one nobody should put on a hot path."

[[command]]
name = "MSETEX"
group = "string"
since = "8.4.0"
arity = -4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-8"
notes = "MSETEX numkeys key value [key value ...] [NX|XX] [EX|PX|EXAT|PXAT|KEEPTTL], checked against a real 8.8. The condition is over the whole set: NX needs every key missing and XX needs every key present, and a partial match writes nothing. With no expiration option it clears the deadline the way plain SET does."

[[command]]
name = "DELEX"
group = "string"
since = "8.4.0"
arity = -2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "DELEX key [IFEQ v|IFNE v|IFDEQ d|IFDNE d], checked against a real 8.8. Compare and delete, the other half of SET IFEQ. The comparison is against the string the client would have read, so an int encoded 42 is equal to 42 and not to 042."

[[command]]
name = "DIGEST"
group = "string"
since = "8.4.0"
arity = 2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The XXH3 of the value as sixteen hex characters. It exists so IFDEQ is worth using: a client comparing against a megabyte value sends eight bytes instead of the value. The number is bit for bit Redis's, checked against a real 8.8 at every length the algorithm branches on."

[[command]]
name = "INCREX"
group = "string"
since = "8.8.0"
arity = -2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-11"
notes = "INCREX key [BYINT n|BYFLOAT f] [SATURATE] [LBOUND l] [UBOUND u] [EX|PX|EXAT|PXAT|PERSIST] [ENX], checked against a real 8.8. A counter with a bound, a saturation policy and four things it can do to the deadline. The reply is the value and the amount applied, and a refused increment reports zero applied and does not create the key."

# --------------------------------------------------------------------- bitmaps

[[command]]
name = "SETBIT"
group = "bitmap"
since = "2.2.0"
arity = 4
plan = "point"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "Writes the bit where it lies when the value is already raw, which is the common case and costs one probe and one byte written. An int or an embstr has to move to become raw first, and it does move, because a real server reports raw encoding after a SETBIT whether or not the bit changed. Bounded is a risk rather than inherent because the offset decides how far the value grows and four gigabits is the cap."

[[command]]
name = "GETBIT"
group = "bitmap"
since = "2.2.0"
arity = 3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One probe and one byte read, and no re-encoding: an int key is still an int afterwards and the bits it answers with are the bits of its digits."

[[command]]
name = "BITCOUNT"
group = "bitmap"
since = "2.6.0"
arity = -2
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Four running totals over thirty two bytes at a time. The BIT unit masks the two partial bytes at the ends and counts the whole ones in between. Redis clamps the two ends differently, a negative index up to zero and the end down to the last item but never the start, which is what makes a range that starts past the end count nothing."

[[command]]
name = "BITPOS"
group = "bitmap"
since = "2.8.7"
arity = -3
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Skips eight bytes at a time and finds the bit with a leading zero count. A search for a nought with no end given answers the length in bits rather than minus one, because the string is treated as if it had noughts after it forever, and that is the only place a miss is not minus one."

[[command]]
name = "BITOP"
group = "bitmap"
since = "2.6.0"
arity = -4
plan = "merge"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "All eight operations, AND OR XOR NOT and 8.2's DIFF DIFF1 ANDOR ONE. The sources and the result go end to end in the one scratch buffer so that nothing allocates, and they are combined a kilobyte at a time so the working set stays in L1 however long the strings are. An empty result deletes the destination."

[[command]]
name = "BITFIELD"
group = "bitmap"
since = "3.2.0"
arity = -2
plan = "point"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "Packed fields up to sixty four bits wide, with WRAP, SAT and FAIL overflow. The arguments are walked twice, once to check every subcommand and work out how far the value has to grow and once to run them, which is both how nothing allocates and how a bad field type in the last subcommand leaves the key untouched and uncreated the way a real server does."

[[command]]
name = "BITFIELD_RO"
group = "bitmap"
since = "6.0.0"
arity = -2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The same parser with the writes refused, so a replica can answer it. An OVERFLOW word is still accepted even though nothing it can run will overflow, which is what a real server does."

# -------------------------------------------------------------- hyperloglogs

[[command]]
name = "PFADD"
group = "hyperloglog"
since = "2.8.9"
arity = -2
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One hash and one register write an element. The value is only rewritten when a register actually changed, so adding an element the sketch already has costs a hash and a walk and no store. Creating the key counts as a change, which is why PFADD k with nothing to add answers 1 the first time and 0 after."

[[command]]
name = "PFCOUNT"
group = "hyperloglog"
since = "2.8.9"
arity = -2
plan = "merge"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A readonly command that writes. One key answers out of the eight cached header bytes when they are good and fills them in when they are not, so the first count after an add walks 16384 registers and every one after it reads eight bytes. Several keys are merged through a register array on the stack and that answer is never cached, because the union of two sketches is not a key."

[[command]]
name = "PFMERGE"
group = "hyperloglog"
since = "2.8.9"
arity = -2
plan = "merge"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The destination is one of the sources, so a merge never loses what was there. The result stays sparse when every input was sparse and it still fits, which is what a real server leaves behind, and one dense input makes it dense whatever the destination was."

[[command]]
name = "PFDEBUG"
group = "hyperloglog"
since = "2.8.9"
arity = 3
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Four subcommands, GETREG, DECODE, ENCODING and TODENSE, and two of them change what they are looking at: GETREG converts a sparse sketch to dense and leaves it converted, and that is a real server's behaviour and not ours. Its complaint about an unknown subcommand is its own sentence rather than the one every other container command uses."

[[command]]
name = "PFSELFTEST"
group = "hyperloglog"
since = "2.8.9"
arity = 1
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Answers OK. Redis runs a few thousand additions and checks the estimate is inside its bounds; ours are checked in cargo test, where a failure stops a release rather than a client."

# ------------------------------------------------------------------- keyspace
#
# Four of the twenty, and they are here in M2 rather than in M3 with the rest of
# the group because Redis's own test suite cannot run a single file without
# them. In external mode it says FLUSHALL before every start_server block and
# gives up on the whole file if that fails, and most test bodies then say DEL to
# get to a known state. The other sixteen land with the scans and the renames.

[[command]]
name = "DEL"
group = "keyspace"
since = "1.0.0"
arity = -2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One probe and one free per key, and the reply is how many of them were there. A key named twice can only be deleted once, so the count is of keys removed and not of arguments matched."

[[command]]
name = "UNLINK"
group = "keyspace"
since = "4.0.0"
arity = -2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The same body as DEL. On a real server the difference is which thread frees the memory, and what UNLINK promises a client is that the key is gone from the keyspace when the reply arrives, which is about visibility rather than about threads."

[[command]]
name = "EXISTS"
group = "keyspace"
since = "1.0.0"
arity = -2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One probe per key, answering from the header without reading the value. A key named twice counts twice, which looks like a bug and is what Redis does."

[[command]]
name = "TYPE"
group = "keyspace"
since = "1.0.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Answers string, set or none. It grows a case each time a type lands."

[[command]]
name = "EXPIRE"
group = "keyspace"
since = "1.0.0"
arity = -3
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A deadline lives in the key's record rather than beside it, so this rewrites the record and never touches the value. For a string that means copying the bytes across, and for a set or a hash it is five bytes or thirteen, because the body sits in a slab and the record only holds a slot number. The condition keywords are a set and not a keyword, which does not read that way: EXPIRE key 100 XX GT is legal and means both, the same one twice means it once, and NX with any other or GT with LT are named errors rather than a generic syntax one. Only XX LT says anything the four keywords cannot say on their own, since GT already refuses a key with no deadline."

[[command]]
name = "PEXPIRE"
group = "keyspace"
since = "2.6.0"
arity = -3
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "EXPIRE counted in milliseconds. All four writers turn their number into one absolute millisecond before anything is stored, so the condition rules are applied in one place and the four cannot drift apart."

[[command]]
name = "EXPIREAT"
group = "keyspace"
since = "1.2.0"
arity = -3
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Absolute rather than relative. A deadline already gone deletes the key and still answers 1, which is the one thing the reply cannot tell a client: whether the deadline went on or the key went away. The store knows the difference and the wire throws it away, because that is what Redis puts on the wire."

[[command]]
name = "PEXPIREAT"
group = "keyspace"
since = "2.6.0"
arity = -3
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-17"
notes = "The only one of the four with no arithmetic to overflow, so it is the only one that can name a moment past what a record can hold. Redis takes PEXPIREAT key 9223372036854775807 and holds it in a full signed long. A record here holds forty six bits, so it clamps to the year 4199 and the key does not expire either way."

[[command]]
name = "PERSIST"
group = "keyspace"
since = "2.2.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Answers 0 for a key with no deadline and 0 for a key that is not there, which are the same answer to a client and different states in the store. Redis does not separate them either."

[[command]]
name = "TTL"
group = "keyspace"
since = "1.0.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Rounds to nearest, so four hundred milliseconds left answers 0 and six hundred answers 1. HTTL rounds up on the same question about a field, which is not something anyone would guess and is what 8.10.1 does, checked against a real server rather than reasoned about."

[[command]]
name = "PTTL"
group = "keyspace"
since = "2.6.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "TTL in milliseconds, which is the number the store actually holds, so this is the one with no rounding in it at all."

[[command]]
name = "EXPIRETIME"
group = "keyspace"
since = "7.0.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "When it falls due rather than how long is left, and it rounds to nearest the same way TTL does."

[[command]]
name = "PEXPIRETIME"
group = "keyspace"
since = "7.0.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The deadline exactly as the record holds it, with nothing derived and nothing rounded."

[[command]]
name = "OBJECT"
group = "keyspace"
since = "2.2.3"
arity = -2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "ENCODING is the one worth having and the other three are here because clients call them without thinking. It is the only window a client has onto the size ladder, so it is the command that says whether our ladder is really Redis's ladder, and it is why the thresholds behind it are the one thing CONFIG SET can move. A missing key answers nil on all four rather than an error, which reads like a bug and is what 8.10.1 does. REFCOUNT is always 1, because 8.10.1 answers 1 for a small integer too rather than the huge shared count it used to. IDLETIME is always 0 and FREQ is always the not an LFU policy complaint, and both will stay that way until there is eviction to track."

[[command]]
name = "TOUCH"
group = "keyspace"
since = "3.2.1"
arity = -2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The same walk EXISTS makes, including a key named twice counting twice. On a real server the difference is that this moves each key up the eviction order, and there is no eviction here yet, so the day it lands the bump goes in the store and this command does not change."

[[command]]
name = "RENAME"
group = "keyspace"
since = "1.0.0"
arity = 3
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The body never moves. A set or a hash is a slot number sitting in a record, and a slot number under a different key is the same set, so this writes the source's record bytes under the destination and deletes the source record without freeing anything. Renaming a set of a million members writes thirteen bytes. The deadline travels with the source and the destination's own deadline goes with the value it belonged to, which falls out of moving the whole record rather than being a rule applied on top. A missing source is an error and not a zero, which is unusual in this group, and it is checked before anything else, so RENAMENX nope nope is no such key rather than zero. Redis calls this slow and it is not, and the flag is Redis's to set."

[[command]]
name = "RENAMENX"
group = "keyspace"
since = "1.0.0"
arity = 3
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "RENAME that refuses a destination that is already there. A key renamed onto itself is refused too, because the destination does exist and a key is not new because it is the one you already had, where plain RENAME onto itself is OK and keeps the deadline."

[[command]]
name = "COPY"
group = "keyspace"
since = "6.2.0"
arity = -3
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
divergent = "D-48"
notes = "The one command in the group that costs what the value is worth. Two records pointing at one slot would be one set answering to two names and SADD to either would show up in both, so the body is cloned, which is Redis's cost too and there is no version of COPY that avoids it. DB n writes into a database the connection is not on, which is why the store splits this into an export that lifts a value out standing on its own and an import that puts one down, and the same pair is what MOVE, DUMP and RESTORE will want. The four failure modes are checked in an order nobody would write from scratch: the options first, so a bad DB is refused before anyone asks whether the source exists, then source and destination being the same object, and only then a missing source becoming the ordinary zero. Same object means same key in the same database, so COPY a a DB 1 is a real copy and COPY a a DB 0 from database zero is the error. A destination whose deadline has gone counts as free, which is the only answer consistent with EXISTS saying zero for the same key."

[[command]]
name = "SORT"
group = "keyspace"
since = "1.0.0"
arity = -2
divergent = "D-24"
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "The one command in the group that reads keys nobody named. BY and GET are not globs, they are templates: the first star is replaced with the element and the result is a key name, so a sort of ten thousand elements with a BY and a GET reads twenty thousand other keys. That is why it carries movablekeys, why Redis marks it not deterministic, and why SORT_RO exists as the readonly half. It is also why this is the one read path in the engine that copies the elements out before it does anything: the ordering is decided by reading other keys and reading another key needs the database the elements are borrowed from, so the borrow has to end first. Redis has the same problem and pays it by holding refcounted pointers, which is the same copy charged to whoever wrote the value. A BY pattern with no star cannot name a key per element so it means do not sort, except over a set with a STORE, where the result would otherwise differ between two servers holding the same members and Redis forces an alphabetic sort instead. Ties are broken by comparing the elements, always, so there is no case where the answer depends on the order the elements happened to be in. A lookup that lands on a key of the wrong type is a miss rather than an error, because a pattern is a guess about a naming convention and one key that does not fit it should not fail a command over the whole collection."

[[command]]
name = "SORT_RO"
group = "keyspace"
since = "7.0.0"
arity = -2
divergent = "D-24"
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "SORT without STORE, which is the whole difference. It exists so that a replica can answer a sort and so that a client with readonly permissions can ask for one, since SORT itself has to be a write command for the sake of an option most callers never use. STORE is not a word this parser knows, so SORT_RO k STORE d is a syntax error and not a permission error, which is what Redis answers too."

[[command]]
name = "MOVE"
group = "keyspace"
since = "1.0.0"
arity = 3
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "COPY with the source deleted, and the one command here that is cheap for a reason COPY cannot borrow. A body in the slab is already a value standing on its own, so a move can take that body rather than clone it, and moving a set of a million members writes a slot number into another database and deletes a record. The store gained a take next to the existing export for this, and take is the one that deletes the record itself rather than leaving it to the caller, because between the body leaving the slab and the record going there is a record pointing at a slot that has been freed, which is the one state the whole file exists to prevent. A del on top of a take would go through free_body a second time and underflow the count of keys holding a body. The destination is asked about before the source is touched, which is the opposite of Redis's order and answers the same thing, and here it is not about cost: a take that has to be put back is not something this can do. Both misses answer zero, a database index that is not one is an error, and moving a key into the database it is already in is the same object error, which is checked before either key is looked at."

[[command]]
name = "WAIT"
group = "keyspace"
since = "3.0.0"
arity = 3
divergent = "D-25"
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "There is no replication, so the number of replicas that acknowledged this connection's writes is zero and always will be. Redis with no replicas attached gives the same zero, it just takes the whole timeout to do it, and answering at once instead is D-25. It carries the blocking flag because Redis gives it that flag and because that is what a client reads to decide whether it can send this on a pipelined connection, and the flag is what routes it to the file that holds the parking machinery even though it never parks. What is not a formality is the argument checking, since that is the only part of this a client can see today: numreplicas is any integer at all and a negative one is satisfied on the spot, and the timeout is whole milliseconds rather than the seconds BLPOP takes, so it has its own two complaints."

[[command]]
name = "WAITAOF"
group = "keyspace"
since = "7.2.0"
arity = 4
divergent = "D-25"
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "WAIT for the append only file rather than for replicas, and both of its numbers are zero here for the same reason: appendonly is fixed at no, so there is no local file to be behind, and there is no replication, so there are no remote ones either. The reply is a flat array of two integers on both protocols. Redis reads the three arguments with three different helpers and each has its own complaint, which is worth copying exactly because it is the whole of what a client can see: numlocal is a range and says it must be between 0 and 1, numreplicas must be positive, and the timeout is milliseconds and is refused separately for not being an integer and for being negative. The one error a client can provoke that is about the server rather than the arguments is WAITAOF with numlocal set, which cannot be used when appendonly is disabled, and it is disabled and immutable here."

[[command]]
name = "SCAN"
group = "keyspace"
since = "2.8.0"
arity = -2
plan = "cursor"
bounded = "yes"
status = "shipped"
wire = "verified"
notes = "The cursor names a place in the keyspace rather than a place in memory, which is what lets a client hold one across a resize. Redis walks a power of two table that doubles by adding a bit at the top of the bucket index, so it needs reverse binary iteration to keep the two halves of a split bucket next to each other. Ours doubles the directory by copying each entry into two neighbouring slots, so a bit is added at the bottom and a left aligned 48 bit hash prefix is the same number before a doubling and after one. Walking in increasing prefix order is then enough, and a segment that splits partway through a walk can produce a duplicate and never a miss, which is exactly what the contract allows. COUNT is a floor and not a ceiling because a bucket is the smallest unit a cursor can name, so a batch can come back with more keys than asked for, or with none at all and a cursor that is not zero. TYPE is compared case insensitively against the type of each key walked past, so a type nothing can hold matches nothing rather than being an error, which is Redis's behaviour. A key past its deadline is skipped and then deleted once the walk has finished, because the walk itself holds a shared borrow of the index and there is no active expiry cycle yet to collect it. Without that, DBSIZE after a wait answers one more than Redis answers, which is the one difference a side by side run against 8.10.1 turned up."

[[command]]
name = "KEYS"
group = "keyspace"
since = "1.0.0"
arity = 2
plan = "cursor"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "The same walk SCAN makes with no bound on it and no chance of a duplicate, since nothing can split the index while it is running. The risk in the bound field is the command's whole reputation and it is deserved: a database of ten million keys is ten million keys in one reply with the shard doing nothing else. It is here because Redis's own test suite and every piece of tooling want it, and because SCAN is the answer for anything running against a database somebody is using. The embedded API has each instead, which is the same walk handing each key over where it lies, so a walk of a million keys allocates nothing."

[[command]]
name = "RANDOMKEY"
group = "keyspace"
since = "1.0.0"
arity = 1
plan = "cursor"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A random position in the index and a key from the bucket that lands in, which is a constant number of loads whatever the database holds. Uniform within a bucket and only roughly uniform across the keyspace, since a bucket holding two keys and one holding twelve are equally likely to be landed on, and Redis is biased the same way for the same reason. Reservoir sampling within the bucket rather than the first key in it, or it would answer the same key every time for as long as the bucket held still. Sixty four tries before it falls back to a full walk, which is what makes a database that has had almost all of it deleted answer the key that is left rather than nil."

[[command]]
name = "DUMP"
group = "keyspace"
since = "2.6.0"
arity = 2
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
divergent = "D-48"
notes = "The same export COPY and MOVE use, with Redis's file format on the end of it instead of an import. A payload is one type byte, the value, two bytes of RDB version and eight bytes of CRC64, and the bytes in the middle have to be Redis's bytes rather than ours or the whole command is pointless, so the writer follows rdb.c and not a description of it. Redis's own CRC64 is the one place where reading the source mattered: the header comment and every published table say the initial value is all ones, and the function Redis calls starts from whatever the caller passes and every caller passes zero. Each kind goes out as the plainest legal type for it, which is one shape per kind to get right and is accepted by every Redis since 2.6, and the cost is that a set already sitting in a listpack is written member by member where a memcpy would do. The stream is the one kind where that cost is not paid, because a stream node here is already the sixteen byte rax key and the listpack a real server writes, so the whole of the entry data goes out as a length and a copy each and only the counters and the consumer groups behind it are built field by field. It goes out as LISTPACKS_3 and not as the type 27 an 8.10 writes, since the only thing 27 adds is a per group count and an idempotency block that are empty for every stream this server can hold, and the older type is the same data in a shape more servers accept. The deadline is deliberately left behind, since RESTORE is given a fresh one and a payload carrying a moment would be wrong the instant it crossed a machine with a different clock."

[[command]]
name = "RESTORE"
group = "keyspace"
since = "2.6.0"
arity = -4
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
divergent = "D-26, D-30"
notes = "The reader is deliberately not the mirror of the writer. We do not choose what arrives, so it accepts every encoding a modern Redis emits, which means the quicklist, the three listpack forms, the intset, both sorted set forms and both hash forms with field deadlines, all four of the stream types, and LZF decompression on top because rdbcompression is on by default and a payload from a real server is full of compressed strings. The four stream types are the same format with pieces added on the end of it, so what varies is which fields are there and never where anything is, and the three fields the oldest one does not carry are worked out from what it does carry rather than left empty, which is what a real server does with the same payload. The check order is the whole of what a client can see and it is not the order the arguments read in: every option is parsed first, then the busy key check, then the time to live, then the footer, then the bytes, so a key that is already there is refused before anybody looks at the payload. IDLETIME and FREQ are exclusive by a trick worth copying exactly, since neither word is rejected for being the wrong one and each is only accepted while the other is unset, so the second of the two falls through to the plain syntax error. A deadline that has already gone deletes and answers OK, and it does that after the payload has been parsed, because a client that sent bad bytes and a stale deadline should be told about the bytes. An empty collection is refused rather than created, which is Redis's emptykey error and the same rule that makes SREM of the last member delete the key."

[[command]]
name = "MIGRATE"
group = "keyspace"
since = "2.6.0"
arity = -6
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "A DUMP here, a RESTORE there and a socket in between, which is why it came after both of those and not before. Everything goes down the wire in one write, the AUTH if there is one, then a SELECT if the socket is not already on the right database, then a RESTORE for each key that is actually here, and the replies are read back in that order. Pipelining the lot has a consequence that looks like a bug and is what a real server does, since a SELECT that fails does not stop the RESTOREs behind it, so migrating into a database index the peer does not have tells the client about the SELECT while the values quietly land wherever the peer happened to be. Each key stands on its own, so one refused key leaves itself here and lets the others go, and only the first complaint is reported. The socket is kept for the next migration to the same place, sixty four of them and ten seconds of idleness each, which are Redis's numbers, and one that has seen any error is dropped rather than handed out with half a reply still in it. The three IOERR lines were read off a real server rather than off the source, and the surprise is that a refused connect and a name that does not resolve both come out as the write error, because a real server hands the name to a non blocking connect and only notices on the first write."


# ------------------------------------------------------------------------ sets

[[command]]
name = "SADD"
group = "set"
since = "1.0.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One key lookup, then the members go into the body the record points at. A set that does not exist yet is created from the whole argument list rather than from the first member, which is Redis's setTypeCreate: a thousand members at once builds a hashtable straight away instead of building an intset, converting it to a listpack and converting that to a hashtable. Adding nothing to a key that is not there creates nothing, since an empty set does not exist."

[[command]]
name = "SREM"
group = "set"
since = "1.0.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One key lookup for the whole argument list. Removing the last member deletes the key, which is Redis's rule and not a tidy up: an empty set is not a thing that can exist, so EXISTS answers zero straight after. Removing never moves a set back down to a smaller representation, which Redis does not do either."

[[command]]
name = "SCARD"
group = "set"
since = "1.0.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The count the body already keeps, in all three representations, so it is a key lookup and a load and never a walk."

[[command]]
name = "SISMEMBER"
group = "set"
since = "1.0.0"
arity = 3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A binary search in an intset, a linear walk in a listpack and a hash lookup in the element table. The listpack walk is the fast one at the sizes a listpack is used at, which is measured in benches/intset.rs rather than assumed."

[[command]]
name = "SMISMEMBER"
group = "set"
since = "6.2.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One key lookup for every member asked about rather than one each, which is the only reason this exists over sending SISMEMBER in a pipeline. The reply is written straight out a member at a time, so the command allocates nothing whatever the argument count."

[[command]]
name = "SMEMBERS"
group = "set"
since = "1.0.0"
arity = 2
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "The whole set, which is the risk the bound field is naming: a client that sends this at a set of a million members gets a million member reply and there is no cursor in front of it. That is Redis's behaviour and the reason SSCAN exists. The members are written from where they lie, and an integer member is formatted here rather than stored as digits, so a set of a thousand integers stays two kilobytes in memory."

[[command]]
name = "SPOP"
group = "set"
since = "1.0.0"
arity = -2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One draw is a random position and a remove at that position, which every representation does in constant time because a remove moves the last member into the hole rather than shifting anything. A count draws again from the length that is left each turn, so the members come back distinct with no test for it and no bias. The reply for a count is a set and not an array, since the members are distinct and a RESP3 client can safely build one out of them."

[[command]]
name = "SRANDMEMBER"
group = "set"
since = "1.0.0"
arity = -2
plan = "point"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "A positive count splits at a third of the set. Above that it is Knuth's selection sampling, one walk picking each member with the probability that leaves the right number, needing no memory at all. Below it, positions are drawn and repeats thrown away, which needs a set sized to the count and not to the collection. Both are O(count), where selection alone would walk a million members to answer a draw of three and rejection alone would draw forever as the count approached the size. A negative count repeats itself, so it answers an array and not a set: a set would silently lose the repeats."

[[command]]
name = "SMOVE"
group = "set"
since = "1.0.0"
arity = 4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Two keys, and the check order is Redis's rather than the one it looks like it should be. A source that is not there answers zero without ever looking at the destination, so SMOVE nothing a-string m is a zero and not a WRONGTYPE. The destination is filled before the source is emptied, so a slot the source is about to give back cannot be handed straight to the destination underneath the index this is holding."

[[command]]
name = "SSCAN"
group = "set"
since = "2.8.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Only the element table walks in windows. An intset or a listpack answers with every member and a finished cursor, ignoring the cursor it was given, which is what Redis does for the same two encodings and is safe because promotion is one way: a set that gave out a table cursor is still a table. The table walks downward so that an insert lands above the cursor and a removal moves the top row down into the hole, since nothing ever moves a row upward and that is the case the guarantee forbids. MATCH decides how many members there are as the walk goes, so the reply header and the cursor in front of it are both written behind the body and rotated into place."

[[command]]
name = "SINTER"
group = "set"
since = "1.0.0"
arity = -2
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "A probe and never a merge, which is not the plan K11 pre-registered. It predicted a crossover at k around 7 on the assumption that a probe question is much dearer than a counting touch, and benches/setops.rs says both cost about 25 ns because a counting touch hashes its member and makes its own random access. Probe wins at every k from 2 to 16 and the two lines converge without crossing. The crossover comes back when the partitioned band gives us sorted arrays to walk in lockstep, whose touch is a pointer step with no hash anywhere, and that is M4. The counting plan stays reachable so the merge has a control to beat."

[[command]]
name = "SINTERCARD"
group = "set"
since = "7.0.0"
arity = -3
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The same walk with a callback that throws the members away, so the count is the only thing built. LIMIT stops it as soon as it has enough, which is the reason to send this rather than SINTER and a length. The keys are counted rather than positioned, because LIMIT comes after them and there would otherwise be no way to tell a key named LIMIT from the option, and that is why the legacy key range in COMMAND is zeroes here the way it is in Redis."

[[command]]
name = "SINTERSTORE"
group = "set"
since = "1.0.0"
arity = -3
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The destination is presized once from the smallest input, which is an upper bound on any intersection and is Y18's rule. What stopped aki's STORE family at 0.30x was that the rule was not applied. The result is built whole before anything is written, so the destination is allowed to be one of the sources: clearing it first and filling it as the walk goes is the shape that makes SINTERSTORE s s a answer nothing. An empty result deletes the destination rather than leaving an empty set, because an empty set does not exist."

[[command]]
name = "SUNION"
group = "set"
since = "1.0.0"
arity = -2
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "No plan to choose. A union reads every member of every set whatever it does, so the only question is what it does with each one, and the answer is one insertion into a table that is also the duplicate check. A key that is not there contributes nothing rather than emptying the answer, which is the opposite of what it does to an intersection and is right for the same reason."

[[command]]
name = "SUNIONSTORE"
group = "set"
since = "1.0.0"
arity = -3
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Presized to the sum of the inputs, since a union of sets that share nothing is all of them. Being wrong about that costs a conversion and not a wrong answer."

[[command]]
name = "SDIFF"
group = "set"
since = "1.0.0"
arity = -2
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "Always a probe and never anything else. The first set is the one being walked whether we like it or not, so the only choice is how each member is checked, and the later sets are asked smallest first because a member that is going to be found will usually be found in the smallest of them. A first key that is not there is an empty answer whatever the rest hold, and a later key that is not there takes nothing away."

[[command]]
name = "SDIFFSTORE"
group = "set"
since = "1.0.0"
arity = -3
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Presized from the first set, which is an upper bound on what a difference can keep."

[[command]]
name = "SUNIONCARD"
group = "set"
since = "8.10.0"
arity = -3
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "What SINTERCARD is to SINTER, this is to SUNION: the same walk with the members thrown away so only the count is built, and a LIMIT that stops it as soon as it has enough. The keys go behind a count for the same reason SINTERCARD's do, which is that LIMIT comes after them. Stopping early is sound here in a way it would not be for SUNION itself, because the count is the answer and the members are not, so which ones the walk happened to reach first does not matter."

[[command]]
name = "SDIFFCARD"
group = "set"
since = "8.10.0"
arity = -3
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The same shape as SUNIONCARD over a difference rather than a union, so it walks the first key and counts the members none of the rest hold. LIMIT stops it the same way and for the same reason."

# ---------------------------------------------------------------------- hashes

[[command]]
name = "HSET"
group = "hash"
since = "2.0.0"
arity = -4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One key lookup, then the pairs go into the body the record points at. A hash that does not exist yet is sized from the whole argument list, so an HSET with a thousand pairs builds the element table straight away instead of filling a listpack and converting it. Writing a field that is already there rewrites eight bytes of row and the new value and does not touch the field name at all, because the names are interned per collection."

[[command]]
name = "HSETNX"
group = "hash"
since = "2.0.0"
arity = 4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Per field and not per key, unlike SETNX, so it writes into a hash that already exists as long as that one field is missing. One lookup for the probe and the write together."

[[command]]
name = "HMSET"
group = "hash"
since = "2.0.0"
arity = -4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The same write as HSET with an OK instead of a count. Deprecated since 4.0 and still sent by a great deal of client code, so it shares the implementation rather than being left out or being an alias that drifts."

[[command]]
name = "HGET"
group = "hash"
since = "2.0.0"
arity = 3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A linear walk with a step of two in a listpack, so a value is never matched as a field, and one probe in the element table. The value is written from where it lies and a value stored as an integer is formatted into the reply buffer rather than into the hash."

[[command]]
name = "HMGET"
group = "hash"
since = "2.0.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One key lookup for every field asked about rather than one each, which is the only reason this exists over HGET in a pipeline. The reply is positional, so a field that is not there gets a nil and not a gap, and a key that is not there answers all nils rather than an empty array."

[[command]]
name = "HDEL"
group = "hash"
since = "2.0.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One key lookup for the whole argument list. Removing the last field deletes the key, since an empty hash cannot exist. The value bytes are handed back to the hash's blob as dead rather than moved out of it, and the blob is rebuilt once the dead outnumber the live."

[[command]]
name = "HLEN"
group = "hash"
since = "2.0.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The count the body already keeps, in both representations, so it is a key lookup and a load and never a walk."

[[command]]
name = "HEXISTS"
group = "hash"
since = "2.0.0"
arity = 3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The HGET probe without the value, which matters in the listpack band where not reading the value is the whole saving."

[[command]]
name = "HSTRLEN"
group = "hash"
since = "3.2.0"
arity = 3
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A value held as an integer answers with how many digits it would take, counted rather than formatted, so this never writes a number out just to measure it. A missing field is zero and not a nil, which is Redis's answer and reads oddly until you notice it matches STRLEN on a missing key."

[[command]]
name = "HGETALL"
group = "hash"
since = "2.0.0"
arity = 2
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "The whole hash, which is the risk the bound field names: a client that sends this at a hash of a million fields gets a million pair reply and there is no cursor in front of it. That is Redis's behaviour and the reason HSCAN exists. It answers a map on RESP3 and the same pairs flattened on RESP2, and the count comes from the body the walk is about to read rather than from a second lookup."

[[command]]
name = "HKEYS"
group = "hash"
since = "2.0.0"
arity = 2
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "The same walk as HGETALL with the values dropped. It is not cheaper in the listpack band, where the values are in the way whatever is done with them, and it is cheaper in the table band, where the values are in a blob nothing touches."

[[command]]
name = "HVALS"
group = "hash"
since = "2.0.0"
arity = 2
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "The same walk with the fields dropped."

[[command]]
name = "HINCRBY"
group = "hash"
since = "2.0.0"
arity = 4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A field that is not there counts as zero and is created, which is what makes this the counter primitive it gets used as. The overflow is checked before the write rather than wrapped and stored, so a sum that leaves the range is an error and leaves the field holding exactly what it held."

[[command]]
name = "HINCRBYFLOAT"
group = "hash"
since = "2.6.0"
arity = 4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The same rules with the float errors. An infinite increment is not refused up front: Redis parses it, does the addition and then reports that the result is not finite, so the message is about the result and not about the argument. The reply is a bulk string on both protocols and never a double, because the exact digits are the point and a client that got a double back would have to trust its own formatting to round trip."

[[command]]
name = "HRANDFIELD"
group = "hash"
since = "6.2.0"
arity = -2
plan = "point"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "A positive count is Knuth's selection sampling, one walk taking each field with the probability that leaves the right number, needing no memory at all. SRANDMEMBER splits its positive form two ways because a set can be millions of members and a draw of three should not walk them; a hash builds the whole answer either way, so there is nothing for a second strategy to save. A negative count repeats itself and answers an array rather than a map, since a map would silently lose the repeats. WITHVALUES nests each pair on RESP3 and flattens it on RESP2, which is Redis's split and the only place in this group where the protocols disagree about the shape rather than the type."

[[command]]
name = "HSCAN"
group = "hash"
since = "2.8.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Only the element table walks in windows. A listpack answers with every pair and a finished cursor, ignoring the cursor it was given, which is what Redis does for the same encoding and is safe because promotion is one way. MATCH is matched against the field and never the value, and it decides how many pairs there are as the walk goes, so the reply header and the cursor in front of it are both written behind the body and rotated into place. NOVALUES is 7.4 and is not a shortcut for HKEYS: it still walks in windows, so it is the only way to page through the fields of a large hash without pulling every value across the wire too."

[[command]]
name = "HEXPIRE"
group = "hash"
since = "7.4.0"
arity = -6
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A field has no header to keep a deadline in, the way a key does, so the deadline goes beside the field instead. In the packed band the blob widens from two elements a field to three and OBJECT ENCODING starts saying listpackex, which is Redis's own answer for the same shape. In the table band a side array is allocated the first time any field of that hash gets a deadline, so a hash that never uses this carries three words and no allocation. Both bands go through one copy of the NX, XX, GT and LT rule, because two copies means one of them is wrong. Widening is one way, like promotion: a hash whose last deadline came off keeps the wider shape rather than rewriting itself to save a byte a field."

[[command]]
name = "HPEXPIRE"
group = "hash"
since = "7.4.0"
arity = -6
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The same command counting in milliseconds. All four setters normalise to one absolute millisecond before anything is touched, so there is one implementation and the difference between them is two booleans at the door."

[[command]]
name = "HEXPIREAT"
group = "hash"
since = "7.4.0"
arity = -6
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Absolute rather than relative, which is the only thing that separates it from HEXPIRE once the seconds are multiplied out. A deadline already past deletes the field and answers 2 rather than storing a number that is dead on arrival, and if that was the last field the key goes with it."

[[command]]
name = "HPEXPIREAT"
group = "hash"
since = "7.4.0"
arity = -6
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Absolute and in milliseconds, which is the form the other three are turned into. Redis has two different error messages here and they were checked against a real 8.10.1 rather than read off the documentation: a negative number is invalid expire time, must be >= 0, and one too large to be a moment is invalid expire time in the command, named."

[[command]]
name = "HTTL"
group = "hash"
since = "7.4.0"
arity = -5
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Minus two for a field that is not there and minus one for a field with no deadline, which is the same pair of answers TTL gives for a key. The seconds round up, so a field with half a second left answers 1 and not 0, and that was confirmed on a real server rather than assumed."

[[command]]
name = "HPTTL"
group = "hash"
since = "7.4.0"
arity = -5
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The same walk in milliseconds, with no rounding to do."

[[command]]
name = "HEXPIRETIME"
group = "hash"
since = "7.4.0"
arity = -5
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The moment rather than what is left of it. All five readers share one walk and two booleans decide the arithmetic, which is why there are two helpers behind these nine commands and not nine."

[[command]]
name = "HPEXPIRETIME"
group = "hash"
since = "7.4.0"
arity = -5
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The stored number handed straight back, since a deadline is already an absolute millisecond."

[[command]]
name = "HPERSIST"
group = "hash"
since = "7.4.0"
arity = -5
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Takes the deadline off and answers 1, without saying what it was. Worth knowing that a plain HSET does this too: writing a field clears its deadline, which has been Redis's rule since 7.4 and is the whole reason HGETEX exists as a command instead of a flag on HGET."

[[command]]
name = "HGETDEL"
group = "hash"
since = "8.0.0"
arity = -5
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The values positionally, then the fields go, and the key goes with the last of them. This one arrived years after the HEXPIRE family and words the same three numfields mistakes in three different sentences to it, which is upstream and is copied rather than tidied."

[[command]]
name = "HGETEX"
group = "hash"
since = "8.0.0"
arity = -5
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The value out first and the deadline applied second, which is what makes a past EXAT hand the value back and take the field anyway. Unlike GETEX, no option here means leave the deadline alone rather than clear it, and PERSIST is how you ask for it gone."

[[command]]
name = "HSETEX"
group = "hash"
since = "8.0.0"
arity = -6
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One answer for the whole list, because FNX and FXX are asked over every field named and not one at a time. KEEPTTL is needed because the write clears the deadline first, so the deadline is read before the value is stored and put back after."

[[command]]
name = "HIMPORT"
group = "hash"
since = "8.10.0"
arity = -2
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
divergent = "D-45"
notes = "A container of four subcommands over one idea. A client about to write a million hashes with the same shape declares the shape once with PREPARE and then sends only the values for each key, so the field names cross the wire once instead of a million times. The fieldsets are connection state and not keyspace state, which is the reference's design and the surprising part of it: a fieldset is invisible to every other connection, RESET throws them all away and SELECT does not, and a key built from one outlives both the fieldset and the connection. Two orders are in play and they are not the same order, because the values on a SET line arrive in the order the fields were declared in and the hash is built in sorted order, and the sort is by length before bytes, so a fieldset of b and aa builds a hash whose first field is b. SET replaces the key rather than editing it, which is what takes the old fields and the old deadline with it, and the lengths are checked before anything is deleted so a call that cannot go through leaves the key alone. WRONGTYPE beats both of the other complaints, so SET against a string is a type error even when the fieldset is missing too. The plan is whole-value because it replaces the key, and it is a risk because the size of the write is the size of the argument list. The storage saving the encoding went after is not here and is D-45."


# ---------------------------------------------------------------------- lists

[[command]]
name = "LPUSH"
group = "list"
since = "1.0.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One key lookup for the whole argument list, then the elements go into the body the record points at. A list that does not exist yet starts packed and stays that way until it crosses list-max-listpack-size, which is the same one way promotion a set and a hash have. Each element in turn goes at the head, so LPUSH k a b c leaves the list holding c b a, and that reads like a bug and is what Redis does."

[[command]]
name = "RPUSH"
group = "list"
since = "1.0.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "LPUSH from the other end. The tail is the cheaper end in the packed band, because appending to a listpack does not move the elements already in it, and both ends cost the same once the list is a chain of chunks."

[[command]]
name = "LPUSHX"
group = "list"
since = "2.2.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The same push behind a key lookup that answers zero rather than creating anything. It exists so that a producer can refuse to bring a queue back to life after a consumer drained it, which is a race a GET followed by an LPUSH cannot close."

[[command]]
name = "RPUSHX"
group = "list"
since = "2.2.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "LPUSHX from the other end."

[[command]]
name = "LPOP"
group = "list"
since = "1.0.0"
arity = -2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Each element is handed to the reply while it is still in the list and dropped straight after, so a LPOP of a thousand never builds a thousand of anything on the shard thread. The two reply shapes are different and not one shape with a length: without a count a missing key is a null and with one it is a null array, which a RESP2 client can tell apart on the wire. The key goes when the last element does."

[[command]]
name = "RPOP"
group = "list"
since = "1.0.0"
arity = -2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "LPOP from the other end."

[[command]]
name = "LLEN"
group = "list"
since = "1.0.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A field on the list in both bands, so it is a load and not a walk of the chunks."

[[command]]
name = "LRANGE"
group = "list"
since = "1.0.0"
arity = 4
plan = "cursor"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "The range is walked straight into the reply buffer and the array header is written behind it, so nothing is collected on the way out. LRANGE key 0 -1 over a list of ten million is still ten million elements on the wire, which is the risk the verdict names and the reason the descriptor cache in K10 matters: today reaching the start of the range walks the chunks in front of it."

[[command]]
name = "LINDEX"
group = "list"
since = "1.0.0"
arity = 3
plan = "cursor"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A negative index counts from the back and the walk starts at the nearer end, so LINDEX key -1 is as cheap as LINDEX key 0. In the chunked band it is a walk of chunk headers and not of elements, and it becomes a lookup once the counted tree in K10 lands."

[[command]]
name = "LSET"
group = "list"
since = "1.0.0"
arity = 4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The one list write with two errors and no boolean, because both ways of missing are errors on the wire: no such key for a key that is not there and index out of range for an index the list does not reach. A list is never empty, so those are the only two."

[[command]]
name = "LINSERT"
group = "list"
since = "2.2.0"
arity = 5
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Three answers in one signed number: the new length, minus one when the pivot is not there and zero when the key is not there. That is Redis's choice and a bad one, and it is on the wire and cannot be changed."

[[command]]
name = "LREM"
group = "list"
since = "1.0.0"
arity = 4
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A positive count removes that many from the front, a negative one that many from the back and zero removes every match, which is three directions in one argument. The key goes if the list ends up empty."

[[command]]
name = "LTRIM"
group = "list"
since = "1.0.0"
arity = 4
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A window that selects nothing deletes the key, which is not tidying up: LTRIM k 1 0 is the documented way to empty a list and it has to leave EXISTS answering zero. In the chunked band the chunks wholly outside the window are dropped rather than walked element by element."

[[command]]
name = "LPOS"
group = "list"
since = "6.0.6"
arity = -3
plan = "cursor"
bounded = "yes"
status = "shipped"
wire = "verified"
notes = "The positions go into the reply as they are found, so LPOS key x COUNT 0 over a list with ten thousand matches never builds a list of ten thousand numbers anywhere. MAXLEN is the bound and it is the client's to set. Three replies for what looks like one outcome: a null with no COUNT, an empty array with one, and an empty array again for a key that is not there."

[[command]]
name = "RPOPLPUSH"
group = "list"
since = "1.2.0"
arity = 3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "LMOVE with both ends fixed, kept as its own name because it is the one every client library still sends. The element is copied once, for the reason SPOP gives: what comes back has no structure left to borrow from."

[[command]]
name = "LMOVE"
group = "list"
since = "6.2.0"
arity = 5
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The destination's type is checked before anything is taken, so LMOVE list string LEFT LEFT is a WRONGTYPE with the source untouched rather than an element that has gone nowhere. The source and the destination being the same key is not a case to work around, it is LMOVE k k LEFT RIGHT, which is how a list is rotated and what a round robin scheduler is built out of."

[[command]]
name = "LMPOP"
group = "list"
since = "7.0.0"
arity = -4
plan = "merge"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The keys are behind a count, so COMMAND INFO reports no key positions and a cluster client has to ask COMMAND GETKEYS. The first key holding anything is the one that is popped, which is the point: one round trip instead of an LLEN per key and then an LPOP. A key of another type anywhere in the list is an error even when an earlier key would have answered."

[[command]]
name = "BLPOP"
group = "list"
since = "2.0.0"
arity = -3
plan = "merge"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "LPOP with a client that can be parked. What is kept while it waits is the command and not the client: the keys it named, what it meant to do with them and when to give up, so waking it is running the same attempt again against a database that has changed since. A timeout of exactly zero is no timeout, and -0.0 is exactly zero, so BLPOP k -0.0 waits forever while BLPOP k -0.1 is an error. The reply names the key that answered, which is the one difference from LPOP."

[[command]]
name = "BRPOP"
group = "list"
since = "2.0.0"
arity = -3
plan = "merge"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "BLPOP off the other end. Every key is type checked even when an earlier one is empty, so BRPOP empty string 0 is a WRONGTYPE rather than a wait, and a key that somebody turns into a set while a client is parked on it does not wake that client and does not error at it either: the wake condition is that the key holds a list with something in it, and anything else leaves the client waiting until its own deadline."

[[command]]
name = "BLMOVE"
group = "list"
since = "6.2.0"
arity = 6
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "LMOVE with a wait on the source. The destination is only looked at once there is something to move, so BLMOVE empty string LEFT RIGHT 0.1 times out rather than answering WRONGTYPE, which is the one place the type check order is visible from outside. A waiter that serves itself wakes the next one in the same moment, so a chain of BLMOVE clients passes an element along without a turn of the loop in between."

[[command]]
name = "BRPOPLPUSH"
group = "list"
since = "2.2.0"
arity = 4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "BLMOVE RIGHT LEFT under the older name, and it is the same code. On a timeout it answers a null array and not a null string, even though what it sends when it succeeds is a single element, which a RESP2 client can see: *-1 and not $-1. All five of the blocking list commands do that."

[[command]]
name = "BLMPOP"
group = "list"
since = "7.0.0"
arity = -5
plan = "merge"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "LMPOP with a wait, and the same parse shifted along by one. The timeout is read before the key count, so BLMPOP abc 0 k LEFT complains about the timeout and not about the count. A COUNT that is not a number at all gets the same sentence a zero or a negative one gets, which is count should be greater than 0 rather than the usual message about integers."

[[command]]
name = "LMOVEM"
group = "list"
since = "8.10.0"
arity = -5
plan = "point"
bounded = "yes"
status = "shipped"
wire = "verified"
notes = "LMOVE with a count, so a batch of elements crosses between two lists in one call instead of one round trip each. It is bounded rather than inherent because the count is the client's, which is the difference between this and LMOVE. COUNT takes what it can and EXACTLY takes all of them or none, which has to be decided before anything is taken. OBO and BULK only differ when both ends are the same, because that is when each element lands in front of the last, and the whole block goes through the scratch buffer before any of it is pushed so that the destination is allowed to be the source."

[[command]]
name = "BLMOVEM"
group = "list"
since = "8.10.0"
arity = -6
plan = "point"
bounded = "yes"
status = "shipped"
wire = "verified"
notes = "LMOVEM with a wait, in the same waiter machinery the other five blocking list commands use. The options sit behind the timeout rather than in front of it, so the parse is ends, then timeout, then the block, and a line wrong in two of those says the earliest one. The one thing here that is not shared with the other five is what ready means: they wake on anything arriving, and this wakes on anything for COUNT but only on the whole block for EXACTLY. Until it is ready the destination is never looked at, so a short EXACTLY against a destination holding a string times out rather than answering WRONGTYPE, which is what 8.10.1 does and is the same rule BLMOVE already follows."

# ------------------------------------------------------------------ sorted set

[[command]]
name = "ZADD"
group = "zset"
since = "1.2.0"
arity = -4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One key lookup for the whole pair list, then a hash probe and a tree descent per pair. Every score is parsed before the first one is stored, so ZADD key 1 a nonsense b adds nothing at all, which is Redis's answer and the only behaviour that makes the command safe to retry. The option parse has one surprise in it and it is Redis's: the pairs are counted before the incompatible options are looked at, so ZADD key NX XX is a syntax error about having no pairs rather than the complaint about NX and XX. GT and LT are worked out before the add and not after, because both are questions about the score that is already there."

[[command]]
name = "ZINCRBY"
group = "zset"
since = "1.2.0"
arity = 4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "ZADD INCR without the gates, and the same code underneath, because a version of this that did its own add would be a second place the NaN rule lives. Infinity plus its opposite is refused and the score is left alone, since a NaN compares equal to nothing including itself and a sorted set is nothing but comparisons. A key that was created for an increment that then fails is deleted again, so a refused ZINCRBY leaves no empty sorted set behind."

[[command]]
name = "ZCARD"
group = "zset"
since = "1.2.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The length is held in whichever band the sorted set is on and neither has to be walked to find it."

[[command]]
name = "ZSCORE"
group = "zset"
since = "1.2.0"
arity = 3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A hash probe on the element table and nothing else, because a score is a property of a member and not a question about order. This is the half of the sorted set the tree is not involved in, and it is why the tree holds row numbers rather than scores."

[[command]]
name = "ZMSCORE"
group = "zset"
since = "6.2.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "ZSCORE once per member, with the keyspace memo answering the second and later lookups without going back to the map. The reply is written a score at a time straight into the out buffer, so asking about a thousand members allocates nothing."

[[command]]
name = "ZREM"
group = "zset"
since = "1.2.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A probe to find the member, a search to find where it sits, and then the removal renumbers whichever row moved into the hole. That last part is the whole reason the tree can be updated in place rather than rebuilt: the element table fills a hole with its last row, so exactly one row number in the tree changes and the search that finds it is the same search everything else uses. The key goes when the last member goes."

[[command]]
name = "ZRANK"
group = "zset"
since = "2.0.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A probe for the score and then a descent for the position, which is the two structures answering the two halves of one question. WITHSCORE changes the shape of the answer both ways: the rank becomes a two element array and a member that is not there becomes the array nil rather than the string one, and a RESP2 client tells those apart. An argument too many is the arity error and a bad option is the syntax one, which is Redis's split and reads backwards until you notice the option is optional."

[[command]]
name = "ZREVRANK"
group = "zset"
since = "2.0.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "ZRANK counted from the other end, which is the length minus the rank minus one and not a second search."

[[command]]
name = "ZCOUNT"
group = "zset"
since = "2.0.0"
arity = 4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Two descents and a subtraction. This is ZRANGEBYSCORE with the walk left off, and it is the same Query the range commands build, which is why an exclusive bound cannot be right in one of them and wrong in the other."

[[command]]
name = "ZLEXCOUNT"
group = "zset"
since = "2.8.9"
arity = 4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "ZCOUNT against the other kind of bound. A lexical range only means anything when every member has the same score, which the command does not check and Redis does not either, because the order is by score and then by member and the answer is well defined either way."

[[command]]
name = "ZRANGE"
group = "zset"
since = "1.2.0"
arity = -4
plan = "cursor"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "Nine spellings of a range go through one parse and produce one Query, and this is the one that can say all of it: three by-modes, REV on any of them, LIMIT on the two that take bounds and WITHSCORES on the two that are not lexical. The window is measured before anything is walked, so the array header goes out in front of the members and the read path never builds a list. ZRANGE key 0 -1 is still the whole set on the wire, which is the risk the verdict names and is the same one LRANGE carries, since a client asking for everything gets everything. WITHSCORES nests each pair on RESP3 and flattens it on RESP2, which is the one place in this group where the two protocols disagree about the shape of a reply rather than the type of one value in it."

[[command]]
name = "ZREVRANGE"
group = "zset"
since = "1.2.0"
arity = -4
plan = "cursor"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "ZRANGE with REV and no options, and the same code underneath. It still reads the WITHSCORES and LIMIT tokens and then refuses LIMIT afterwards, because that is what Redis does and a client that sends ZREVRANGE key 0 -1 WITHSCORES LIMIT 0 1 expects to hear about LIMIT rather than about the word after it."

[[command]]
name = "ZRANGEBYSCORE"
group = "zset"
since = "1.0.5"
arity = -4
plan = "cursor"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "Two descents to find the ends of the window and then a walk between them, so the cost is the size of the answer and not the size of the set. An exclusive bound is a bound on the same descent and not a member skipped afterwards."

[[command]]
name = "ZREVRANGEBYSCORE"
group = "zset"
since = "2.2.0"
arity = -4
plan = "cursor"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "The same window backwards, and it names its high end first, which ZRANGE key min max BYSCORE REV does not. That swap is one line in the parse and it is the only difference between the two spellings."

[[command]]
name = "ZRANGEBYLEX"
group = "zset"
since = "2.8.9"
arity = -4
plan = "cursor"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "The lexical bounds, which are the four shapes a member bound can take: a minus for the low end, a plus for the high one, a bracket for inclusive and a paren for exclusive. Anything else is min or max not valid string range item, which is a different error from the one a bad score bound gives."

[[command]]
name = "ZREVRANGEBYLEX"
group = "zset"
since = "2.8.9"
arity = -4
plan = "cursor"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "ZRANGEBYLEX backwards with its high end named first. Redis refuses WITHSCORES on any lexical range even though it could answer it, and the refusal is a sentence of its own rather than a plain syntax error, so it is copied as one."

[[command]]
name = "ZRANGESTORE"
group = "zset"
since = "6.2.0"
arity = -5
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The same parse with the destination in front, and the one spelling that does not take WITHSCORES at all, because the destination is a sorted set and keeps the scores whatever is asked for. The result is built whole before the destination is written, so ZRANGESTORE z z 1 2 reads the old body and is safe. A window that comes out empty deletes the destination rather than leaving an empty sorted set behind."

[[command]]
name = "ZREMRANGEBYRANK"
group = "zset"
since = "2.0.0"
arity = 4
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The same Query the read side builds, with the walk turned into a removal. A negative index counts back from the end before anything is removed, so the window is decided once against the length the command started with."

[[command]]
name = "ZREMRANGEBYSCORE"
group = "zset"
since = "1.2.0"
arity = 4
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "By-mode in the name and no options at all, so the arity check is the whole of the syntax. The key is deleted when the last member goes."

[[command]]
name = "ZREMRANGEBYLEX"
group = "zset"
since = "2.8.9"
arity = 4
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The lexical removal, and the third of the three that share a parse with the reads. Three separate window calculations would have been three chances to get an exclusive bound wrong in exactly one of them."

[[command]]
name = "ZUNION"
group = "zset"
since = "6.2.0"
arity = -3
plan = "merge"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "The accumulator is the result rather than something the result is copied out of, so a union gathers into an unordered element table and the order is put on it once at the end, by sorting row numbers and filling the tree by appending. A plain set is a legal input because Redis says it is, and it behaves as a sorted set in which every member scores one. A key that is not there keeps its place in the input list rather than being dropped, since WEIGHTS is positional and dropping it would line the weights up against the wrong keys."

[[command]]
name = "ZINTER"
group = "zset"
since = "6.2.0"
arity = -3
plan = "merge"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "The same gather with the smallest input walked first, which is Y18's rule and is what stopped aki's version at a fraction of the speed. The answer can only be as big as the smallest input, so that is what the accumulator is presized from."

[[command]]
name = "ZDIFF"
group = "zset"
since = "6.2.0"
arity = -3
plan = "merge"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "Takes neither WEIGHTS nor AGGREGATE, because a difference keeps the first input's scores and never combines two of them, so there is nothing for either option to do. Redis calls both a syntax error and so does this."

[[command]]
name = "ZUNIONSTORE"
group = "zset"
since = "2.0.0"
arity = -4
plan = "merge"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The gather with the walk left off and a store put on. The result is built whole before the destination is touched, so the destination is allowed to be one of the sources and ZUNIONSTORE z 2 z y reads the old body. An empty result deletes the destination rather than leaving an empty sorted set behind, because an empty one does not exist."

[[command]]
name = "ZINTERSTORE"
group = "zset"
since = "2.0.0"
arity = -4
plan = "merge"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "ZINTER with the store, and the same rule about the destination naming its own source."

[[command]]
name = "ZDIFFSTORE"
group = "zset"
since = "6.2.0"
arity = -4
plan = "merge"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "ZDIFF with the store. The count it answers is the size of what was written and not the size of the difference before the destination was cleared, which are the same number and would not be if the destination were cleared first."

[[command]]
name = "ZINTERCARD"
group = "zset"
since = "7.0.0"
arity = -3
plan = "merge"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Counting does not need any of the ordering an intersection needs, so this does not go through the gather at all: nothing is stored, no score is worked out, and a limit stops the walk the moment it is reached. That is the whole reason the command exists and it is why it is not ZINTER with the members thrown away."

[[command]]
name = "ZRANDMEMBER"
group = "zset"
since = "6.2.0"
arity = -2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A positive count draws without replacement with a partial shuffle of the row numbers, not a retry loop, because a retry loop on a count near the size of the set spends most of its time drawing members it already has. A negative count draws with replacement and answers exactly as many as asked for. A count at or over the size hands back the whole set in storage order, which is what Redis does and saves shuffling in order to return everything anyway. Without a count at all it answers one member or a nil, which is a different reply type from the empty array a count of zero gives."

[[command]]
name = "ZSCAN"
group = "zset"
since = "2.8.0"
arity = -3
plan = "cursor"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The guarantee is the one every scan gives: a member that was there for the whole walk is seen at least once. A listpack sorted set comes back whole with a cursor of zero, since a listpack has no stable position to resume from and 128 members is not worth a resume. This is the one sorted set reply where a score is not a double on RESP3, because a scan answers pairs of bulk strings whatever the protocol, which is Redis's shape and the same one HSCAN has."

[[command]]
name = "ZPOPMIN"
group = "zset"
since = "5.0.0"
arity = -2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The presence of the count decides the reply shape and its value does not. Without a count the answer is one flat member and score, and with one it is a list of pairs, nested on RESP3 and flattened on RESP2. A missing key answers an empty array rather than a null, which is where a sorted set pop and a list pop part company, and ZPOPMIN key 0 answers the same empty array a missing key does. A count that is negative or is not a number at all gets value is out of range, must be positive rather than the usual sentence about integers."

[[command]]
name = "ZPOPMAX"
group = "zset"
since = "5.0.0"
arity = -2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "ZPOPMIN from the other end and the same code. Nothing is collected on the way out: the member is handed to the writer and only then removed, so a pop of a thousand members allocates nothing."

[[command]]
name = "ZMPOP"
group = "zset"
since = "7.0.0"
arity = -4
plan = "merge"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The keys are behind a count, so COMMAND INFO reports no key positions and a cluster client has to ask COMMAND GETKEYS. The first key holding anything is the one that is popped and a key of another type anywhere in the list is an error even when an earlier key would have answered. The pairs are nested on both protocols, unlike ZPOPMIN with a count, because the reply already has the key name in front of them and there is nothing left to flatten into. Nothing to pop is a null array and not a null."

[[command]]
name = "BZPOPMIN"
group = "zset"
since = "5.0.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "ZPOPMIN with a wait, and the reply is three elements side by side rather than a key and a pair: the key, the member and the score. That is not the shape ZPOPMIN has and it is Redis's. A key that holds something other than a sorted set is an error when the command arrives and is skipped when a parked client is retried, so a ZADD to a key somebody is blocked on serves them and a SET to it leaves them waiting."

[[command]]
name = "BZPOPMAX"
group = "zset"
since = "5.0.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "BZPOPMIN from the other end and the same code. On a timeout it answers a null array and not a null member, which a RESP2 client can see as *-1 rather than $-1."

[[command]]
name = "BZMPOP"
group = "zset"
since = "7.0.0"
arity = -5
plan = "merge"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "ZMPOP with a wait, and the same parse shifted along by one. The timeout is read before the key count, so BZMPOP abc 1 k MIN complains about the timeout and not about the count. A key count that leaves no room for the direction is a plain syntax error, because the word that should have been MIN or MAX is swallowed as a key and there is nothing left to read."


# ------------------------------------------------------------------------- geo
#
# Ten commands over the sorted set the four above it write, which is why they
# are here rather than in a group of their own: a place is a member scored with
# the 52 bit interleave of its longitude and its latitude, so ZREM removes a
# place, ZCARD counts them and ZSCORE answers the hash. Six of the ten are one
# search written six ways, three of which Redis deprecated and none of which it
# has removed.

[[command]]
name = "GEOADD"
group = "geo"
since = "3.2.0"
arity = -5
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "ZADD with the coordinates turned into a score on the way in, and it takes NX, XX and CH for that reason. Every triple is parsed before any of them is stored, so a call with one bad pair in it leaves the key exactly as it was rather than half updated. A count of arguments that is not three of them after the options is a syntax error and not an arity one, which is where GEOADD k CH CH CH CH lands: Redis hands zero triples to the ZADD path and that is what the path says about zero."

[[command]]
name = "GEOPOS"
group = "geo"
since = "3.2.0"
arity = -2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One entry for each member asked about, so the reply is as long as the command and nothing else. A member that is not there is a null array and not a null string, which a RESP2 client sees as *-1, and a key that is not there answers the same thing once for each member rather than an empty array. The coordinates come back out of the score and are not the ones that went in, because a 52 bit hash is about 0.6 metres of resolution and the decoded pair is the centre of the box the original point fell in."

[[command]]
name = "GEOHASH"
group = "geo"
since = "3.2.0"
arity = -2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The same shape as GEOPOS with the standard eleven character geohash string in place of the pair, and a null string rather than a null array for a member that is not there. The eleven characters are not the score in base 32: Redis re-encodes the decoded point over the real world range of minus 90 to 90 rather than the minus 85.05 the score uses, so a geohash from here pastes into any site that takes one."

[[command]]
name = "GEODIST"
group = "geo"
since = "3.2.0"
arity = -4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Two lookups and a haversine over a sphere of 6372797.560856 metres. The unit is read before the members are looked up, so a bad unit beats a missing key, and a missing member on either side is a null string rather than an error. The answer is a bulk string of exactly four decimal places on both protocols and not a RESP3 double, which is the one place in the geo group where a number is deliberately not written the way the rest of the server writes numbers."

[[command]]
name = "GEOSEARCH"
group = "geo"
since = "6.2.0"
arity = -7
plan = "cursor"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "The spelling of the search that is not deprecated, and the only one that can take a box. The centre is FROMMEMBER or FROMLONLAT and the shape is BYRADIUS or BYBOX, exactly one of each, and leaving either out has its own sentence that quotes the command back the way the client spelled it. Nine geohash boxes at a precision chosen to cover the shape are walked as nine score ranges over the sorted set, and each candidate is then measured properly, so the neighbour boxes cost a range lookup each and no false positive survives to the reply."

[[command]]
name = "GEOSEARCHSTORE"
group = "geo"
since = "6.2.0"
arity = -8
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "GEOSEARCH with the results written to a key instead of to the client, which is why it takes no WITH option and says so in a sentence of its own if one is given. By default it stores the geohash score, so the destination is a geo key that can be searched again, and STOREDIST stores the distance in the search unit instead, which makes it an ordinary sorted set ordered by how far away things are. A search that finds nothing deletes the destination rather than leaving what was there."

[[command]]
name = "GEORADIUS"
group = "geo"
since = "3.2.0"
arity = -6
plan = "cursor"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "Deprecated in 6.2 and still here, because deprecated in Redis means documented as old rather than removed. It is GEOSEARCH with the centre and the radius as fixed arguments, plus STORE and STOREDIST, and those two are what make it a write command with movable keys. The source key is looked up and type checked before a single argument is read, so a wrong type beats a radius that will not parse, and that order is part of what a client sees."

[[command]]
name = "GEORADIUS_RO"
group = "geo"
since = "3.2.10"
arity = -6
plan = "cursor"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "GEORADIUS with the two store options taken away, which is the whole difference and is enough to make it a readonly command that a replica will run. Naming a store here is a plain syntax error rather than the sentence about incompatible options, because the words are not in its table at all."

[[command]]
name = "GEORADIUSBYMEMBER"
group = "geo"
since = "3.2.0"
arity = -5
plan = "cursor"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "GEORADIUS centred on a member of the same key rather than on a pair of numbers. A key that is not there answers the empty array without ever looking the member up, and a member that is not there in a key that is answers that it could not decode the member, which is Redis's sentence for it and reads oddly because the failure is the lookup and not the decode."

[[command]]
name = "GEORADIUSBYMEMBER_RO"
group = "geo"
since = "3.2.10"
arity = -5
plan = "cursor"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "The readonly half of the pair above, and at twenty characters the longest command name a real server answers to, which is why the dispatch table's name length bound is what it is."


# ---------------------------------------------------------------------- graph

[[command]]
name = "G.NADD"
group = "graph"
since = "8.8.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One node id lookup, one label free write and one document into the node store, which is the same write a document collection takes because it is the same store. The reply is 1 for a node that was not there and 0 for one whose properties were replaced, so an ingest can count what it created without reading anything back. An isolated node is an empty object of four bytes, which is what lets the property store double as the node table and answer whether a node exists at all."

[[command]]
name = "G.NGET"
group = "graph"
since = "8.8.0"
arity = 3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A hash lookup for the dense id and then one document read. Every value comes back as a bulk string because every value went in as one, and a node written by the embedded API that holds an integer comes back as its digits. There is nothing on the wire that says whether a client meant 5 or the text 5, so guessing would hand back something it did not write."

[[command]]
name = "G.NDEL"
group = "graph"
since = "8.8.0"
arity = 3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The edges go first and the document second, at both ends and under every label, because a slot handed back while its properties were still there would be given out again with the old fields on it. Each run is copied before it is walked, since unlinking moves the last entry of a run into the hole it made and a walk over a live run would skip whatever moved. The key goes when the last node does."

[[command]]
name = "G.EADD"
group = "graph"
since = "8.8.0"
arity = -5
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A scan of the outgoing run for the pair, so an upsert is the degree under that label and not the whole graph. Either end that is not there is created as a node with no properties, which the typed surface refuses and the wire does not: there an id is a handle a caller can only have got from add, and here it is the client's own bytes and creating the node is well defined. Bulk edge ingest is most of what a graph does and two commands an edge would be the wrong trade."

[[command]]
name = "G.EDEL"
group = "graph"
since = "8.8.0"
arity = 5
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One edge and not every edge between the pair, because the plane allows parallel edges and the wire has no way to name one of them. The properties go before the slot is handed back, in that order, for the same reason G.NDEL uses. A pair with two edges under one label loses the older of them and the other is still readable with G.OUT."

[[command]]
name = "G.OUT"
group = "graph"
since = "8.8.0"
arity = -4
plan = "cursor"
bounded = "yes"
status = "shipped"
wire = "verified"
notes = "A probe and then a sequential read, which is 22 ns at degree 4 and 33 ns at degree 20 on a 13900K. The cursor is a position in the run rather than a snapshot, so an edit between two pages can skip an entry or repeat one, which is the guarantee SCAN gives and for the same reason: the alternative is holding a copy per client. A cursor of zero coming back is the end."

[[command]]
name = "G.IN"
group = "graph"
since = "8.8.0"
arity = -4
plan = "cursor"
bounded = "yes"
status = "shipped"
wire = "verified"
notes = "G.OUT down the other plane and the same code. The in run costs the same as the out run to read, which is the whole reason there are two planes rather than one plane and a scan, and it is why an incoming traversal is not the thing you avoid writing."

[[command]]
name = "G.DEG"
group = "graph"
since = "8.8.0"
arity = -4
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The length of a run, read off its header without touching the run itself. BOTH is the two lengths added, which counts a self loop twice because it is two entries in the plane, and saying otherwise would mean walking the run to find them."

[[command]]
name = "G.NEIGH"
group = "graph"
since = "8.8.0"
arity = -4
plan = "cursor"
bounded = "yes"
status = "shipped"
wire = "verified"
notes = "Every header in the frontier is asked for before any of them is read, which is 37 percent off a two hop walk on the bench. The frontier is deduplicated between hops and not at the end, because a frontier that keeps every path to a node grows as the product of the degrees, and the question is which nodes can be reached and not by how many routes. Depth is 2 when nobody says, since an unbounded depth on a social graph is the whole graph by hop four."

[[command]]
name = "G.PATH"
group = "graph"
since = "8.8.0"
arity = -4
plan = "cursor"
bounded = "yes"
status = "shipped"
wire = "verified"
notes = "A search from both ends at once, expanding whichever side is smaller. A one sided search over a graph of branching factor b touches b to the d and two half searches touch twice b to the d over 2, so at a branching factor of 30 and a distance of 6 that is 729 million against 54 thousand. Each side keeps who it came from, one integer per node touched, and the path is read back by walking the two parents from where they met rather than by carrying whole paths in the frontier. Every label at once, because a shortest path question asked of a graph with two kinds of edge means either one."


# ----------------------------------------------------------------------- json

[[command]]
name = "JSON.SET"
group = "json"
since = "1.0.0"
arity = -4
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
divergent = "D-34"
notes = "The text is parsed into the encoding before the key is touched, so a value that is not JSON changes nothing and costs one parse. A path that matched is a rebuild with the new value spliced in at every offset it matched, and everything the path did not name is a memcpy, so the cost follows the size of the document rather than the number of places written. A path that matched nothing can still be a write, but only if it names exactly one place and the container that would hold it is there, which is why a wildcard that matched nothing is an error rather than a fan out of new fields. The risk is the honest verdict: a JSON.SET on a ten megabyte document rewrites ten megabytes whatever the path was, and the fix for that is a document small enough to be one value or a collection instead of one key."

[[command]]
name = "JSON.MSET"
group = "json"
since = "2.6.0"
arity = -4
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
divergent = "D-34,D-37,D-40"
notes = "Three arguments a key and any number of keys, which is why the key spec is a step of three rather than a range. Every triple is worked out against the keyspace as the command found it and nothing is written until all of them are known to work, so a client that saw an error knows nothing happened. The one thing that is not an error is a path that names nowhere to put its value: that triple is skipped, the others are still written and the reply turns into a nil. That was read off a running module both ways round, with the failing triple first and last, because a naive loop and this agree on one order and not on the other. Two triples on one key do not see each other and the last one written is the one that stays."

[[command]]
name = "JSON.MERGE"
group = "json"
since = "2.6.0"
arity = -4
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
divergent = "D-34,D-37,D-40,D-41"
notes = "RFC 7386, which is a small rule with a lot of edges. A patch that is not an object replaces what it is merged onto, an object patch is applied member by member, and a null in the patch deletes the member of that name rather than storing a null. A patch object merged onto anything that is not an object starts from an empty object, so the nulls have nothing to delete and are dropped, which is how a patch onto a number comes out holding only the members that were not deletions. Where there is nothing at all the patch is stored as it stands, nulls and all, which is a key that is not there and a member the path is about to create. A wildcard merges every match, and a path that matched nothing follows the same rule JSON.SET follows."

[[command]]
name = "JSON.GET"
group = "json"
since = "1.0.0"
arity = -2
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
divergent = "D-34, D-43, D-44"
notes = "Several paths in one call, each matched against the same document, and the reply is one bulk string of JSON text whatever was asked for. A path may hold a filter, `$.book[?(@.price < 10)]`, and what its operators mean is written up in the query module: a comparison is true when any pair out of the two sides satisfies it, an ordering comparison only arises between two values of the same sort, an operand on its own asks whether the document has it, and `=~` is a regular expression in the flavour the register has as D-43. Past the comparisons a filter also has `in`, `nin`, `anyof`, `noneof`, `subsetof`, `size` and `empty`, the postfix methods `length`, `count`, `min`, `max`, `sum` and `avg`, arithmetic over numbers, and the postfix `~` for the key names of an object. The additions Redis 8.10 made to the language are here as well: `sizeof` as another spelling of `size`, a leading `-` or `+` on a number, and a path rather than a literal on the right of the collection operators, which is what makes `3 in @.list` and `\"x\" in @.o~` read. INDENT, NEWLINE and SPACE lay it out, and they lay out the wrapper the reply is built in as well as the values inside it, so what a JSONPath matched starts one level in and what one of several paths matched starts two. The default path is the legacy root and not the JSONPath root, which is the difference between the document coming back as itself and coming back inside an array, and it is the one thing here most likely to break a client that was written against a guess. A path may also be an expression over the document rather than a way through it, which is what Redis calls a projection: `$.a + $.b`, `$.list.length()` and `$.o~` are all arguments this command takes, and the reply is a JSON array of what the expression worked out rather than of what a path matched. Only this command, JSON.MGET and JSON.RESP take one and every other JSON command answers ERR computed/projection expressions are only supported by JSON.GET/JSON.MGET/JSON.RESP. A projection never raises the path does not exist that a legacy path would, so `$.nope + 1` is an empty array, and it answers an array even when it was written in the legacy syntax, so `.a + 1` is `[4]` rather than `4`. The first thing at the top level is a path however it is written, which is how `2 + 3` parses at all: it is a member really called 2, plus three, and it answers an empty array. Arithmetic and the methods want one node and answer nothing for two, which is the same rule they follow inside a filter, and `count()` is the one that is outside it. The kind of number that comes out follows the reference and not the arithmetic: whole through `+`, `-`, `*` and `%`, always a fraction out of `/` however evenly it divides, whole out of `length()` and `count()`, and a fraction out of `min()`, `max()`, `sum()` and `avg()`."

[[command]]
name = "JSON.MGET"
group = "json"
since = "1.0.0"
arity = -3
plan = "merge"
bounded = "risk"
status = "shipped"
wire = "verified"
divergent = "D-34,D-35,D-44"
notes = "One path against many keys, one entry per key in the order they were given. A key that is not there, a key holding something that is not a document and a key whose document the path did not match are all a nil rather than an error, which is what lets a client read a hundred keys and use the ninety that answered. The path may be a projection, the expression form JSON.GET takes, and it means the same thing here and is worked out once per key."

[[command]]
name = "JSON.DEL"
group = "json"
since = "1.0.0"
arity = -2
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
divergent = "D-34"
notes = "Removing the root removes the key, which is the keyspace's business and not the editor's, so it is handled before the document is read. A delete that empties the root container removes the key too, the same rule that makes EXISTS answer zero for a list somebody popped the last element off, and it is a rule about deleting rather than about shape, so a document written as an empty object by JSON.SET stays. Everything else is a rebuild without the matched values in it, and the reply is how many places were removed. Anything after the path is ignored rather than refused, which is RedisJSON's behaviour: it registers the command as taking one path and never looks at the rest."

[[command]]
name = "JSON.FORGET"
group = "json"
since = "1.0.0"
arity = -2
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
divergent = "D-34"
notes = "The same command as JSON.DEL under its other name, which exists because DEL was taken by the keyspace and the module wanted a name that could not be confused with it. Both are in the table because both are in COMMAND LIST and a client library picks whichever one its author preferred."

[[command]]
name = "JSON.TYPE"
group = "json"
since = "1.0.0"
arity = -2
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The one command here where a legacy path that matched nothing answers nil rather than an error, which lines up with a key that is not there answering nil too. The words are RedisJSON's and they split what the encoding also splits, an integer from a number, so no translation table is needed. The verdict is inherent because the answer is one word per match and a path answers at most as many matches as the document has values."

[[command]]
name = "JSON.TOGGLE"
group = "json"
since = "2.0.0"
arity = 3
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
divergent = "D-34"
notes = "Flips every boolean the path matched and answers the value each one now has, as an integer per match on a JSONPath and as the word true or false on a legacy path. A match that is not a boolean is a hole in the array on one syntax and the error Path does not exist or not a bool on the other, which is one sentence covering both the path that matched nothing and the path that matched the wrong thing, because a legacy path cannot tell a client which of the two happened."

[[command]]
name = "JSON.CLEAR"
group = "json"
since = "2.0.0"
arity = -2
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
divergent = "D-34"
notes = "Empties containers and zeroes numbers and leaves a string, a boolean and a null alone, which is RedisJSON's rule and not an obvious one since clearing a string to the empty string would be just as defensible. It counts only what it changed, so an object that was already empty and a number that was already zero are not counted and a second call on the same path answers zero."

[[command]]
name = "JSON.ARRLEN"
group = "json"
since = "1.0.0"
arity = -2
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-34"
notes = "The count is stored in the container's header, so this is a path walk and then a read of one field rather than a walk of the array. A legacy path that matched nothing is the error Path does not exist and one that matched something that is not an array is Path does not exist or not an array, which are two different lines for what a client sees as the same failure and are both RedisJSON's. A legacy path against a key that is not there is a nil and a JSONPath against the same key is an error, which is the opposite way round from the rest of this group."

[[command]]
name = "JSON.OBJLEN"
group = "json"
since = "1.0.0"
arity = -2
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-34"
notes = "The same read as JSON.ARRLEN over an object, and every one of its error lines is different. A legacy path that matched nothing is a nil rather than an error, a legacy path that matched something else is a WRONGTYPE rather than an ERR, and a JSONPath against a key that is not there is the line about the path rather than the line about the key. None of that is a pattern and all of it was read off a running module, because the error text is what a client library branches on."

[[command]]
name = "JSON.STRLEN"
group = "json"
since = "1.0.0"
arity = -2
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-34"
notes = "The length in bytes and not in characters, which matters the moment a document holds anything outside ASCII and is what RedisJSON answers because its strings are Rust strings underneath too. A legacy path that matched nothing is an error and one that matched something that is not a string is a WRONGTYPE, which is the third of the four combinations this family manages to use."

[[command]]
name = "JSON.OBJKEYS"
group = "json"
since = "1.0.0"
arity = -2
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-34"
notes = "The keys of every object the path matched, as an array per match. Ours come back sorted by length and then by bytes because that is the order the encoding stores them in to make a lookup a binary search, and RedisJSON keeps the order they were written in, which is D-34 and is the same divergence every reply that shows an object has."

[[command]]
name = "JSON.ARRAPPEND"
group = "json"
since = "1.0.0"
arity = -3
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
divergent = "D-34"
notes = "Adds to the end of every array the path matched and answers the new length of each. The arity in the table is the module's own, which allows a call with no values at all and then refuses it with a wrong number of arguments error from inside the command, so the table and the check disagree on purpose and both match what Redis does. The values are parsed before the key is touched, so a value that is not JSON changes nothing."

[[command]]
name = "JSON.ARRINSERT"
group = "json"
since = "1.0.0"
arity = -5
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
divergent = "D-34,D-36"
notes = "The one index in this group that is refused rather than clamped. An index the array does not reach is the error index out of bounds, where a pop past the end takes the last element and a trim past the end leaves an empty array. The end itself counts as a place, so an insert at the length is an append, and a negative index counts back from the end with minus the length meaning the front."

[[command]]
name = "JSON.ARRTRIM"
group = "json"
since = "1.0.0"
arity = 5
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
divergent = "D-34"
notes = "Keeps the run from start to stop, both ends included, and answers what is left. Both ends count back from the end when negative and both clamp rather than refuse, so a start past the end or a stop before the start leaves an empty array and not an error. It is one splice of the kept elements over the whole array rather than a splice at each end, because two edits at the same offset is a caller bug the editor resolves by taking the first."

[[command]]
name = "JSON.ARRPOP"
group = "json"
since = "1.0.0"
arity = -2
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
divergent = "D-34"
notes = "Takes one element out and answers it as JSON text. The default index is minus one, which is the last element, and an index past either end is clamped to one that is there. An empty array answers nil and is not an error, which is the only case where a legacy path that named a real array still answers nil."

[[command]]
name = "JSON.ARRINDEX"
group = "json"
since = "1.0.0"
arity = -4
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-34"
notes = "Where a value first sits in every array the path matched, or minus one. The stop is exclusive, which is not what the rest of Redis does with a stop, and zero means the end rather than the front so leaving it off and passing zero are the same thing. The comparison is structural rather than a comparison of the encoded bytes, because an object stored in a document can hold its keys as intern table ids where the one parsed off the wire holds them as bytes, and those two encode differently while meaning the same thing."

[[command]]
name = "JSON.NUMINCRBY"
group = "json"
since = "1.0.0"
arity = 4
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
divergent = "D-34,D-36,D-37,D-38,D-39"
notes = "Adds to every number the path matched and answers the new values as JSON text rather than as numbers, which is a bulk string on a legacy path and a bulk string holding a JSON array on a JSONPath. Two integers stay an integer and anything with a double in it is a double, so adding two to seven answers nine and adding two point zero answers nine point zero, and the document holds whichever one the reply said. An integer result that does not fit is refused rather than promoted to a double."

[[command]]
name = "JSON.NUMMULTBY"
group = "json"
since = "1.0.0"
arity = 4
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
divergent = "D-34,D-36,D-37,D-38,D-39"
notes = "The same command as JSON.NUMINCRBY with a different operator. Redis marked it deprecated in RedisJSON 2.0 and still registers it, so it is here for the clients that still send it."

[[command]]
name = "JSON.NUMPOWBY"
group = "json"
since = "1.0.0"
arity = 4
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
divergent = "D-34,D-36,D-37,D-38,D-39"
notes = "The same again, raising rather than multiplying. A negative exponent against an integer is the numeric overflow error even though nothing overflowed, because there is no integer answer to two to the minus one and the module reports it that way. A double exponent is done in doubles, so a power of nought point five is a square root, and the square root of a negative number is the error that says the result is not a number."

[[command]]
name = "JSON.STRAPPEND"
group = "json"
since = "1.0.0"
arity = -3
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
divergent = "D-34,D-36,D-37"
notes = "The path is optional and sits in the middle, which no other command in this group does, so three arguments means the value is the last one and the path is the root. The value is JSON and has to be a JSON string, so a client appends a quoted string and not bare text, and a value that is a number is a WRONGTYPE about a path value even though it was the value that was wrong. The answer is the new length in bytes and not in characters."

[[command]]
name = "JSON.RESP"
group = "json"
since = "1.0.0"
arity = -2
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
divergent = "D-34,D-40,D-44"
notes = "The document as RESP types rather than as JSON text, so a client can walk it without a JSON parser. An object is an array whose first element is the simple string open brace followed by key, value, key, value, and an array is one whose first element is the simple string open bracket, which is what tells an empty object and an empty array apart. A double goes out as a bulk string rather than as a RESP double, so the reply is the same on both protocols, and the digits in it are not the JSON writer's: Redis has one number to text routine outside JSON and this reply goes through that one, so a whole number a long long can hold comes back with no point on it and 1.0 is 1, the switch to exponent form is at 1e-7 below and follows the digit count rather than a fixed size above, and a positive exponent carries a plus so 1e19 is 1e+19. A projection is taken here the way JSON.GET takes one and answers a flat array, with a whole number as a RESP integer, a key name as a bulk string and a fraction as a bulk string of the same digits. The whole answer is built in one pass over the value and costs what the value is worth."

[[command]]
name = "JSON.DEBUG"
group = "json"
since = "1.0.0"
arity = -2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-40,D-42"
notes = "MEMORY and HELP, and the key sits after the subcommand, which is why the command carries movablekeys and a key spec that searches for the keyword. MEMORY answers how many bytes the value at a path takes, which here is the length of its encoded form and is a walk of the value rather than a count kept anywhere. The numbers are not RedisJSON's and cannot be, since the two servers do not store a document the same way. HELP answers the same two lines the module answers, spacing included."

# --------------------------------------------------------------------- vector

[[command]]
name = "VADD"
group = "vector"
since = "8.0.0"
arity = -5
plan = "point"
bounded = "yes"
status = "shipped"
wire = "verified"
divergent = "D-31,D-32"
notes = "The vector is parsed, checked and made a unit vector before the key is touched, so a VADD with a bad option or a vector full of zeros creates nothing rather than creating an empty set and then failing. The reply is 1 for an element that was not there and 0 for one whose vector was replaced, which is what lets an ingest count what it created without reading anything back. The first VADD fixes the dimension because there is no create command to fix it earlier, and every one after it that disagrees is an error naming both numbers. The length the vector arrived with is kept beside the element, since a cosine set stores the unit vector and VEMB is supposed to give back roughly what went in. Insertion probes the index the same way a search does, so the cost is the probe count times the dimension and not the size of the set."

[[command]]
name = "VSIM"
group = "vector"
since = "8.0.0"
arity = -4
plan = "point"
bounded = "yes"
status = "shipped"
wire = "verified"
divergent = "D-33"
notes = "A search from a vector or from an element already in the set, and the element form leaves that element out because it is always its own nearest neighbour and nobody asked. The score is a similarity and not a distance: the collection measures one minus the cosine, from 0 for the same direction to 2 for the opposite one, and the reply is 1 minus half of that, so an identical vector scores exactly 1 and an opposite one exactly 0. WITHSCORES replies as a map under RESP3, which is what the vector set module does and is not what ZRANGE does here, and the difference is deliberate: a client that already parses one of these should not have to tell the two servers apart. EF widens the search by raising how many candidates are ranked, which is the knob this index has for the thing EF names. TRUTH reads every vector and no codes at all, which is what recall is measured against and is the only reply here with no approximation in it. FILTER is an expression over the elements' attribute strings and it is decided inside the scan rather than over the answers, so the reply is the nearest COUNT elements that match and not whichever of the nearest COUNT happened to match. The expression is parsed before the key is read, so a bad one is an error whether or not the key is there. What the scan tests first is a 64 bit summary of the element's attributes that sits beside its code, and the expression itself only runs on what survives that and is near enough to rank. FILTER-EF raises the effort and cannot lower it, which is D-33, and TRUTH FILTER is the way to ask for every match rather than the nearest few."

[[command]]
name = "VREM"
group = "vector"
since = "8.0.0"
arity = 3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The element's id is read before the removal and not after, because afterwards the slot it named is free and the next VADD is given it, and the attribute string sitting in that slot would come back under a name that never wrote it. The vector's slot goes back to the free list and its code stays in the posting until maintenance walks past it, which is the same deferred cost every partition index pays and is why a set that is written and deleted in a loop does not grow. The key goes when the last element does, the way every other collection here works."

[[command]]
name = "VCARD"
group = "vector"
since = "8.0.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A counter on the key table. Zero for a key that is not there rather than an error, since a vector set with nothing in it does not exist and a client counting one is asking a question that has an answer."

[[command]]
name = "VDIM"
group = "vector"
since = "8.0.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One field off the collection. A key that is not there is an error and not zero, because zero is a number a client could pass to VADD and get a different error out of, and there is no dimension to report before the first vector arrives."

[[command]]
name = "VEMB"
group = "vector"
since = "8.0.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The unit vector multiplied back by the length it arrived with, so a vector sent as 3 and 4 comes back as 3 and 4 and not as 0.6 and 0.8. It is roughly and not exactly, because the normalisation and the multiplication are both float32 and neither is reversible, which is the same thing Redis says about its own answer. RAW gives the stored form instead: the string f32, the unit vector as little endian float32, and the length as the number that turns one into the other. There is no quantisation range in that reply because the bytes are not quantised, which is one field fewer than a real vector set sends and is the honest count for what is stored."

[[command]]
name = "VINFO"
group = "vector"
since = "8.0.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-32"
notes = "index-type is the first field and says partition, because everything under it is describing an index that is not a graph and a client reading hnsw-m without reading that would draw the wrong conclusion from it. hnsw-m, ef-construction and ef-runtime are what the client asked for rather than what happened, which is 10 section 7: two of the three moved the tuning and M did not, and reporting the tuning under a name that says M would be answering a different question. partitions, probe, rerank and code-bytes are the index that actually ran, and they are the four numbers worth having when a search is slower or less accurate than expected. attributes-count walks the elements, which is the one field here that is not O(1)."

[[command]]
name = "VISMEMBER"
group = "vector"
since = "8.0.0"
arity = 3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One lookup in the key table, which is the same open addressed table every other keyed shape in this build uses, so this costs what SISMEMBER costs and reads no vector at all."

[[command]]
name = "VRANDMEMBER"
group = "vector"
since = "8.0.0"
arity = -2
plan = "cursor"
bounded = "yes"
status = "shipped"
wire = "verified"
notes = "The two shapes SRANDMEMBER has, for the same reasons: a negative count draws that many with repeats allowed and a positive one draws distinct elements and stops at the size of the set. The distinct form shuffles the positions and takes the front rather than drawing and rejecting, because rejection gets slower the closer the count gets to the size and is unbounded at the end of it. The draws come off the database's own generator through Keyspace::random rather than off one held in the set, so a run under Keyspace::seed repeats exactly the way a run of SRANDMEMBER does."

[[command]]
name = "VLINKS"
group = "vector"
since = "8.0.0"
arity = -3
plan = "point"
bounded = "yes"
status = "shipped"
wire = "verified"
divergent = "D-2"
notes = "There is no HNSW graph here, so there are no layer by layer links to report, and the question the command is asking still has an answer: which elements this one is stored next to. That is its own partition, nearest first, which is what a client drawing a neighbourhood out of this actually wants. The reply is one layer deep because the index is one layer deep, so a client walking layers gets a short list rather than a shape it cannot parse. D-2 has said this would be the answer since the register was written."

[[command]]
name = "VSETATTR"
group = "vector"
since = "8.0.0"
arity = 4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The attribute is stored as the bytes the client sent and is not validated as JSON, because a string that is not JSON is a string whose every field is missing, which is an element that matches no filter, and that is the same answer refusing the write would give without refusing anybody's write. Setting it also rewrites the summary of the attributes that sits beside the element's code in the index, which is what makes VSETATTR move an element in and out of a filter rather than only changing what VGETATTR says. An empty string clears the attribute, which is Redis's spelling of the removal and is why this is one command and not two. It answers 0 for an element that is not there rather than creating one, since an attribute with no vector under it is not a thing a vector set can hold."

[[command]]
name = "VGETATTR"
group = "vector"
since = "8.0.0"
arity = 3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A null for an element with no attribute and a null for an element that is not there, which is the same reply for two different facts and is what a real vector set answers. VISMEMBER is how a client tells them apart, and adding a third reply here to save that round trip would be a divergence bought for nothing."


# ----------------------------------------------------------------------- bloom

[[command]]
name = "BF.RESERVE"
group = "bloom"
since = "1.0.0"
arity = -4
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "The filter is sized on the way in and the whole thing is allocated then, so a reserve at the top of the capacity range costs a gibibyte of bits before a single item has been added. That is the risk on the row and it is the module's design rather than this implementation: a client that asks for a billion entries at a tenth of a percent gets what it asked for. Every argument is parsed and range checked before the key is looked at, which is visible on the wire because a reserve against a key holding a string with a bad error rate complains about the error rate. Trailing arguments after the capacity are ignored rather than refused, which is also the module's, and NONSCALING together with EXPANSION is an error in either order."

[[command]]
name = "BF.ADD"
group = "bloom"
since = "1.0.0"
arity = 3
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Two hashes and then one bit per hash function, so the cost does not depend on how many items are in the filter, but the bits are spread over the whole of it and there is no part of the value that can be left behind. The key is made at the configured defaults if it is not there, which is bf-error-rate and bf-initial-size and bf-expansion-factor and not anything this command can be told. A membership check runs before the full check, so re-adding an item that is already in a filter that cannot grow answers 0 rather than an error."

[[command]]
name = "BF.MADD"
group = "bloom"
since = "1.0.0"
arity = -3
plan = "whole-value"
bounded = "yes"
status = "shipped"
wire = "verified"
notes = "One answer per item, until one of them does not fit. A filter that cannot grow and fills part way through answers with the items it managed and the error as the last element, so the array is shorter than the argument list and a client that zips the reply against what it sent gets it wrong. That is the module's shape and copying it is the point."

[[command]]
name = "BF.INSERT"
group = "bloom"
since = "1.0.0"
arity = -4
plan = "whole-value"
bounded = "yes"
status = "shipped"
wire = "verified"
notes = "BF.RESERVE and BF.MADD in one command, with its own error sentences for the same mistakes: a bad capacity is Bad capacity here and ERR bad capacity there, and there is one sentence for a bad expansion where BF.RESERVE has two. NOCREATE turns a missing key into an error instead of a filter. Everything after the ITEMS keyword is an item even if it spells an option, and ITEMS with nothing after it is the same wrong arity as leaving it out."

[[command]]
name = "BF.EXISTS"
group = "bloom"
since = "1.0.0"
arity = 3
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A key holding something else answers 0 rather than WRONGTYPE, which is the module's behaviour and is the one place in the family where a wrong type is not an error. BF.ADD on the same key does answer WRONGTYPE, so the two halves of a check and set disagree about what that key is. Copied rather than fixed, because a client that branches on the reply would otherwise start seeing an error where it used to see a miss."

[[command]]
name = "BF.MEXISTS"
group = "bloom"
since = "1.0.0"
arity = -3
plan = "whole-value"
bounded = "yes"
status = "shipped"
wire = "verified"
notes = "The same tolerance as BF.EXISTS, one element per item, and no way for the reply to be shorter than the argument list because nothing here can fill."

[[command]]
name = "BF.SCANDUMP"
group = "bloom"
since = "1.0.0"
arity = 3
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "Iterator zero asks for the header and comes back with one. After that the iterator is one past the last byte handed over, counted across every link laid end to end, and zero with an empty string means there is nothing left. A chunk never spans two links, so a chain of n links takes n plus two calls, and a chunk is a whole link however big that link is. A single link filter of a million entries answers in one reply of 1.3 megabytes, which is the risk on the row: the module has no chunk cap and adding one here would change the iterator sequence a client is replaying."

[[command]]
name = "BF.LOADCHUNK"
group = "bloom"
since = "1.0.0"
arity = 4
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Iterator one carries the header and makes the filter with every bit clear, and the key has to be free for it. Loading a header onto a filter that is already there is refused rather than merged, because the two chains would have different shapes and every chunk after the header is an offset into one of them. A header that no filter wrote, a chunk whose offset is past the end and a chunk that starts inside a link and runs off it each have their own sentence."

[[command]]
name = "BF.INFO"
group = "bloom"
since = "1.0.0"
arity = -2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Five numbers that are all derived from the chain rather than recorded beside it, so a filter that arrived through BF.LOADCHUNK answers the same as one that was built here. Capacity is the sum of every link's entries and not the capacity that was asked for, and Size is the module's own accounting of 32 bytes for the chain and 64 for each link and then the bits, which is not what the filter costs in this process. One field asked for by name is a map of one on RESP3 and a bare one element array on RESP2, so a RESP2 client gets the number without being told which field it is."

[[command]]
name = "BF.CARD"
group = "bloom"
since = "2.4.4"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "How many items went in and not how many bits are set, so it is exact where everything else about a filter is not. Zero for a key that is not there, where BF.INFO answers an error for the same key."

[[command]]
name = "BF.DEBUG"
group = "bloom"
since = "1.0.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Undocumented and in the ACL category all the same, so a client listing the group finds eleven commands and not ten. The reply is the chain size and then a line for each link with the numbers a client would otherwise have to take a BF.SCANDUMP apart to see. The ratio field is C's %g of the link's error rate, six significant digits with an exponent below a ten thousandth, which is why it says 5e-11 where Rust would say 0.00000000005."


# ---------------------------------------------------------------------- cuckoo

[[command]]
name = "CF.RESERVE"
group = "cuckoo"
since = "1.0.0"
arity = -3
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "The whole filter is allocated on the way in, so a reserve at the top of the capacity range costs a gibibyte of fingerprints before a single item has been added, which is the risk on the row and is the module's design rather than this implementation. Everything after the capacity is read as name and value pairs, an odd number of them is an arity error, and a pair whose name is none of the three is ignored. The first pair with a given name wins and a second with the same name is not even parsed, so a bucket size of one followed by a bucket size of zero is accepted."

[[command]]
name = "CF.ADD"
group = "cuckoo"
since = "1.0.0"
arity = 3
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One hash and then a look at two buckets, so the cost does not depend on how many items are in the filter until the buckets are full, at which point the insert kicks fingerprints around the newest filter up to max iterations times. The key is made at the configured defaults if it is not there, which is cf-initial-size and cf-bucket-size and the rest, and not anything this command can be told. Adding an item that is already there puts a second copy in and CF.COUNT then says two, which is the thing a cuckoo filter can do and a Bloom filter cannot."

[[command]]
name = "CF.ADDNX"
group = "cuckoo"
since = "1.0.0"
arity = 3
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The same as CF.ADD with a membership check in front of it, so an item the filter already has answers 0 and nothing moves. That check is only as good as the fingerprint, so an item that collides with one already in the same bucket answers 0 without ever having been added, which is the false positive rate showing through on the write side."

[[command]]
name = "CF.INSERT"
group = "cuckoo"
since = "1.0.0"
arity = -4
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One answer per item and the array is never short, which is where this differs from BF.MADD: a filter that fills up part way through answers minus one for every item after that rather than stopping and writing an error into the middle of the array. On RESP3 that minus one is false, so a RESP3 client cannot tell a refusal from anything else, which is the module's shape. Options are matched on the first letter, so NOSUCH means NOCREATE and ITEMSXYZ means ITEMS, and every occurrence of CAPACITY is range checked even though the last one is the one used."

[[command]]
name = "CF.INSERTNX"
group = "cuckoo"
since = "1.0.0"
arity = -4
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The same command with the membership check CF.ADDNX has, and it answers integers on both protocols rather than booleans on RESP3, because it has three outcomes and minus one has to survive. That makes it the one command in the family where a RESP3 client can tell a refusal from an item that was already there."

[[command]]
name = "CF.EXISTS"
group = "cuckoo"
since = "1.0.0"
arity = 3
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Two buckets in each filter of the chain, newest first, so a chain that has grown thirty two times costs thirty two pairs of lookups for a miss. A key holding something else answers a miss rather than WRONGTYPE, which the three reads and CF.DEL all do and none of the writes does, so the two halves of a check and set disagree about what that key is."

[[command]]
name = "CF.MEXISTS"
group = "cuckoo"
since = "1.0.0"
arity = -3
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One CF.EXISTS per item over one key lookup, with the same tolerance for a key holding something else. The array is always as long as the item list."

[[command]]
name = "CF.COUNT"
group = "cuckoo"
since = "1.0.0"
arity = 3
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "How many slots in the item's two buckets hold its fingerprint, added up over the chain. An item whose two buckets are the same bucket is counted twice, because the module compares the two whole hashes rather than the two bucket numbers and those are never equal, so a filter with one copy of such an item answers 2. That is copied rather than fixed, because a client comparing counts between two servers would otherwise see them disagree."

[[command]]
name = "CF.DEL"
group = "cuckoo"
since = "1.0.0"
arity = 3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Clearing one slot, which is the whole reason to prefer a cuckoo filter over a Bloom filter. Deleting an item that was never added can clear a slot belonging to another item that shares its fingerprint and bucket, which turns a false positive into a false negative, and that is the trade the structure makes rather than a bug. Once more than a tenth of the filter has been deleted the delete compacts the chain, so an ordinary delete is sometimes a walk over the newest filter."

[[command]]
name = "CF.SCANDUMP"
group = "cuckoo"
since = "1.0.0"
arity = 3
plan = "cursor"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Position zero carries the header and after that the position is one past the last byte handed over, counted across every filter's fingerprints laid end to end, and a chunk never spans two filters. A filter with nothing in it answers zero and a nil rather than a header, so a client that dumps an empty filter has nothing to load back. A negative position is refused here and taken as an offset by CF.LOADCHUNK, which is an asymmetry in the module and is copied."

[[command]]
name = "CF.LOADCHUNK"
group = "cuckoo"
since = "1.0.0"
arity = 4
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Position one carries the header and makes the filter with every slot clear, and the key has to be free for it. A header that is not thirty eight bytes and a header that is thirty eight bytes and describes a filter nobody could build have different sentences, because the module checks the size and then tries to allocate. The filter count in the header is eight bytes on the wire and two in the struct, so a count of 100000 loads a chain of 34464 filters and a count of 65536 loads nothing at all."

[[command]]
name = "CF.INFO"
group = "cuckoo"
since = "1.0.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Eight numbers, all derived from the chain rather than recorded beside it, and no field argument: asking for one is an arity error where BF.INFO would have answered it. The bucket count is the first filter's however far the chain has grown, so a client working out how much room is left from it will be wrong, and Size is the module's own accounting of its structs and its fingerprints rather than what the filter costs in this process."

[[command]]
name = "CF.DEBUG"
group = "cuckoo"
since = "1.0.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Undocumented and in the ACL category all the same, so a client listing the group finds fourteen commands and not thirteen. One line of the numbers CF.INFO reports and the two it does not, which are how many filters the chain really has and how wide the newest one is."

[[command]]
name = "CF.COMPACT"
group = "cuckoo"
since = "1.0.0"
arity = -1
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Pulls the fingerprints in the newer filters down into the older ones and drops the filters that empty, which is possible at all because every filter's bucket count is a power of two and an item's bucket in a smaller filter is its bucket in a bigger one taken modulo the smaller count. The module has it down as a readonly command in the @read category even though it writes, and the arity says one argument where the command wants two, and both are copied so that COMMAND INFO answers the same on either server."


# ------------------------------------------------------------------------- cms

[[command]]
name = "CMS.INITBYDIM"
group = "cms"
since = "2.0.0"
arity = 4
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
divergent = "D-47"
notes = "Width times depth counters of four bytes each, all of them allocated here before a single item has been counted, which is the risk on the row. A real server has no cap at all and answers OK to a width of thirty five trillion because calloc hands back address space nobody has touched yet, and ours refuses anything past a gibibyte of counters with the module's own out of memory sentence, which is D-47. The key is looked at before the arguments are, so a width of zero at a key that is already there is key already exists and not invalid width."

[[command]]
name = "CMS.INITBYPROB"
group = "cms"
since = "2.0.0"
arity = 4
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
divergent = "D-47"
notes = "The same sketch from the other end, an error rate and a probability instead of a width and a depth. Width is two over the error rounded up in a double and depth is the log of the probability over the log of a half rounded up in a float, and the two different sizes are the module's and are visible: a probability of 1e-45 gives a depth of 149 where a double would have given 150. A probability whose float conversion is zero or one is invalid init arguments rather than a depth, and so is a width that does not fit in a signed sixty four bit integer."

[[command]]
name = "CMS.INCRBY"
group = "cms"
since = "2.0.0"
arity = -4
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Item and increment pairs, every one of them parsed before any of them is applied, so a bad number in the last pair leaves the sketch untouched. Each row's counter saturates at four billion and the reply for an item is the smallest of its rows, which means an item that has saturated answers with the overflow error in its own slot while the items beside it answer with numbers. The count the sketch reports is the sum of what was asked for rather than of what landed, and it is a signed integer that wraps, so a long enough run of increments takes it negative on a real server and here."

[[command]]
name = "CMS.QUERY"
group = "cms"
since = "2.0.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One reply an item, each the smallest counter across the rows, which is the estimate that can be too high and never too low. Depth reads of one counter each and no allocation, and a missing key is an error rather than a row of zeros. The read carries the module flag but not the fast one, unlike BF.EXISTS and CF.EXISTS, and that is copied so COMMAND INFO answers the same on either server."

[[command]]
name = "CMS.MERGE"
group = "cms"
since = "2.0.0"
arity = -4
plan = "merge"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The destination is overwritten and not added to, and every source has to have the destination's width and depth, which is why the layout is worth copying byte for byte. The whole sum is worked out into a buffer first and the destination is only written if none of the cells overflowed, so a refused merge leaves it exactly as it was. A cell times a weight is checked as a wide integer rather than a wrapped one, because four times two to the sixty second overflows on a real server too, and a negative weight is fine against a zero cell and a refusal against anything else."

[[command]]
name = "CMS.INFO"
group = "cms"
since = "2.0.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Three fields, and they are three separate keys and not a nested one, so the reply is six elements on RESP2 and a map of three on RESP3. No field argument: asking for one is an arity error. The count is the running total the increments added up to and it is signed, so a sketch that has been fed enough reports a negative one."


# ------------------------------------------------------------------------ topk

[[command]]
name = "TOPK.RESERVE"
group = "topk"
since = "2.0.0"
arity = -3
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
divergent = "D-47"
notes = "Three arguments or six and nothing in between, so a reserve with a width and a depth but no decay is a wrong arity rather than a defaulted decay. The defaults are a width of eight and a depth of seven, which is fifty six buckets and is small enough that anything past a handful of distinct items collides, and the risk on the row is that the whole table is allocated here before a single item has been counted. The key is looked at before the arguments are, so a k of zero at a key that is already there is key already exists and not invalid k. A sketch past a gibibyte is refused with the module's own out of memory sentence, which is the D-47 cap the count min sketch is on, and that sentence is the one error in the family that carries an ERR prefix because the module wrote the prefix into the string."

[[command]]
name = "TOPK.ADD"
group = "topk"
since = "2.0.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-49"
notes = "One occurrence of each item, and one reply an item: a null when the kept set did not change and the name of the item that lost its place when it did. Depth buckets are touched and a bucket held by something else only gives way at random, which is what stops a run of rare items from pushing a common one out, and the draw behind that is deterministic here and random on the reference, which is D-49. An item whose bytes contain a NUL comes back whole here and truncated there, which is D-51."

[[command]]
name = "TOPK.INCRBY"
group = "topk"
since = "2.0.0"
arity = -4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-51"
notes = "Item and increment pairs, read and applied one at a time, so a bad increment in the middle leaves every pair before it counted. That is the opposite of CMS.INCRBY, which parses the whole command before it applies any of it, and the difference is the module's rather than ours. An increment is a whole number from zero to a hundred thousand and zero is legal, which puts an item in the kept set with a count of nothing, where TOPK.QUERY answers one and TOPK.LIST does not show it. The reference writes an array header counting every pair and then stops at the bad one, which leaves the connection reading the next reply as the rest of this one, and this counts what it actually wrote, which is D-51."

[[command]]
name = "TOPK.QUERY"
group = "topk"
since = "2.0.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Whether each item is one of the ones being kept, which is a walk of the k slots and not a look at the buckets, so an item the sketch has counted plenty of times answers no if something heavier took its slot. A bool an item on RESP3 and an integer an item on RESP2, and a missing key is an error rather than a row of zeros."

[[command]]
name = "TOPK.COUNT"
group = "topk"
since = "2.0.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The largest count across the rows whose fingerprint matches, which is the other way round from a count min sketch and is right for this structure: a bucket shared with a heavier item has been decayed rather than added to, so the small readings are the wrong ones. A bucket reading below the smallest kept count is left out for an item the heap is keeping. The module's own documentation calls this reply approximate and warns it can be well under the truth, which it can, and an integer an item on both protocols."

[[command]]
name = "TOPK.LIST"
group = "topk"
since = "2.0.0"
arity = -2
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The kept items heaviest first, with counts beside them if WITHCOUNT is there. The keyword is compared against as many characters as the client sent, so every prefix of it turns the counts on including the empty string, and only a longer word or a different one is refused, which is a strncasecmp with the wrong length in the module and is copied because it is observable. The keyword is checked before the key exists, so a list of a missing key with a bad keyword complains about the keyword. Items with equal counts come out in the order the heap holds them rather than the order they arrived, and that order is a fact about the sift the module wrote, so the sift is copied quirk for quirk."

[[command]]
name = "TOPK.INFO"
group = "topk"
since = "2.0.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Four fields, so eight elements on RESP2 and a map of four on RESP3. The decay goes out through the double reply, which is a comma line on RESP3 and a bulk string of the shortest digits that read back as the same double on RESP2, so a decay of one is 1 and a decay of a billionth is 1e-9. No field argument: asking for one is an arity error."


# --------------------------------------------------------------------- tdigest

[[command]]
name = "TDIGEST.CREATE"
group = "tdigest"
since = "2.4.0"
arity = -2
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
divergent = "D-52"
notes = "Two arguments or four and nothing in between, so a stray word is an arity error rather than a syntax one. The keyword search looks for COMPRESSION across both trailing arguments and then reads the number out of the last one whatever it found, which is the module's RMUtil_ArgIndex and not a lookup, so TDIGEST.CREATE k 100 COMPRESSION tries to read a number out of the word COMPRESSION and says it cannot. The key is checked before the arguments, so a bad compression at a key that already holds a digest is key already exists. Capacity is six times the compression plus ten and every centroid is a mean and a weight, so the arrays are sized here before a sample has arrived, which is the risk on the row. A real server asks the allocator for them and ours refuses anything over a gibibyte, which is D-52."

[[command]]
name = "TDIGEST.RESET"
group = "tdigest"
since = "2.4.0"
arity = 2
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Empties the digest and keeps its compression and its arrays, so the key stays and TDIGEST.INFO answers with the same capacity afterwards. The compression count goes back to zero along with everything else, and min and max go back to the largest and smallest doubles there are, which is what makes an empty digest answer NaN to TDIGEST.MIN rather than a number left over from before."

[[command]]
name = "TDIGEST.ADD"
group = "tdigest"
since = "2.4.0"
arity = -3
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Every sample weighs one and every sample is parsed before any of them is added, so a bad number in the last position leaves the digest untouched. The double parser is Redis's string2d and not this engine's, which matters at the edges: 1e400 is a parse error where our own parser would have called it an infinity, 1e-400 is a parse error where ours would have called it zero, and the word inf in any case with any sign is a number that then fails the finite check with a different sentence. Adding into a full buffer sweeps it first, so the cost of a single add is amortised over the compression and one add in about every six hundred does the work."

[[command]]
name = "TDIGEST.MERGE"
group = "tdigest"
since = "2.4.0"
arity = -4
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "The keys are behind a count rather than at fixed positions, so this is the only command in the table carrying movablekeys, and the key specs COMMAND INFO would need to describe that are D-46 along with every other one. The destination is built to one side and put in place at the end, so a merge that runs out of weight leaves the old destination alone. Without OVERRIDE the destination joins its own inputs, which means naming the destination as a source as well folds it in twice and the weights afterwards say so. Compression comes from the destination when it exists, from the largest of the inputs when it does not or when OVERRIDE was asked for, and from COMPRESSION when that is there. Reading a source sweeps its buffer in, so a merge writes to keys it only reads from and their compression counts go up, which is the module's behaviour and is visible in TDIGEST.INFO."

[[command]]
name = "TDIGEST.MIN"
group = "tdigest"
since = "2.4.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The smallest sample ever added, kept as a field rather than found, so this does not touch the centroids at all. An empty digest answers NaN, which goes out as the bare word nan on RESP3 and as the three character bulk string nan on RESP2. A digest that has been reset is empty again for this purpose."

[[command]]
name = "TDIGEST.MAX"
group = "tdigest"
since = "2.4.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The largest sample ever added, the same field lookup as TDIGEST.MIN and the same NaN on an empty digest."

[[command]]
name = "TDIGEST.QUANTILE"
group = "tdigest"
since = "2.4.0"
arity = -3
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The walk over the centroids carries its position from one quantile to the next while they do not decrease, so the list is split into maximal non decreasing runs and each run costs one pass. That is not an optimisation on top of the module, it is the module, and it is visible: asking for 0.5 then 0.1 then 0.9 of the samples one, two, three, four gives three, one and four, where asking for them in order gives three, one and four as well but by a different route. A client that sends its quantiles sorted pays for one pass over the whole list."

[[command]]
name = "TDIGEST.CDF"
group = "tdigest"
since = "2.4.0"
arity = -3
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The fraction of the samples at or below each value, one pass over the centroids for each of them with no run splitting, since the cdf walk has nothing to carry. A value under the smallest sample is zero and one over the largest is one, and an empty digest answers NaN to everything. The doubles go out through the double reply, so RESP3 gets comma lines and RESP2 gets bulk strings of the shortest digits that read back as the same double."

[[command]]
name = "TDIGEST.TRIMMED_MEAN"
group = "tdigest"
since = "2.4.0"
arity = 4
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The mean of what is left once both tails are cut, with the two cuts named as fractions rather than as values. The two arguments have separate parse errors and a shared range error, and the cuts have to be strictly in order, so a low equal to a high is refused rather than answering NaN. The centroid the cut lands inside is counted for the part of its weight that is on the right side of the line, which is what makes this smoother than picking whole centroids. This is the one read in the family the module does not mark fast."

[[command]]
name = "TDIGEST.RANK"
group = "tdigest"
since = "2.4.0"
arity = -3
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "How many samples each value is above, which is the cdf read back as a count and rounded. The rounding is the module's own half round down written out of modf, because C rounds a half away from zero and there is no library call for the other direction, and the reverse command rounds the ordinary way instead, so the two are not mirror images and a value in the middle of a tie can be one apart between them. Below the smallest sample the answer is minus one, above the largest it is the number of samples, and an empty digest answers minus two to everything."

[[command]]
name = "TDIGEST.REVRANK"
group = "tdigest"
since = "2.4.0"
arity = -3
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "How many samples each value is below. The two ends swap over from TDIGEST.RANK, so below the smallest sample is the number of samples and above the largest is minus one, and an empty digest is still minus two. The arithmetic is the size less the rounded product, rounded again, which is where it parts company with the forward direction."

[[command]]
name = "TDIGEST.BYRANK"
group = "tdigest"
since = "2.4.0"
arity = -3
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The other direction, a rank in and a value out. Ranks are whole numbers and a negative one is refused with its own sentence rather than treated as an end. Rank zero is the smallest sample exactly and a rank at or past the number of samples is positive infinity, which goes out as the bare word inf on RESP3, and every rank on an empty digest is NaN. Everything in between asks the digest for the quantile at the rank over the size."

[[command]]
name = "TDIGEST.BYREVRANK"
group = "tdigest"
since = "2.4.0"
arity = -3
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The same counting down from the largest, so rank zero is the largest sample and a rank past the end is negative infinity. The quantile it asks for is the size less the rank less one, all over the size, which is not one minus the forward quantile and does not round to it either."

[[command]]
name = "TDIGEST.INFO"
group = "tdigest"
since = "2.4.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Nine fields, so eighteen elements on RESP2 and a map of nine on RESP3: compression, capacity, merged nodes, unmerged nodes, merged weight, unmerged weight, observations, total compressions and memory usage. Memory usage is the reference's formula rather than what the digest costs here, eighty bytes for the header and sixteen for every slot in the capacity, because it is a number a client compares between servers. The two are within a few bytes of each other anyway. The command carries the dont_cache tip on a real server and there is nowhere in Spec to put a tip yet, which is the same gap as CMS.INFO and CF.INFO."


# ------------------------------------------------------------------------- ts

[[command]]
name = "TS.CREATE"
group = "ts"
since = "1.0.0"
arity = -2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "An empty series with one chunk in it, so that TS.INFO answers a chunk count of one before anything has been written. The options are looked for one keyword at a time across the whole command rather than read in order, which is what the module does, so a word that is not an option is ignored, the key itself can match a keyword, and LABELS eats everything after it in pairs while the later scans still find keywords inside what it ate. All of that is visible from a client and all of it is copied. The arguments are read before the key is looked at, so a bad retention against a key that already exists answers about the retention rather than about the key."

[[command]]
name = "TS.ALTER"
group = "ts"
since = "1.0.0"
arity = -2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The same scan, applied to a series that is already there, and only the keywords that appear change anything. ENCODING is read so that a bad value is still an error and then thrown away, because a series holding samples cannot be told to store them a different way. A retention set here trims what is already stored on the spot rather than waiting for the next sample."

[[command]]
name = "TS.ADD"
group = "ts"
since = "1.0.0"
arity = -4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The value and the timestamp are read first and the key second, so a bad value against a key holding a string answers about the value. A star timestamp is whatever the server clock says. The series is made if it is not there, with the same options TS.CREATE takes, and ON_DUPLICATE is only read when the key was already there, which is why a policy word that is not a policy is an error on the second call and not on the first. A sample landing at or behind the newest one is an upsert under the duplicate policy, one landing past it is an append, and one so far behind that retention has already gone past it is refused."

[[command]]
name = "TS.MADD"
group = "ts"
since = "1.0.0"
arity = -4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Each triple gets its own slot in the reply and a bad one does not stop the ones after it, so this is the only command in the family whose reply can hold both timestamps and errors. It reads no options and creates nothing, so a key that is not already a series is the key is not a TSDB key in its slot. A star timestamp is resolved once for the whole command rather than once per triple."

[[command]]
name = "TS.INCRBY"
group = "ts"
since = "1.0.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The newest value plus the number given, stored under the last policy whatever the series says, so two of these on one timestamp add up rather than collide. A key holding something else is WRONGTYPE here where TS.ADD gives a sentence, and it is answered before the number is looked at. The increment goes through the ordinary number reader rather than the one a sample value uses, so it takes inf and a leading plus and a bare fraction and refuses nan, which is the module's own split and not a decision made here. A timestamp behind the newest sample is refused with one of the two errors the module writes with no ERR in front of it."

[[command]]
name = "TS.DECRBY"
group = "ts"
since = "1.0.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The same command with the sign flipped, down to the errors and to which of the two number readers the argument goes through."

[[command]]
name = "TS.DEL"
group = "ts"
since = "1.6.0"
arity = 4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Both ends are included and both take the one character standing for as far as that end goes. The count that comes back is how many samples went, so a span that covers nothing answers zero and so does a span whose ends are the wrong way round. A chunk the span covers entirely is dropped whole and one it covers partly is rewritten, and a series that ends up with nothing in it keeps its last chunk so the chunk count stays one."

[[command]]
name = "TS.GET"
group = "ts"
since = "1.0.0"
arity = -2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The newest sample, or an empty array when the series has none. The value goes out as a simple string of the shortest digits that read back as the same number on RESP2 and as a double on RESP3, which are two renderings of one number. The command carries the dont_cache tip on a real server and there is nowhere in Spec to put a tip yet, which is the same gap as CMS.INFO and TDIGEST.INFO."

[[command]]
name = "TS.INFO"
group = "ts"
since = "1.0.0"
arity = -2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-53"
notes = "Fourteen fields, so twenty eight elements on RESP2 and a map of fourteen on RESP3. The chunk type and the duplicate policy are simple strings and never a nil, so a series that was never told what to do about a repeated timestamp reports block. The source key and the rules wait on compaction rules and are a nil and an empty map until those land. Memory usage is ours and not the reference's, which is D-53. The value half of the ignore window goes out as a bulk string on RESP2 where a sample value in TS.GET is a simple one, which is the module's inconsistency and is copied."

[[command]]
name = "TS.RANGE"
group = "ts"
since = "1.0.0"
arity = -4
plan = "cursor"
bounded = "yes"
status = "shipped"
wire = "verified"
divergent = "D-54"
notes = "The samples in a span, and the fifteen reductions over buckets cut out of it. The key is resolved before an option word is read, so a key that is not there says so whatever else is wrong. LATEST is read and has nothing to do until compaction rules land. EMPTY only fills the gaps between readings and never the run before the first reading in the series or after the last one, which is what keeps a one millisecond bucket over an open span from asking for an unbounded number of rows. A read that would still build more than eight million rows is refused rather than attempted, which is D-54."

[[command]]
name = "TS.REVRANGE"
group = "ts"
since = "1.4.0"
arity = -4
plan = "cursor"
bounded = "yes"
status = "shipped"
wire = "verified"
divergent = "D-54"
notes = "The same read with the rows turned around. Every reduction is order independent, first and last included, so the buckets are worked out oldest first and reversed afterwards, and COUNT then takes from the newest end. The one thing that is not a mirror is which rows survive a COUNT, and that falls out of doing the reversal before the limit rather than after it."

[[command]]
name = "TS.QUERYINDEX"
group = "ts"
since = "1.0.0"
arity = -2
plan = "metadata"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "The key names a filter list takes, sorted. Six predicate forms, and a list made only of the ones that say which series to leave out is refused because it would otherwise mean the whole keyspace. This walks the keys holding a foreign body rather than reading an index beside the keyspace, which is why it is bounded by risk: an index is a second table that DEL, EXPIRE, RENAME, COPY, RESTORE, FLUSHDB and eviction would all have to keep in step, and the walk cannot drift because there is nothing to drift from."

[[command]]
name = "TS.QUERYLABELS"
group = "ts"
since = "8.10.0"
arity = -2
plan = "metadata"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "The label names in use across the series a filter takes, or the values one named label takes across them. The only command in the family where a filter is optional, and leaving it out means every series rather than none, so the rule about naming at least one thing to take does not apply until a FILTER is written down."

[[command]]
name = "TS.MGET"
group = "ts"
since = "1.0.0"
arity = -3
plan = "metadata"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "The newest sample of every series a filter list takes, with the labels beside it if the read asked for them. FILTER is not optional and its absence is an arity error rather than a syntax one however many words the command has, because the module counts what it needed after finding the keyword rather than before. WITHLABELS and SELECTED_LABELS together is an error, and the module drops the ED from the second keyword in the sentence it writes about it."

[[command]]
name = "TS.MRANGE"
group = "ts"
since = "1.0.0"
arity = -4
plan = "metadata"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "A span read out of every series a filter list takes, which is the TS.RANGE grammar with the filter list behind it and an optional group behind that. GROUPBY has to be the last four words of the command and REDUCE has to be the word two past it, or the command is an arity error rather than anything that names what went wrong. Ten of the fifteen reductions are allowed as a reducer and the weighted mean, the first and the last are not. A group folds the rows its members answered by timestamp, drops the readings that are not numbers and then reduces what is left."

[[command]]
name = "TS.MREVRANGE"
group = "ts"
since = "1.4.0"
arity = -4
plan = "metadata"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "The same read newest first. The direction is applied to each member series before the group folds them, and a COUNT is applied to each member and then again to the fold, so a group can answer fewer rows than the count and never more."


# ---------------------------------------------------------------------- array

[[command]]
name = "ARSET"
group = "array"
since = "8.8.0"
arity = -4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-18"
notes = "One key lookup and then a write per value into consecutive positions from the index given. The reply is how many of those positions were empty before, so overwriting ten values in place answers zero. A value of seven bytes or less lives in the position word itself, an integer that fits sixty one bits and a double that prints back as the exact bytes the client sent live there too, and everything else goes into one growable blob per key."

[[command]]
name = "ARMSET"
group = "array"
since = "8.8.0"
arity = -4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-19"
notes = "ARSET for positions that are not neighbours. Every index in the argument list is parsed before the key is touched, so a bad index in the last pair writes none of the earlier ones."

[[command]]
name = "ARGET"
group = "array"
since = "8.8.0"
arity = 3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A binary search over the slice directory and then one index into the slice, so it does not care where in the sixty four bit index space the index sits. A hole and a missing key are both a null, which is the same answer HGET gives for a missing field."

[[command]]
name = "ARMGET"
group = "array"
since = "8.8.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "ARGET once per index named, with the array header found once. The reply has one entry per index asked for and holes come back as nulls, so the client can line the answers up with what it asked without counting."

[[command]]
name = "ARGETRANGE"
group = "array"
since = "8.8.0"
arity = 4
plan = "cursor"
bounded = "yes"
status = "shipped"
wire = "verified"
notes = "One reply per position and not per element, which is why the range is capped at a million positions and refused rather than trimmed above that. Without the cap a range over the whole space against a missing key is eighteen quintillion nulls, and Redis says in as many words that the limit is not tunable."

[[command]]
name = "ARLEN"
group = "array"
since = "8.8.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The highest populated index plus one, read off the last slice in the directory. It is not the population and it does not go down when an element in the middle is deleted, though deleting the highest one does bring it down. The reply is unsigned, because an array with something at the top of the index space has a length that does not fit a signed integer."

[[command]]
name = "ARCOUNT"
group = "array"
since = "8.8.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "How many indices hold something, kept as a counter on the array rather than summed over the slices, so it is the same cost whatever shape the array is in."

[[command]]
name = "ARDEL"
group = "array"
since = "8.8.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Empties the positions named and answers how many of them held something. A slice that loses its last element is dropped, and a key that loses its last element is deleted, which is the rule every collection here follows."

[[command]]
name = "ARDELRANGE"
group = "array"
since = "8.8.0"
arity = -4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The cost is the elements it touches and not the span it was asked about, because a range that covers whole slices drops those slices whole. A pair may come in either order and the two ends are sorted before the delete, which is not what ARGETRANGE does with a reversed pair."

[[command]]
name = "ARINSERT"
group = "array"
since = "8.8.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Appends at the insert cursor, which starts at zero and is moved by nothing except ARINSERT, ARRING and ARSEEK. A batch that would run off the top of the index space is refused before any of it lands, so the array is never left half written."

[[command]]
name = "ARRING"
group = "array"
since = "8.8.0"
arity = -4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A ring buffer built out of indices rather than out of a structure, so writes go to the cursor plus one modulo the size given. Changing the size between calls renumbers the run that survives so that reading it back in index order is still reading it in the order it arrived, and the rebuild stops at the first hole. The size is read before the key, so a bad size against a string is a bad size and not a wrong type."

[[command]]
name = "ARNEXT"
group = "array"
since = "8.8.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Where the next append would go. Zero for a key that is not there and zero for a cursor nothing has moved yet, which are the same answer because they mean the same thing, and a null once the cursor has been parked at the top of the space and there is no honest index to name."

[[command]]
name = "ARSEEK"
group = "array"
since = "8.8.0"
arity = 3
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Points the cursor. A missing key answers zero and is not created, because an array with nothing in it is not a key here. This is the only array command that takes two to the sixty four minus one as an index, and it takes it because the log that rebuilds a database has to be able to say the terminal state."

[[command]]
name = "ARLASTITEMS"
group = "array"
since = "8.8.0"
arity = -3
plan = "cursor"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The newest positions walking back from the cursor, wrapping at the bottom of the array back to the top, oldest first unless REV. Positions and not elements, so a hole inside the window comes back as a null. A count of zero or less is an empty reply and Redis answers it before it has read the option or looked at the key, which is visible when both are wrong."

[[command]]
name = "ARSCAN"
group = "array"
since = "8.8.0"
arity = -4
plan = "cursor"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Index and value pairs for everything a range holds, holes skipped, reversed when the start is above the end. It needs none of the million position cap ARGETRANGE has because the cost is the elements found and the slices they sit in, not the width of the range, so a scan of the whole index space over a key holding three elements is three visits."

[[command]]
name = "ARGREP"
group = "array"
since = "8.8.0"
arity = -6
plan = "cursor"
bounded = "yes"
status = "shipped"
wire = "verified"
divergent = "D-22"
notes = "ARSCAN's walk with up to two hundred and fifty predicates in front of the reply, combined with OR unless AND was asked for, answering the indexes that matched or index and value pairs with WITHVALUES. EXACT is byte equality, MATCH is containment, GLOB is the pattern language KEYS uses and RE is a POSIX extended regular expression. The two bounds take - and + for the two ends of the array as well as an index, and they are read before the rest of the command, so a bad index beats a syntax error whichever way round the two are written. LIMIT counts what matched and not what was looked at, which is why this is the one array walk that is bounded by the option rather than inherently."

[[command]]
name = "AROP"
group = "array"
since = "8.8.0"
arity = -5
plan = "cursor"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-21"
notes = "One number out of a range, under one of eight operations. SUM, MIN and MAX read what parses as a number and ignore the rest, and answer a null when nothing in the range did. AND, OR and XOR truncate a float toward zero, skip anything that will not fit a signed sixty four bit integer, and answer a null when they saw no integer. MATCH and USED count rather than aggregate, so a missing key is a zero for those two and a null for the other six. The aggregate replies go through the seventeen significant digit printer Redis uses for them, which is why AROP says 0.29999999999999999 where ZSCORE says 0.3 for the same number."

[[command]]
name = "ARINFO"
group = "array"
since = "8.8.0"
arity = -2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-20"
notes = "Seven fields about the key, or twelve with FULL. It is the one array command where a missing key is an error rather than an empty answer, which is deliberate on Redis's part: this is a question about a key that exists. The seven short fields are all struct reads, so the short form is constant time, and only FULL walks the directory to average the slices."


# --------------------------------------------------------------------- stream

[[command]]
name = "XADD"
group = "stream"
since = "5.0.0"
arity = -5
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One append into the tail node, which is a listpack that grows until it hits either the byte or the entry limit and then a new one is started. The field names of an entry that matches the node's master entry are not stored again, so a producer writing the same shape over and over pays for the values and a flag byte. The ID is either the clock, a millisecond the client named with the sequence worked out here, or an ID given whole, and all three have to be greater than the last one."

[[command]]
name = "XLEN"
group = "stream"
since = "5.0.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A counter on the stream record and not a walk, which is why it stays constant time on a stream that has had entries deleted out of the middle of it."

[[command]]
name = "XDEL"
group = "stream"
since = "5.0.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The entry is marked deleted in its node rather than moved out of it, so the cost is the lookup and not a rewrite of everything behind it. Every ID in the argument list is parsed before any of them is deleted, which is Redis's order and is visible: XDEL key 1-1 nonsense deletes nothing."

[[command]]
name = "XDELEX"
group = "stream"
since = "8.2.0"
arity = -5
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "XDEL with a say in what happens to the groups that were handed the entry, and one integer per ID back instead of a count. ACKED asks a wider question than its name does: an entry is only safe to take when no group holds it and no group's bookmark is still behind it, so a stream with one group sitting at 0-0 refuses every ACKED delete."

[[command]]
name = "XACKDEL"
group = "stream"
since = "8.2.0"
arity = -6
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The reply is about the group's pending list and not about the log, so an ID the group was not holding is minus one even when the entry is sitting in the stream, and an ID it was holding is never minus one even when the entry has already been deleted."

[[command]]
name = "XNACK"
group = "stream"
since = "8.8.0"
arity = -7
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The other half of XACK. The entry goes back to the group with no owner and reads as idle for longer than any min-idle-time a claim can name, which puts it at the front of the next XAUTOCLAIM. The bookmark does not move, so a > read will not hand it out a second time. The three words only differ in the delivery count: SILENT takes one off it, FAIL leaves it alone and FATAL puts it at the signed ceiling."

[[command]]
name = "XTRIM"
group = "stream"
since = "5.0.0"
arity = -4
plan = "cursor"
bounded = "yes"
status = "shipped"
wire = "verified"
notes = "Whole nodes are dropped at the front while the node behind is still past the threshold, which is what makes the approximate form cheap: it stops at a node boundary rather than rewriting a listpack to remove part of one. An approximate trim with no LIMIT gets an implicit one of a hundred times stream-node-max-entries, so a single XTRIM MAXLEN ~ 0 on a large stream removes a bounded amount and leaves the rest for the next one."

[[command]]
name = "XRANGE"
group = "stream"
since = "5.0.0"
arity = -4
plan = "cursor"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "The walk starts at the node holding the low bound rather than at the front, and entries go into the reply buffer as they are read with the array header written behind them, so nothing is collected. XRANGE key - + with no COUNT is the whole stream on the wire, which is the risk the bound field names and is Redis's behaviour."

[[command]]
name = "XREVRANGE"
group = "stream"
since = "5.0.0"
arity = -4
plan = "cursor"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "XRANGE with the bounds swapped by the caller, since the storage takes the low one first either way. The backward walk inside a node is the slower direction today, because a listpack is stepped back over by reading the length that trails each entry, and PR 1 left a note about doing that without buffering the node."

[[command]]
name = "XREAD"
group = "stream"
since = "5.0.0"
arity = -4
plan = "cursor"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "Several streams in one command, each from an ID the client is holding, and BLOCK parks the client on the waiter list rather than polling. Nothing is taken away, so a hundred readers parked on one stream all get the same entry when it lands, which is the difference between this and BLPOP. The $ and + forms are resolved once when the command arrives and never again on a retry, because resolving them per attempt would mean the client waits for what comes after the last thing that happened and never wakes. Redis 8.10 added MAXCOUNT and MAXSIZE, which cap how much one call answers across all the streams named rather than per stream the way COUNT does, and neither is taken here yet."

[[command]]
name = "XREADGROUP"
group = "stream"
since = "5.0.0"
arity = -7
plan = "cursor"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "The same read with a group bookmark in front of it, so > hands out what nobody has had and an ID reads back this consumer's own pending list. It is a write because delivery is recorded: each entry handed out goes on the group's pending list against the consumer that took it, unless NOACK says not to. A history read of an entry that has since been deleted answers the ID with a null beside it so the consumer can still acknowledge it. Redis 8.10 added MAXCOUNT and MAXSIZE, which cap how much one call answers across all the streams named rather than per stream the way COUNT does, and neither is taken here yet."

[[command]]
name = "XACK"
group = "stream"
since = "5.0.0"
arity = -4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One removal from the group's pending list and one from the consumer's per ID, both by lookup rather than by scan. Like XDEL it parses every ID before it acknowledges any of them."

[[command]]
name = "XSETID"
group = "stream"
since = "5.0.0"
arity = -3
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Three counters on the stream record and nothing else, which is what makes it the command a replica load uses to put a stream back exactly as it was. The new last ID has to be at least the top entry's and at least the max deleted ID, and both refusals have their own sentence."

[[command]]
name = "XGROUP"
group = "stream"
since = "5.0.0"
arity = -2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Six subcommands over the group records on the stream. Each has its own arity in Redis's table, so too few arguments names the pair as xgroup|create and enough arguments in a shape the handler will not take gets the longer sentence pointing at XGROUP HELP. CREATE on a group that is already there answers BUSYGROUP, which is its own prefix because a client racing another one to create a group treats it as somebody else got there first."

[[command]]
name = "XINFO"
group = "stream"
since = "5.0.0"
arity = -2
plan = "metadata"
bounded = "risk"
status = "shipped"
wire = "verified"
divergent = "D-27, D-28"
notes = "Four subcommands, three of which are struct reads. XINFO STREAM FULL is the risk the bound field names, since it walks entries and every group's pending list, and its COUNT defaults to ten with zero meaning all of them. Groups and consumers come back in name order, which is free for Redis because it holds them in a rax and is found here by a selection walk, on the grounds that this is a diagnostic command over a handful of names and the alternative is a second index to keep in step."

[[command]]
name = "XPENDING"
group = "stream"
since = "5.0.0"
arity = -3
plan = "cursor"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "Two commands under one name. The short form is four numbers off the group record and the long form walks the pending list between two IDs. Redis reads the optional consumer only when the argument count comes out exactly right, so a stray trailing argument is ignored rather than refused, and that is copied here rather than tidied up."

[[command]]
name = "XCLAIM"
group = "stream"
since = "5.0.0"
arity = -6
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One pending list entry moved between consumers per ID, by lookup. IDs are read until one will not parse and everything after that is an option, which is Redis's rule and is visible: XCLAIM k g c 0 - complains about an unrecognised option and not about a bad ID. An ID that is pending but whose entry has since been deleted is dropped from the pending list on the way past and left out of the reply."

[[command]]
name = "XAUTOCLAIM"
group = "stream"
since = "6.2.0"
arity = -6
plan = "cursor"
bounded = "yes"
status = "shipped"
wire = "verified"
notes = "A sweep of the pending list from a cursor, taking what has been idle long enough and stopping after COUNT of them, with the cursor to carry on from as the first value of the reply. The third value is the IDs it dropped for no longer being in the stream, which is what makes a sweep converge instead of handing the same dead entry round forever."


# ------------------------------------------------------------------ scripting

[[command]]
name = "SCRIPT"
group = "scripting"
since = "2.6.0"
arity = -2
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-16"
notes = "FLUSH, EXISTS and HELP. The cache is empty and there is nothing that can put anything in it, so flushing it is a no-op that is true and EXISTS answering zero is the true answer to the question it was asked. LOAD, KILL and DEBUG would need an interpreter to answer honestly and are not there at all."

[[command]]
name = "FUNCTION"
group = "scripting"
since = "7.0.0"
arity = -2
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-16"
notes = "FLUSH, LIST, DELETE and HELP, all of which are exactly right with no libraries loaded. STATS is the one that looks answerable and is not, because a real server lists LUA in its engines map and there is no engine here to list, so an empty map would be a different answer rather than the same one."

# ----------------------------------------------------------------- connection

[[command]]
name = "PING"
group = "connection"
since = "1.0.0"
arity = -1
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The table says a minimum of one and a real server then refuses a third argument as a wrong number of them, which the arity alone does not say."

[[command]]
name = "ECHO"
group = "connection"
since = "1.0.0"
arity = 2
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"

[[command]]
name = "HELLO"
group = "connection"
since = "6.0.0"
arity = -1
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-12"
notes = "AUTH is accepted for the default user with any password, which is how a real server with no requirepass behaves. The reply goes out in the protocol just agreed rather than the one the request arrived in."

[[command]]
name = "SELECT"
group = "connection"
since = "1.0.0"
arity = 2
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Sixteen databases, and the number is fixed for the life of the process, so CONFIG GET databases answers from a constant."

[[command]]
name = "RESET"
group = "connection"
since = "6.2.0"
arity = 1
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Puts the protocol back to RESP2 as well as the database back to zero, which is the half that is easy to miss and leaves a pooled connection speaking the wrong one."

[[command]]
name = "QUIT"
group = "connection"
since = "1.0.0"
arity = -1
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The reply is written before the socket closes, so this answers with a flow decision rather than doing anything to the connection itself."

# --------------------------------------------------------------------- server

[[command]]
name = "COMMAND"
group = "server"
since = "2.8.13"
arity = -1
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-13"
notes = "COUNT, LIST, INFO, DOCS, GETKEYS and HELP. GETKEYS is the one a cluster aware client routes on, so MSETEX, whose keys are not where the first, last and step triple says, is special cased there rather than being answered wrongly."

[[command]]
name = "CONFIG"
group = "server"
since = "2.0.0"
arity = -2
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-14"
notes = "Every setting is fixed for the life of the process, so SET accepts a write that changes nothing and refuses everything else rather than pretending to have taken it."

[[command]]
name = "INFO"
group = "server"
since = "1.0.0"
arity = -1
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-12"
notes = "Only the fields this layer can stand behind. There is no rdb_last_save_time because there is no save, and a field that is not there is a client falling back rather than a client believing a zero. The CPU section was absent for the same reason and is there now, from one getrusage call, because Redis's own unit/info-command asks for used_cpu_user by name and because a monitoring tool graphs it against wall clock to tell a busy server from a waiting one. Commandstats is here under the same rule and is three of Redis's five fields: calls, rejected_calls and failed_calls are counted, and usec and usec_per_call are not, because timing a command means two clock reads around a call that takes tens of nanoseconds and a zero under a name that says microseconds is worse than nothing at all. Replication reports role, connected_slaves, master_failover_state and master_repl_offset, and the eight backlog fields are missing because the backlog is a thing that does not exist here rather than a thing that is empty."

[[command]]
name = "DBSIZE"
group = "server"
since = "1.0.0"
arity = 1
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-15"
notes = "The size of the index, not a walk over it, which is what Redis does too. A key that is past its deadline and has not been read since is counted by both servers, and Redis then takes it out on its next active expiry tick where we wait for somebody to read it."

[[command]]
name = "FLUSHALL"
group = "server"
since = "1.0.0"
arity = -1
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A fresh index and a fresh arena per database rather than a walk that deletes each key in turn, because the one thing a client that has just said this is entitled to expect is the memory back. ASYNC and SYNC are both accepted and neither changes anything, since the keyspace is empty before the OK goes out either way."

[[command]]
name = "FLUSHDB"
group = "server"
since = "1.0.0"
arity = -1
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "FLUSHALL on the one database this connection is on."

[[command]]
name = "SWAPDB"
group = "server"
since = "4.0.0"
arity = 3
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "In the server group and not the keyspace one, which is Redis's answer and is the right one: it names no key and what it changes is what every connected client is looking at. A database here is a value in a slice, so the swap is the slice's own swap and costs two pointer sized writes whatever is in either database, which is what makes this fast and dangerous at the same time. Nobody is told. A client on database zero is still on database zero and is now looking at what used to be database one, and a client parked in BLPOP remembers the index it blocked on rather than the database, so it wakes against the swapped in one. That is Redis's behaviour and here it falls out of the index being the thing that is stored rather than being a rule anybody wrote. The two arguments have two different complaints, and the split is Redis's: a word that is not a number says which of the two arguments was wrong, and a number that is not one of ours gets the same out of range message SELECT gives, because the first check happens while reading the argument and the second happens inside the swap."

[[command]]
name = "TIME"
group = "server"
since = "2.6.0"
arity = 1
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Two bulk strings and not one integer, seconds and then microseconds within that second, both as decimal text. It reads the wall clock and not the coarse cached millisecond the keyspace uses, because the coarse one is refreshed on a tick and a client that calls TIME twice and gets the same microsecond has been lied to. The ACL categories are @fast and nothing else, which reads like an omission and is not: the categories say what a command can reach and this one reaches nothing."

[[command]]
name = "SHUTDOWN"
group = "server"
since = "1.0.0"
arity = -1
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Nothing is written back on success and the connection closes under the client, which is what a stopped server looks like from the outside and is what the client libraries already expect. All five flags are taken and none of them changes what happens, because this server has no save points and no snapshot to write: what durability there is belongs to the file underneath and is already on disk before a command returns, so SAVE has nothing to do and NOSAVE has nothing to skip, and NOW and FORCE are about replicas and failed saves that do not exist here. The syntax errors were read off 8.10.1 rather than guessed. SAVE and NOSAVE together is an error, ABORT next to any other flag is an error, and ABORT next to a second ABORT is fine, as is any flag repeated. ABORT on its own answers No shutdown in progress, and here that is a state that cannot be reached at all rather than one that happens to be empty, because the decision and the stop land inside one turn of the loop. The command sets a flag and the driver leaves its loop on the next turn, so the batch this arrived in finishes and its other replies go out, and the socket file and the file get taken away by the same code a signal reaches."

[[command]]
name = "BACKUP"
group = "server"
since = "8.10.0"
arity = 2
plan = "none"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "Seven subcommands, START, SEAL, ABORT, CLEANUP, STATUS, LIST and HELP, over a state machine of idle, incrementing, sealed and failed, all of it read off 8.10.1 with a raw socket rather than guessed. START writes the base RDB into backupdir under the configured dir and moves to incrementing, SEAL writes the incremental file and the manifest beside it and moves to sealed, ABORT takes the base file away again and moves to failed with aborted by user in the error field, and CLEANUP takes all three away from any state that is not running and goes back to idle. STATUS is a four field map in RESP3 and a flat eight element array in RESP2, LIST names one path while incrementing and three when sealed and nothing otherwise, and a sealed backup that nobody cleans up is swept away by backup-sealed-ttl seconds after the seal, from the maintenance pass rather than a timer thread. The two settings around it behave the way they do there too: dir is a protected config and refuses even the value it already holds, and backupdirname is immutable. What is inside the incremental file is D-46, since there is no append only log underneath this server to copy the writes out of, and the arity of the container and the never observable snapshotting state are in the same entry. Risk rather than inherent because what START costs is the size of the dataset."
