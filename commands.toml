# Twenty nine is what 8.10.1 answers for its generic group once the five OBJECT
# subcommands are counted as the one command they are dispatched as. The nine
# expiry commands are in here rather than in a group of their own, because a
# deadline lives in the key's record and EXPIRE is dispatched down the same path
# DEL is. There was an expiry group in this file that listed none of them and
# claimed nine, which was two names for one group and a count nobody could check.
# Nothing is left. MIGRATE came last and it is the only command in the group
# that talks to another server, which is why it needed the file format DUMP and
# RESTORE brought in and a socket on top of that. MOVE, SORT, SORT_RO, WAIT and
# WAITAOF were the rest of it and they landed together because none of them
# needs anything the store did not already have.
# DEL, UNLINK, EXISTS and TYPE landed in M2 and the rest are in M3. The four were
# not a random quarter of the group, they are what Redis's own test suite needs
# before it will run one file. OBJECT is here now because the size ladder is not
# finished until a client can see which rung a key is on. RENAME, RENAMENX, COPY
# and TOUCH came next because none of them needs anything the store did not
# already have. KEYS, SCAN and RANDOMKEY needed a cursor over the index that
# survives a resize, which is the one thing on this list that was a change to
# the index rather than three more rows, and it landed with them.

[[group]]
name = "transactions"
expected = 5
status = "planned"
doc = "12 section 4"

[[group]]
name = "scripting"
expected = 8
status = "partial"
doc = "12 section 7"
