# The command audit, machine readable.
#
# Every command gets a storage plan and a bound or materialise verdict before it
# ships, and `cargo xtask check` enforces that: a command with no storage plan
# does not ship. This is the discipline aki's audit used over 250 commands, and
# the reason it is a file rather than a document is that a document goes stale
# and nobody notices.
#
# plan is one of:
#   point         one record, found by key
#   cursor        walks a structure, answers incrementally
#   merge         reads more than one key and combines them
#   metadata      answers from the header without reading the value
#   whole-value   reads or rewrites the entire value
#
# bounded is one of:
#   inherent      the answer is small whatever the value is
#   yes           the answer could be large and is bounded rather than built
#   risk          the cost follows the size of the value, and that is noted
#
# wire is one of:
#   verified      the argument order is checked against a real Redis
#   unverified    the storage half is done and the argument order is not settled
#   none          no dispatch layer for it yet, and none needed to check it
#
# divergent names a row in divergences.toml. A command that has one and names a
# row that is not there fails the check.

# ---------------------------------------------------------------- group budget

[[group]]
name = "string"
expected = 26
status = "shipped"
doc = "08 section 2"
# 12 section 3 says 28. A real Redis 8.8 answers COMMAND LIST FILTERBY ACLCAT
# string with 26, which is 22 classic names plus 8.4's MSETEX, DELEX and DIGEST
# and 8.8's INCREX. The extra two in the spec look like SUBSTR and the SET
# option forms being counted separately. The spec number comes down to 26 at
# the M2 wrap up.

