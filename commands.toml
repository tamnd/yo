# --------------------------------------------------------------------- strings

[[command]]
name = "SET"
group = "string"
since = "1.0.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-8"
notes = "One record written, one freed. NX, XX and the four IF forms all decide against a single probe, and GET reports what that probe found whether or not the write went ahead. IFNE holds on a key that is not there, since a key that is not there is not equal to anything."

[[command]]
name = "GET"
group = "string"
since = "1.0.0"
arity = 2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One probe. The value is handed back as a slice of the record it lives in, or as an integer that becomes digits only when the reply is written."

[[command]]
name = "GETSET"
group = "string"
since = "1.0.0"
arity = 3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The one string command that cannot avoid a copy, because the record the old value lived in is freed before the caller sees it."

[[command]]
name = "GETDEL"
group = "string"
since = "6.2.0"
arity = 2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Copies for the same reason GETSET does."

[[command]]
name = "GETEX"
group = "string"
since = "6.2.0"
arity = -2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Adding or removing a deadline changes the record's length, so it is a rewrite and not an overwrite. Plain GETEX changes nothing and is a read."

[[command]]
name = "SETNX"
group = "string"
since = "1.0.0"
arity = 3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"

[[command]]
name = "SETEX"
group = "string"
since = "2.0.0"
arity = 4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A zero or negative time to live is an error and not a delete."

[[command]]
name = "PSETEX"
group = "string"
since = "2.6.0"
arity = 4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"

[[command]]
name = "MSET"
group = "string"
since = "1.0.1"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-8"
notes = "One point write per pair, in order."

[[command]]
name = "MSETNX"
group = "string"
since = "1.0.1"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-8"
notes = "Every key is checked before anything is written, so a duplicate key inside one call does not defeat itself."

[[command]]
name = "MGET"
group = "string"
since = "1.0.0"
arity = -2
plan = "point"
bounded = "yes"
status = "shipped"
wire = "verified"
notes = "Every dead key is reaped first, then the whole answer is read from a store nobody is going to mutate, which is what lets all the values borrow at once instead of being copied out one at a time."

[[command]]
name = "APPEND"
group = "string"
since = "2.0.0"
arity = 3
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
divergent = "D-8"
notes = "Reads the value and writes it back with the tail attached, so repeated appends are quadratic in the final length. Redis amortises this with sds spare capacity and we do not yet. The band that fixes it is the log region in M5."

[[command]]
name = "STRLEN"
group = "string"
since = "2.2.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The record header carries the length, so nothing reads the value. An int encoded value counts its digits arithmetically rather than formatting them."

[[command]]
name = "SETRANGE"
group = "string"
since = "2.2.0"
arity = 4
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
divergent = "D-8"
notes = "Same rewrite as APPEND, and a write past the end pads with zero bytes. A write of nothing to a key that is not there creates nothing and answers zero."

[[command]]
name = "GETRANGE"
group = "string"
since = "2.4.0"
arity = 4
plan = "point"
bounded = "yes"
status = "shipped"
wire = "verified"
notes = "Slices the record rather than copying it, except for an int encoded value whose digits do not exist anywhere until somebody asks."

[[command]]
name = "SUBSTR"
group = "string"
since = "1.0.0"
arity = 4
plan = "point"
bounded = "yes"
status = "shipped"
wire = "verified"
notes = "The same command as GETRANGE under an older name, deprecated in Redis since 2.0.0 and still answered."

[[command]]
name = "INCR"
group = "string"
since = "1.0.0"
arity = 2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One probe, one add, one eight byte store back into the record the probe landed on. No arena append, no free, no rehash. This is the command M2's gate is about."

[[command]]
name = "DECR"
group = "string"
since = "1.0.0"
arity = 2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"

[[command]]
name = "INCRBY"
group = "string"
since = "1.0.0"
arity = 3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"

[[command]]
name = "DECRBY"
group = "string"
since = "1.0.0"
arity = 3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Carried through as a subtraction rather than turned into an addition, because negating first would overflow on i64::MIN."

[[command]]
name = "INCRBYFLOAT"
group = "string"
since = "2.6.0"
arity = 3
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The result is stored as text and never as an integer, because Redis reports embstr afterwards even when the number came out whole."

[[command]]
name = "LCS"
group = "string"
since = "7.0.0"
arity = -3
plan = "merge"
bounded = "risk"
status = "shipped"
wire = "verified"
divergent = "D-10"
notes = "A table the size of the product of the two lengths, in time and in memory. The one string command that is not a probe and a store, and the one nobody should put on a hot path."

[[command]]
name = "MSETEX"
group = "string"
since = "8.4.0"
arity = -4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-8"
notes = "MSETEX numkeys key value [key value ...] [NX|XX] [EX|PX|EXAT|PXAT|KEEPTTL], checked against a real 8.8. The condition is over the whole set: NX needs every key missing and XX needs every key present, and a partial match writes nothing. With no expiration option it clears the deadline the way plain SET does."

[[command]]
name = "DELEX"
group = "string"
since = "8.4.0"
arity = -2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "DELEX key [IFEQ v|IFNE v|IFDEQ d|IFDNE d], checked against a real 8.8. Compare and delete, the other half of SET IFEQ. The comparison is against the string the client would have read, so an int encoded 42 is equal to 42 and not to 042."

[[command]]
name = "DIGEST"
group = "string"
since = "8.4.0"
arity = 2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The XXH3 of the value as sixteen hex characters. It exists so IFDEQ is worth using: a client comparing against a megabyte value sends eight bytes instead of the value. The number is bit for bit Redis's, checked against a real 8.8 at every length the algorithm branches on."

[[command]]
name = "INCREX"
group = "string"
since = "8.8.0"
arity = -2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-11"
notes = "INCREX key [BYINT n|BYFLOAT f] [SATURATE] [LBOUND l] [UBOUND u] [EX|PX|EXAT|PXAT|PERSIST] [ENX], checked against a real 8.8. A counter with a bound, a saturation policy and four things it can do to the deadline. The reply is the value and the amount applied, and a refused increment reports zero applied and does not create the key."

# ----------------------------------------------------------------- connection

[[command]]
name = "PING"
group = "connection"
since = "1.0.0"
arity = -1
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The table says a minimum of one and a real server then refuses a third argument as a wrong number of them, which the arity alone does not say."

[[command]]
name = "ECHO"
group = "connection"
since = "1.0.0"
arity = 2
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"

[[command]]
name = "HELLO"
group = "connection"
since = "6.0.0"
arity = -1
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-12"
notes = "AUTH is accepted for the default user with any password, which is how a real server with no requirepass behaves. The reply goes out in the protocol just agreed rather than the one the request arrived in."

[[command]]
name = "SELECT"
group = "connection"
since = "1.0.0"
arity = 2
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Sixteen databases, and the number is fixed for the life of the process, so CONFIG GET databases answers from a constant."

[[command]]
name = "RESET"
group = "connection"
since = "6.2.0"
arity = 1
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Puts the protocol back to RESP2 as well as the database back to zero, which is the half that is easy to miss and leaves a pooled connection speaking the wrong one."

[[command]]
name = "QUIT"
group = "connection"
since = "1.0.0"
arity = -1
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The reply is written before the socket closes, so this answers with a flow decision rather than doing anything to the connection itself."

# --------------------------------------------------------------------- server

[[command]]
name = "COMMAND"
group = "server"
since = "2.8.13"
arity = -1
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-13"
notes = "COUNT, LIST, INFO, DOCS, GETKEYS and HELP. GETKEYS is the one a cluster aware client routes on, so MSETEX, whose keys are not where the first, last and step triple says, is special cased there rather than being answered wrongly."

[[command]]
name = "CONFIG"
group = "server"
since = "2.0.0"
arity = -2
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-14"
notes = "Every setting is fixed for the life of the process, so SET accepts a write that changes nothing and refuses everything else rather than pretending to have taken it."

[[command]]
name = "INFO"
group = "server"
since = "1.0.0"
arity = -1
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-12"
notes = "Only the fields this layer can stand behind. There is no rdb_last_save_time because there is no save, and a field that is not there is a client falling back rather than a client believing a zero."
