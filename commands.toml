# --------------------------------------------------------------------- strings

[[command]]
name = "SET"
group = "string"
since = "1.0.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-8"
notes = "One record written, one freed. NX, XX and the four IF forms all decide against a single probe, and GET reports what that probe found whether or not the write went ahead. IFNE holds on a key that is not there, since a key that is not there is not equal to anything."

[[command]]
name = "GET"
group = "string"
since = "1.0.0"
arity = 2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One probe. The value is handed back as a slice of the record it lives in, or as an integer that becomes digits only when the reply is written."

[[command]]
name = "GETSET"
group = "string"
since = "1.0.0"
arity = 3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The one string command that cannot avoid a copy, because the record the old value lived in is freed before the caller sees it."

[[command]]
name = "GETDEL"
group = "string"
since = "6.2.0"
arity = 2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Copies for the same reason GETSET does."

[[command]]
name = "GETEX"
group = "string"
since = "6.2.0"
arity = -2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Adding or removing a deadline changes the record's length, so it is a rewrite and not an overwrite. Plain GETEX changes nothing and is a read."

[[command]]
name = "SETNX"
group = "string"
since = "1.0.0"
arity = 3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"

[[command]]
name = "SETEX"
group = "string"
since = "2.0.0"
arity = 4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A zero or negative time to live is an error and not a delete."

[[command]]
name = "PSETEX"
group = "string"
since = "2.6.0"
arity = 4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"

[[command]]
name = "MSET"
group = "string"
since = "1.0.1"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-8"
notes = "One point write per pair, in order."

[[command]]
name = "MSETNX"
group = "string"
since = "1.0.1"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-8"
notes = "Every key is checked before anything is written, so a duplicate key inside one call does not defeat itself."

[[command]]
name = "MGET"
group = "string"
since = "1.0.0"
arity = -2
plan = "point"
bounded = "yes"
status = "shipped"
wire = "verified"
notes = "Every dead key is reaped first, then the whole answer is read from a store nobody is going to mutate, which is what lets all the values borrow at once instead of being copied out one at a time."

[[command]]
name = "APPEND"
group = "string"
since = "2.0.0"
arity = 3
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
divergent = "D-8"
notes = "Reads the value and writes it back with the tail attached, so repeated appends are quadratic in the final length. Redis amortises this with sds spare capacity and we do not yet. The band that fixes it is the log region in M5."

[[command]]
name = "STRLEN"
group = "string"
since = "2.2.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The record header carries the length, so nothing reads the value. An int encoded value counts its digits arithmetically rather than formatting them."

[[command]]
name = "SETRANGE"
group = "string"
since = "2.2.0"
arity = 4
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
divergent = "D-8"
notes = "Same rewrite as APPEND, and a write past the end pads with zero bytes. A write of nothing to a key that is not there creates nothing and answers zero."

[[command]]
name = "GETRANGE"
group = "string"
since = "2.4.0"
arity = 4
plan = "point"
bounded = "yes"
status = "shipped"
wire = "verified"
notes = "Slices the record rather than copying it, except for an int encoded value whose digits do not exist anywhere until somebody asks."

[[command]]
name = "SUBSTR"
group = "string"
since = "1.0.0"
arity = 4
plan = "point"
bounded = "yes"
status = "shipped"
wire = "verified"
notes = "The same command as GETRANGE under an older name, deprecated in Redis since 2.0.0 and still answered."

[[command]]
name = "INCR"
group = "string"
since = "1.0.0"
arity = 2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One probe, one add, one eight byte store back into the record the probe landed on. No arena append, no free, no rehash. This is the command M2's gate is about."

[[command]]
name = "DECR"
group = "string"
since = "1.0.0"
arity = 2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"

[[command]]
name = "INCRBY"
group = "string"
since = "1.0.0"
arity = 3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"

[[command]]
name = "DECRBY"
group = "string"
since = "1.0.0"
arity = 3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Carried through as a subtraction rather than turned into an addition, because negating first would overflow on i64::MIN."

[[command]]
name = "INCRBYFLOAT"
group = "string"
since = "2.6.0"
arity = 3
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The result is stored as text and never as an integer, because Redis reports embstr afterwards even when the number came out whole. The reply is written by a different printer from every other double in the server: it goes through ld2string in its human mode rather than d2string, and human mode is a fixed point conversion, so INCRBYFLOAT of ten to the thirtieth answers a one and thirty zeros where ZSCORE would answer 1e+30 for the same number."

[[command]]
name = "LCS"
group = "string"
since = "7.0.0"
arity = -3
plan = "merge"
bounded = "risk"
status = "shipped"
wire = "verified"
divergent = "D-10"
notes = "A table the size of the product of the two lengths, in time and in memory. The one string command that is not a probe and a store, and the one nobody should put on a hot path."

[[command]]
name = "MSETEX"
group = "string"
since = "8.4.0"
arity = -4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-8"
notes = "MSETEX numkeys key value [key value ...] [NX|XX] [EX|PX|EXAT|PXAT|KEEPTTL], checked against a real 8.8. The condition is over the whole set: NX needs every key missing and XX needs every key present, and a partial match writes nothing. With no expiration option it clears the deadline the way plain SET does."

[[command]]
name = "DELEX"
group = "string"
since = "8.4.0"
arity = -2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "DELEX key [IFEQ v|IFNE v|IFDEQ d|IFDNE d], checked against a real 8.8. Compare and delete, the other half of SET IFEQ. The comparison is against the string the client would have read, so an int encoded 42 is equal to 42 and not to 042."

[[command]]
name = "DIGEST"
group = "string"
since = "8.4.0"
arity = 2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The XXH3 of the value as sixteen hex characters. It exists so IFDEQ is worth using: a client comparing against a megabyte value sends eight bytes instead of the value. The number is bit for bit Redis's, checked against a real 8.8 at every length the algorithm branches on."

[[command]]
name = "INCREX"
group = "string"
since = "8.8.0"
arity = -2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-11"
notes = "INCREX key [BYINT n|BYFLOAT f] [SATURATE] [LBOUND l] [UBOUND u] [EX|PX|EXAT|PXAT|PERSIST] [ENX], checked against a real 8.8. A counter with a bound, a saturation policy and four things it can do to the deadline. The reply is the value and the amount applied, and a refused increment reports zero applied and does not create the key."

# ------------------------------------------------------------------- keyspace
#
# Four of the twenty, and they are here in M2 rather than in M3 with the rest of
# the group because Redis's own test suite cannot run a single file without
# them. In external mode it says FLUSHALL before every start_server block and
# gives up on the whole file if that fails, and most test bodies then say DEL to
# get to a known state. The other sixteen land with the scans and the renames.

[[command]]
name = "DEL"
group = "keyspace"
since = "1.0.0"
arity = -2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One probe and one free per key, and the reply is how many of them were there. A key named twice can only be deleted once, so the count is of keys removed and not of arguments matched."

[[command]]
name = "UNLINK"
group = "keyspace"
since = "4.0.0"
arity = -2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The same body as DEL. On a real server the difference is which thread frees the memory, and what UNLINK promises a client is that the key is gone from the keyspace when the reply arrives, which is about visibility rather than about threads."

[[command]]
name = "EXISTS"
group = "keyspace"
since = "1.0.0"
arity = -2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One probe per key, answering from the header without reading the value. A key named twice counts twice, which looks like a bug and is what Redis does."

[[command]]
name = "TYPE"
group = "keyspace"
since = "1.0.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Answers string, set or none. It grows a case each time a type lands."

[[command]]
name = "EXPIRE"
group = "keyspace"
since = "1.0.0"
arity = -3
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A deadline lives in the key's record rather than beside it, so this rewrites the record and never touches the value. For a string that means copying the bytes across, and for a set or a hash it is five bytes or thirteen, because the body sits in a slab and the record only holds a slot number. The condition keywords are a set and not a keyword, which does not read that way: EXPIRE key 100 XX GT is legal and means both, the same one twice means it once, and NX with any other or GT with LT are named errors rather than a generic syntax one. Only XX LT says anything the four keywords cannot say on their own, since GT already refuses a key with no deadline."

[[command]]
name = "PEXPIRE"
group = "keyspace"
since = "2.6.0"
arity = -3
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "EXPIRE counted in milliseconds. All four writers turn their number into one absolute millisecond before anything is stored, so the condition rules are applied in one place and the four cannot drift apart."

[[command]]
name = "EXPIREAT"
group = "keyspace"
since = "1.2.0"
arity = -3
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Absolute rather than relative. A deadline already gone deletes the key and still answers 1, which is the one thing the reply cannot tell a client: whether the deadline went on or the key went away. The store knows the difference and the wire throws it away, because that is what Redis puts on the wire."

[[command]]
name = "PEXPIREAT"
group = "keyspace"
since = "2.6.0"
arity = -3
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-17"
notes = "The only one of the four with no arithmetic to overflow, so it is the only one that can name a moment past what a record can hold. Redis takes PEXPIREAT key 9223372036854775807 and holds it in a full signed long. A record here holds forty six bits, so it clamps to the year 4199 and the key does not expire either way."

[[command]]
name = "PERSIST"
group = "keyspace"
since = "2.2.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Answers 0 for a key with no deadline and 0 for a key that is not there, which are the same answer to a client and different states in the store. Redis does not separate them either."

[[command]]
name = "TTL"
group = "keyspace"
since = "1.0.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Rounds to nearest, so four hundred milliseconds left answers 0 and six hundred answers 1. HTTL rounds up on the same question about a field, which is not something anyone would guess and is what 8.10.1 does, checked against a real server rather than reasoned about."

[[command]]
name = "PTTL"
group = "keyspace"
since = "2.6.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "TTL in milliseconds, which is the number the store actually holds, so this is the one with no rounding in it at all."

[[command]]
name = "EXPIRETIME"
group = "keyspace"
since = "7.0.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "When it falls due rather than how long is left, and it rounds to nearest the same way TTL does."

[[command]]
name = "PEXPIRETIME"
group = "keyspace"
since = "7.0.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The deadline exactly as the record holds it, with nothing derived and nothing rounded."

[[command]]
name = "OBJECT"
group = "keyspace"
since = "2.2.3"
arity = -2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "ENCODING is the one worth having and the other three are here because clients call them without thinking. It is the only window a client has onto the size ladder, so it is the command that says whether our ladder is really Redis's ladder, and it is why the thresholds behind it are the one thing CONFIG SET can move. A missing key answers nil on all four rather than an error, which reads like a bug and is what 8.10.1 does. REFCOUNT is always 1, because 8.10.1 answers 1 for a small integer too rather than the huge shared count it used to. IDLETIME is always 0 and FREQ is always the not an LFU policy complaint, and both will stay that way until there is eviction to track."

[[command]]
name = "TOUCH"
group = "keyspace"
since = "3.2.1"
arity = -2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The same walk EXISTS makes, including a key named twice counting twice. On a real server the difference is that this moves each key up the eviction order, and there is no eviction here yet, so the day it lands the bump goes in the store and this command does not change."

[[command]]
name = "RENAME"
group = "keyspace"
since = "1.0.0"
arity = 3
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The body never moves. A set or a hash is a slot number sitting in a record, and a slot number under a different key is the same set, so this writes the source's record bytes under the destination and deletes the source record without freeing anything. Renaming a set of a million members writes thirteen bytes. The deadline travels with the source and the destination's own deadline goes with the value it belonged to, which falls out of moving the whole record rather than being a rule applied on top. A missing source is an error and not a zero, which is unusual in this group, and it is checked before anything else, so RENAMENX nope nope is no such key rather than zero. Redis calls this slow and it is not, and the flag is Redis's to set."

[[command]]
name = "RENAMENX"
group = "keyspace"
since = "1.0.0"
arity = 3
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "RENAME that refuses a destination that is already there. A key renamed onto itself is refused too, because the destination does exist and a key is not new because it is the one you already had, where plain RENAME onto itself is OK and keeps the deadline."

[[command]]
name = "COPY"
group = "keyspace"
since = "6.2.0"
arity = -3
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "The one command in the group that costs what the value is worth. Two records pointing at one slot would be one set answering to two names and SADD to either would show up in both, so the body is cloned, which is Redis's cost too and there is no version of COPY that avoids it. DB n writes into a database the connection is not on, which is why the store splits this into an export that lifts a value out standing on its own and an import that puts one down, and the same pair is what MOVE, DUMP and RESTORE will want. The four failure modes are checked in an order nobody would write from scratch: the options first, so a bad DB is refused before anyone asks whether the source exists, then source and destination being the same object, and only then a missing source becoming the ordinary zero. Same object means same key in the same database, so COPY a a DB 1 is a real copy and COPY a a DB 0 from database zero is the error. A destination whose deadline has gone counts as free, which is the only answer consistent with EXISTS saying zero for the same key."

[[command]]
name = "SORT"
group = "keyspace"
since = "1.0.0"
arity = -2
divergent = "D-24"
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "The one command in the group that reads keys nobody named. BY and GET are not globs, they are templates: the first star is replaced with the element and the result is a key name, so a sort of ten thousand elements with a BY and a GET reads twenty thousand other keys. That is why it carries movablekeys, why Redis marks it not deterministic, and why SORT_RO exists as the readonly half. It is also why this is the one read path in the engine that copies the elements out before it does anything: the ordering is decided by reading other keys and reading another key needs the database the elements are borrowed from, so the borrow has to end first. Redis has the same problem and pays it by holding refcounted pointers, which is the same copy charged to whoever wrote the value. A BY pattern with no star cannot name a key per element so it means do not sort, except over a set with a STORE, where the result would otherwise differ between two servers holding the same members and Redis forces an alphabetic sort instead. Ties are broken by comparing the elements, always, so there is no case where the answer depends on the order the elements happened to be in. A lookup that lands on a key of the wrong type is a miss rather than an error, because a pattern is a guess about a naming convention and one key that does not fit it should not fail a command over the whole collection."

[[command]]
name = "SORT_RO"
group = "keyspace"
since = "7.0.0"
arity = -2
divergent = "D-24"
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "SORT without STORE, which is the whole difference. It exists so that a replica can answer a sort and so that a client with readonly permissions can ask for one, since SORT itself has to be a write command for the sake of an option most callers never use. STORE is not a word this parser knows, so SORT_RO k STORE d is a syntax error and not a permission error, which is what Redis answers too."

[[command]]
name = "MOVE"
group = "keyspace"
since = "1.0.0"
arity = 3
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "COPY with the source deleted, and the one command here that is cheap for a reason COPY cannot borrow. A body in the slab is already a value standing on its own, so a move can take that body rather than clone it, and moving a set of a million members writes a slot number into another database and deletes a record. The store gained a take next to the existing export for this, and take is the one that deletes the record itself rather than leaving it to the caller, because between the body leaving the slab and the record going there is a record pointing at a slot that has been freed, which is the one state the whole file exists to prevent. A del on top of a take would go through free_body a second time and underflow the count of keys holding a body. The destination is asked about before the source is touched, which is the opposite of Redis's order and answers the same thing, and here it is not about cost: a take that has to be put back is not something this can do. Both misses answer zero, a database index that is not one is an error, and moving a key into the database it is already in is the same object error, which is checked before either key is looked at."

[[command]]
name = "WAIT"
group = "keyspace"
since = "3.0.0"
arity = 3
divergent = "D-25"
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "There is no replication, so the number of replicas that acknowledged this connection's writes is zero and always will be. Redis with no replicas attached gives the same zero, it just takes the whole timeout to do it, and answering at once instead is D-25. It carries the blocking flag because Redis gives it that flag and because that is what a client reads to decide whether it can send this on a pipelined connection, and the flag is what routes it to the file that holds the parking machinery even though it never parks. What is not a formality is the argument checking, since that is the only part of this a client can see today: numreplicas is any integer at all and a negative one is satisfied on the spot, and the timeout is whole milliseconds rather than the seconds BLPOP takes, so it has its own two complaints."

[[command]]
name = "WAITAOF"
group = "keyspace"
since = "7.2.0"
arity = 4
divergent = "D-25"
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "WAIT for the append only file rather than for replicas, and both of its numbers are zero here for the same reason: appendonly is fixed at no, so there is no local file to be behind, and there is no replication, so there are no remote ones either. The reply is a flat array of two integers on both protocols. Redis reads the three arguments with three different helpers and each has its own complaint, which is worth copying exactly because it is the whole of what a client can see: numlocal is a range and says it must be between 0 and 1, numreplicas must be positive, and the timeout is milliseconds and is refused separately for not being an integer and for being negative. The one error a client can provoke that is about the server rather than the arguments is WAITAOF with numlocal set, which cannot be used when appendonly is disabled, and it is disabled and immutable here."

[[command]]
name = "SCAN"
group = "keyspace"
since = "2.8.0"
arity = -2
plan = "cursor"
bounded = "yes"
status = "shipped"
wire = "verified"
notes = "The cursor names a place in the keyspace rather than a place in memory, which is what lets a client hold one across a resize. Redis walks a power of two table that doubles by adding a bit at the top of the bucket index, so it needs reverse binary iteration to keep the two halves of a split bucket next to each other. Ours doubles the directory by copying each entry into two neighbouring slots, so a bit is added at the bottom and a left aligned 48 bit hash prefix is the same number before a doubling and after one. Walking in increasing prefix order is then enough, and a segment that splits partway through a walk can produce a duplicate and never a miss, which is exactly what the contract allows. COUNT is a floor and not a ceiling because a bucket is the smallest unit a cursor can name, so a batch can come back with more keys than asked for, or with none at all and a cursor that is not zero. TYPE is compared case insensitively against the type of each key walked past, so a type nothing can hold matches nothing rather than being an error, which is Redis's behaviour. A key past its deadline is skipped and then deleted once the walk has finished, because the walk itself holds a shared borrow of the index and there is no active expiry cycle yet to collect it. Without that, DBSIZE after a wait answers one more than Redis answers, which is the one difference a side by side run against 8.10.1 turned up."

[[command]]
name = "KEYS"
group = "keyspace"
since = "1.0.0"
arity = 2
plan = "cursor"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "The same walk SCAN makes with no bound on it and no chance of a duplicate, since nothing can split the index while it is running. The risk in the bound field is the command's whole reputation and it is deserved: a database of ten million keys is ten million keys in one reply with the shard doing nothing else. It is here because Redis's own test suite and every piece of tooling want it, and because SCAN is the answer for anything running against a database somebody is using. The embedded API has each instead, which is the same walk handing each key over where it lies, so a walk of a million keys allocates nothing."

[[command]]
name = "RANDOMKEY"
group = "keyspace"
since = "1.0.0"
arity = 1
plan = "cursor"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A random position in the index and a key from the bucket that lands in, which is a constant number of loads whatever the database holds. Uniform within a bucket and only roughly uniform across the keyspace, since a bucket holding two keys and one holding twelve are equally likely to be landed on, and Redis is biased the same way for the same reason. Reservoir sampling within the bucket rather than the first key in it, or it would answer the same key every time for as long as the bucket held still. Sixty four tries before it falls back to a full walk, which is what makes a database that has had almost all of it deleted answer the key that is left rather than nil."

[[command]]
name = "DUMP"
group = "keyspace"
since = "2.6.0"
arity = 2
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "The same export COPY and MOVE use, with Redis's file format on the end of it instead of an import. A payload is one type byte, the value, two bytes of RDB version and eight bytes of CRC64, and the bytes in the middle have to be Redis's bytes rather than ours or the whole command is pointless, so the writer follows rdb.c and not a description of it. Redis's own CRC64 is the one place where reading the source mattered: the header comment and every published table say the initial value is all ones, and the function Redis calls starts from whatever the caller passes and every caller passes zero. Each kind goes out as the plainest legal type for it, which is one shape per kind to get right and is accepted by every Redis since 2.6, and the cost is that a set already sitting in a listpack is written member by member where a memcpy would do. The deadline is deliberately left behind, since RESTORE is given a fresh one and a payload carrying a moment would be wrong the instant it crossed a machine with a different clock."

[[command]]
name = "RESTORE"
group = "keyspace"
since = "2.6.0"
arity = -4
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
divergent = "D-26"
notes = "The reader is deliberately not the mirror of the writer. We do not choose what arrives, so it accepts every encoding a modern Redis emits, which means the quicklist, the three listpack forms, the intset, both sorted set forms and both hash forms with field deadlines, and LZF decompression on top because rdbcompression is on by default and a payload from a real server is full of compressed strings. The check order is the whole of what a client can see and it is not the order the arguments read in: every option is parsed first, then the busy key check, then the time to live, then the footer, then the bytes, so a key that is already there is refused before anybody looks at the payload. IDLETIME and FREQ are exclusive by a trick worth copying exactly, since neither word is rejected for being the wrong one and each is only accepted while the other is unset, so the second of the two falls through to the plain syntax error. A deadline that has already gone deletes and answers OK, and it does that after the payload has been parsed, because a client that sent bad bytes and a stale deadline should be told about the bytes. An empty collection is refused rather than created, which is Redis's emptykey error and the same rule that makes SREM of the last member delete the key."

[[command]]
name = "MIGRATE"
group = "keyspace"
since = "2.6.0"
arity = -6
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "A DUMP here, a RESTORE there and a socket in between, which is why it came after both of those and not before. Everything goes down the wire in one write, the AUTH if there is one, then a SELECT if the socket is not already on the right database, then a RESTORE for each key that is actually here, and the replies are read back in that order. Pipelining the lot has a consequence that looks like a bug and is what a real server does, since a SELECT that fails does not stop the RESTOREs behind it, so migrating into a database index the peer does not have tells the client about the SELECT while the values quietly land wherever the peer happened to be. Each key stands on its own, so one refused key leaves itself here and lets the others go, and only the first complaint is reported. The socket is kept for the next migration to the same place, sixty four of them and ten seconds of idleness each, which are Redis's numbers, and one that has seen any error is dropped rather than handed out with half a reply still in it. The three IOERR lines were read off a real server rather than off the source, and the surprise is that a refused connect and a name that does not resolve both come out as the write error, because a real server hands the name to a non blocking connect and only notices on the first write."


# ------------------------------------------------------------------------ sets

[[command]]
name = "SADD"
group = "set"
since = "1.0.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One key lookup, then the members go into the body the record points at. A set that does not exist yet is created from the whole argument list rather than from the first member, which is Redis's setTypeCreate: a thousand members at once builds a hashtable straight away instead of building an intset, converting it to a listpack and converting that to a hashtable. Adding nothing to a key that is not there creates nothing, since an empty set does not exist."

[[command]]
name = "SREM"
group = "set"
since = "1.0.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One key lookup for the whole argument list. Removing the last member deletes the key, which is Redis's rule and not a tidy up: an empty set is not a thing that can exist, so EXISTS answers zero straight after. Removing never moves a set back down to a smaller representation, which Redis does not do either."

[[command]]
name = "SCARD"
group = "set"
since = "1.0.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The count the body already keeps, in all three representations, so it is a key lookup and a load and never a walk."

[[command]]
name = "SISMEMBER"
group = "set"
since = "1.0.0"
arity = 3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A binary search in an intset, a linear walk in a listpack and a hash lookup in the element table. The listpack walk is the fast one at the sizes a listpack is used at, which is measured in benches/intset.rs rather than assumed."

[[command]]
name = "SMISMEMBER"
group = "set"
since = "6.2.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One key lookup for every member asked about rather than one each, which is the only reason this exists over sending SISMEMBER in a pipeline. The reply is written straight out a member at a time, so the command allocates nothing whatever the argument count."

[[command]]
name = "SMEMBERS"
group = "set"
since = "1.0.0"
arity = 2
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "The whole set, which is the risk the bound field is naming: a client that sends this at a set of a million members gets a million member reply and there is no cursor in front of it. That is Redis's behaviour and the reason SSCAN exists. The members are written from where they lie, and an integer member is formatted here rather than stored as digits, so a set of a thousand integers stays two kilobytes in memory."

[[command]]
name = "SPOP"
group = "set"
since = "1.0.0"
arity = -2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One draw is a random position and a remove at that position, which every representation does in constant time because a remove moves the last member into the hole rather than shifting anything. A count draws again from the length that is left each turn, so the members come back distinct with no test for it and no bias. The reply for a count is a set and not an array, since the members are distinct and a RESP3 client can safely build one out of them."

[[command]]
name = "SRANDMEMBER"
group = "set"
since = "1.0.0"
arity = -2
plan = "point"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "A positive count splits at a third of the set. Above that it is Knuth's selection sampling, one walk picking each member with the probability that leaves the right number, needing no memory at all. Below it, positions are drawn and repeats thrown away, which needs a set sized to the count and not to the collection. Both are O(count), where selection alone would walk a million members to answer a draw of three and rejection alone would draw forever as the count approached the size. A negative count repeats itself, so it answers an array and not a set: a set would silently lose the repeats."

[[command]]
name = "SMOVE"
group = "set"
since = "1.0.0"
arity = 4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Two keys, and the check order is Redis's rather than the one it looks like it should be. A source that is not there answers zero without ever looking at the destination, so SMOVE nothing a-string m is a zero and not a WRONGTYPE. The destination is filled before the source is emptied, so a slot the source is about to give back cannot be handed straight to the destination underneath the index this is holding."

[[command]]
name = "SSCAN"
group = "set"
since = "2.8.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Only the element table walks in windows. An intset or a listpack answers with every member and a finished cursor, ignoring the cursor it was given, which is what Redis does for the same two encodings and is safe because promotion is one way: a set that gave out a table cursor is still a table. The table walks downward so that an insert lands above the cursor and a removal moves the top row down into the hole, since nothing ever moves a row upward and that is the case the guarantee forbids. MATCH decides how many members there are as the walk goes, so the reply header and the cursor in front of it are both written behind the body and rotated into place."

[[command]]
name = "SINTER"
group = "set"
since = "1.0.0"
arity = -2
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "A probe and never a merge, which is not the plan K11 pre-registered. It predicted a crossover at k around 7 on the assumption that a probe question is much dearer than a counting touch, and benches/setops.rs says both cost about 25 ns because a counting touch hashes its member and makes its own random access. Probe wins at every k from 2 to 16 and the two lines converge without crossing. The crossover comes back when the partitioned band gives us sorted arrays to walk in lockstep, whose touch is a pointer step with no hash anywhere, and that is M4. The counting plan stays reachable so the merge has a control to beat."

[[command]]
name = "SINTERCARD"
group = "set"
since = "7.0.0"
arity = -3
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The same walk with a callback that throws the members away, so the count is the only thing built. LIMIT stops it as soon as it has enough, which is the reason to send this rather than SINTER and a length. The keys are counted rather than positioned, because LIMIT comes after them and there would otherwise be no way to tell a key named LIMIT from the option, and that is why the legacy key range in COMMAND is zeroes here the way it is in Redis."

[[command]]
name = "SINTERSTORE"
group = "set"
since = "1.0.0"
arity = -3
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The destination is presized once from the smallest input, which is an upper bound on any intersection and is Y18's rule. What stopped aki's STORE family at 0.30x was that the rule was not applied. The result is built whole before anything is written, so the destination is allowed to be one of the sources: clearing it first and filling it as the walk goes is the shape that makes SINTERSTORE s s a answer nothing. An empty result deletes the destination rather than leaving an empty set, because an empty set does not exist."

[[command]]
name = "SUNION"
group = "set"
since = "1.0.0"
arity = -2
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "No plan to choose. A union reads every member of every set whatever it does, so the only question is what it does with each one, and the answer is one insertion into a table that is also the duplicate check. A key that is not there contributes nothing rather than emptying the answer, which is the opposite of what it does to an intersection and is right for the same reason."

[[command]]
name = "SUNIONSTORE"
group = "set"
since = "1.0.0"
arity = -3
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Presized to the sum of the inputs, since a union of sets that share nothing is all of them. Being wrong about that costs a conversion and not a wrong answer."

[[command]]
name = "SDIFF"
group = "set"
since = "1.0.0"
arity = -2
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "Always a probe and never anything else. The first set is the one being walked whether we like it or not, so the only choice is how each member is checked, and the later sets are asked smallest first because a member that is going to be found will usually be found in the smallest of them. A first key that is not there is an empty answer whatever the rest hold, and a later key that is not there takes nothing away."

[[command]]
name = "SDIFFSTORE"
group = "set"
since = "1.0.0"
arity = -3
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Presized from the first set, which is an upper bound on what a difference can keep."

# ---------------------------------------------------------------------- hashes

[[command]]
name = "HSET"
group = "hash"
since = "2.0.0"
arity = -4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One key lookup, then the pairs go into the body the record points at. A hash that does not exist yet is sized from the whole argument list, so an HSET with a thousand pairs builds the element table straight away instead of filling a listpack and converting it. Writing a field that is already there rewrites eight bytes of row and the new value and does not touch the field name at all, because the names are interned per collection."

[[command]]
name = "HSETNX"
group = "hash"
since = "2.0.0"
arity = 4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Per field and not per key, unlike SETNX, so it writes into a hash that already exists as long as that one field is missing. One lookup for the probe and the write together."

[[command]]
name = "HMSET"
group = "hash"
since = "2.0.0"
arity = -4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The same write as HSET with an OK instead of a count. Deprecated since 4.0 and still sent by a great deal of client code, so it shares the implementation rather than being left out or being an alias that drifts."

[[command]]
name = "HGET"
group = "hash"
since = "2.0.0"
arity = 3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A linear walk with a step of two in a listpack, so a value is never matched as a field, and one probe in the element table. The value is written from where it lies and a value stored as an integer is formatted into the reply buffer rather than into the hash."

[[command]]
name = "HMGET"
group = "hash"
since = "2.0.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One key lookup for every field asked about rather than one each, which is the only reason this exists over HGET in a pipeline. The reply is positional, so a field that is not there gets a nil and not a gap, and a key that is not there answers all nils rather than an empty array."

[[command]]
name = "HDEL"
group = "hash"
since = "2.0.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One key lookup for the whole argument list. Removing the last field deletes the key, since an empty hash cannot exist. The value bytes are handed back to the hash's blob as dead rather than moved out of it, and the blob is rebuilt once the dead outnumber the live."

[[command]]
name = "HLEN"
group = "hash"
since = "2.0.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The count the body already keeps, in both representations, so it is a key lookup and a load and never a walk."

[[command]]
name = "HEXISTS"
group = "hash"
since = "2.0.0"
arity = 3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The HGET probe without the value, which matters in the listpack band where not reading the value is the whole saving."

[[command]]
name = "HSTRLEN"
group = "hash"
since = "3.2.0"
arity = 3
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A value held as an integer answers with how many digits it would take, counted rather than formatted, so this never writes a number out just to measure it. A missing field is zero and not a nil, which is Redis's answer and reads oddly until you notice it matches STRLEN on a missing key."

[[command]]
name = "HGETALL"
group = "hash"
since = "2.0.0"
arity = 2
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "The whole hash, which is the risk the bound field names: a client that sends this at a hash of a million fields gets a million pair reply and there is no cursor in front of it. That is Redis's behaviour and the reason HSCAN exists. It answers a map on RESP3 and the same pairs flattened on RESP2, and the count comes from the body the walk is about to read rather than from a second lookup."

[[command]]
name = "HKEYS"
group = "hash"
since = "2.0.0"
arity = 2
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "The same walk as HGETALL with the values dropped. It is not cheaper in the listpack band, where the values are in the way whatever is done with them, and it is cheaper in the table band, where the values are in a blob nothing touches."

[[command]]
name = "HVALS"
group = "hash"
since = "2.0.0"
arity = 2
plan = "whole-value"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "The same walk with the fields dropped."

[[command]]
name = "HINCRBY"
group = "hash"
since = "2.0.0"
arity = 4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A field that is not there counts as zero and is created, which is what makes this the counter primitive it gets used as. The overflow is checked before the write rather than wrapped and stored, so a sum that leaves the range is an error and leaves the field holding exactly what it held."

[[command]]
name = "HINCRBYFLOAT"
group = "hash"
since = "2.6.0"
arity = 4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The same rules with the float errors. An infinite increment is not refused up front: Redis parses it, does the addition and then reports that the result is not finite, so the message is about the result and not about the argument. The reply is a bulk string on both protocols and never a double, because the exact digits are the point and a client that got a double back would have to trust its own formatting to round trip."

[[command]]
name = "HRANDFIELD"
group = "hash"
since = "6.2.0"
arity = -2
plan = "point"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "A positive count is Knuth's selection sampling, one walk taking each field with the probability that leaves the right number, needing no memory at all. SRANDMEMBER splits its positive form two ways because a set can be millions of members and a draw of three should not walk them; a hash builds the whole answer either way, so there is nothing for a second strategy to save. A negative count repeats itself and answers an array rather than a map, since a map would silently lose the repeats. WITHVALUES nests each pair on RESP3 and flattens it on RESP2, which is Redis's split and the only place in this group where the protocols disagree about the shape rather than the type."

[[command]]
name = "HSCAN"
group = "hash"
since = "2.8.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Only the element table walks in windows. A listpack answers with every pair and a finished cursor, ignoring the cursor it was given, which is what Redis does for the same encoding and is safe because promotion is one way. MATCH is matched against the field and never the value, and it decides how many pairs there are as the walk goes, so the reply header and the cursor in front of it are both written behind the body and rotated into place. NOVALUES is 7.4 and is not a shortcut for HKEYS: it still walks in windows, so it is the only way to page through the fields of a large hash without pulling every value across the wire too."

[[command]]
name = "HEXPIRE"
group = "hash"
since = "7.4.0"
arity = -6
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A field has no header to keep a deadline in, the way a key does, so the deadline goes beside the field instead. In the packed band the blob widens from two elements a field to three and OBJECT ENCODING starts saying listpackex, which is Redis's own answer for the same shape. In the table band a side array is allocated the first time any field of that hash gets a deadline, so a hash that never uses this carries three words and no allocation. Both bands go through one copy of the NX, XX, GT and LT rule, because two copies means one of them is wrong. Widening is one way, like promotion: a hash whose last deadline came off keeps the wider shape rather than rewriting itself to save a byte a field."

[[command]]
name = "HPEXPIRE"
group = "hash"
since = "7.4.0"
arity = -6
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The same command counting in milliseconds. All four setters normalise to one absolute millisecond before anything is touched, so there is one implementation and the difference between them is two booleans at the door."

[[command]]
name = "HEXPIREAT"
group = "hash"
since = "7.4.0"
arity = -6
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Absolute rather than relative, which is the only thing that separates it from HEXPIRE once the seconds are multiplied out. A deadline already past deletes the field and answers 2 rather than storing a number that is dead on arrival, and if that was the last field the key goes with it."

[[command]]
name = "HPEXPIREAT"
group = "hash"
since = "7.4.0"
arity = -6
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Absolute and in milliseconds, which is the form the other three are turned into. Redis has two different error messages here and they were checked against a real 8.10.1 rather than read off the documentation: a negative number is invalid expire time, must be >= 0, and one too large to be a moment is invalid expire time in the command, named."

[[command]]
name = "HTTL"
group = "hash"
since = "7.4.0"
arity = -5
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Minus two for a field that is not there and minus one for a field with no deadline, which is the same pair of answers TTL gives for a key. The seconds round up, so a field with half a second left answers 1 and not 0, and that was confirmed on a real server rather than assumed."

[[command]]
name = "HPTTL"
group = "hash"
since = "7.4.0"
arity = -5
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The same walk in milliseconds, with no rounding to do."

[[command]]
name = "HEXPIRETIME"
group = "hash"
since = "7.4.0"
arity = -5
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The moment rather than what is left of it. All five readers share one walk and two booleans decide the arithmetic, which is why there are two helpers behind these nine commands and not nine."

[[command]]
name = "HPEXPIRETIME"
group = "hash"
since = "7.4.0"
arity = -5
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The stored number handed straight back, since a deadline is already an absolute millisecond."

[[command]]
name = "HPERSIST"
group = "hash"
since = "7.4.0"
arity = -5
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Takes the deadline off and answers 1, without saying what it was. Worth knowing that a plain HSET does this too: writing a field clears its deadline, which has been Redis's rule since 7.4 and is the whole reason HGETEX exists as a command instead of a flag on HGET."

[[command]]
name = "HGETDEL"
group = "hash"
since = "8.0.0"
arity = -5
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The values positionally, then the fields go, and the key goes with the last of them. This one arrived years after the HEXPIRE family and words the same three numfields mistakes in three different sentences to it, which is upstream and is copied rather than tidied."

[[command]]
name = "HGETEX"
group = "hash"
since = "8.0.0"
arity = -5
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The value out first and the deadline applied second, which is what makes a past EXAT hand the value back and take the field anyway. Unlike GETEX, no option here means leave the deadline alone rather than clear it, and PERSIST is how you ask for it gone."

[[command]]
name = "HSETEX"
group = "hash"
since = "8.0.0"
arity = -6
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One answer for the whole list, because FNX and FXX are asked over every field named and not one at a time. KEEPTTL is needed because the write clears the deadline first, so the deadline is read before the value is stored and put back after."


# ---------------------------------------------------------------------- lists

[[command]]
name = "LPUSH"
group = "list"
since = "1.0.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One key lookup for the whole argument list, then the elements go into the body the record points at. A list that does not exist yet starts packed and stays that way until it crosses list-max-listpack-size, which is the same one way promotion a set and a hash have. Each element in turn goes at the head, so LPUSH k a b c leaves the list holding c b a, and that reads like a bug and is what Redis does."

[[command]]
name = "RPUSH"
group = "list"
since = "1.0.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "LPUSH from the other end. The tail is the cheaper end in the packed band, because appending to a listpack does not move the elements already in it, and both ends cost the same once the list is a chain of chunks."

[[command]]
name = "LPUSHX"
group = "list"
since = "2.2.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The same push behind a key lookup that answers zero rather than creating anything. It exists so that a producer can refuse to bring a queue back to life after a consumer drained it, which is a race a GET followed by an LPUSH cannot close."

[[command]]
name = "RPUSHX"
group = "list"
since = "2.2.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "LPUSHX from the other end."

[[command]]
name = "LPOP"
group = "list"
since = "1.0.0"
arity = -2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Each element is handed to the reply while it is still in the list and dropped straight after, so a LPOP of a thousand never builds a thousand of anything on the shard thread. The two reply shapes are different and not one shape with a length: without a count a missing key is a null and with one it is a null array, which a RESP2 client can tell apart on the wire. The key goes when the last element does."

[[command]]
name = "RPOP"
group = "list"
since = "1.0.0"
arity = -2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "LPOP from the other end."

[[command]]
name = "LLEN"
group = "list"
since = "1.0.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A field on the list in both bands, so it is a load and not a walk of the chunks."

[[command]]
name = "LRANGE"
group = "list"
since = "1.0.0"
arity = 4
plan = "cursor"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "The range is walked straight into the reply buffer and the array header is written behind it, so nothing is collected on the way out. LRANGE key 0 -1 over a list of ten million is still ten million elements on the wire, which is the risk the verdict names and the reason the descriptor cache in K10 matters: today reaching the start of the range walks the chunks in front of it."

[[command]]
name = "LINDEX"
group = "list"
since = "1.0.0"
arity = 3
plan = "cursor"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A negative index counts from the back and the walk starts at the nearer end, so LINDEX key -1 is as cheap as LINDEX key 0. In the chunked band it is a walk of chunk headers and not of elements, and it becomes a lookup once the counted tree in K10 lands."

[[command]]
name = "LSET"
group = "list"
since = "1.0.0"
arity = 4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The one list write with two errors and no boolean, because both ways of missing are errors on the wire: no such key for a key that is not there and index out of range for an index the list does not reach. A list is never empty, so those are the only two."

[[command]]
name = "LINSERT"
group = "list"
since = "2.2.0"
arity = 5
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Three answers in one signed number: the new length, minus one when the pivot is not there and zero when the key is not there. That is Redis's choice and a bad one, and it is on the wire and cannot be changed."

[[command]]
name = "LREM"
group = "list"
since = "1.0.0"
arity = 4
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A positive count removes that many from the front, a negative one that many from the back and zero removes every match, which is three directions in one argument. The key goes if the list ends up empty."

[[command]]
name = "LTRIM"
group = "list"
since = "1.0.0"
arity = 4
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A window that selects nothing deletes the key, which is not tidying up: LTRIM k 1 0 is the documented way to empty a list and it has to leave EXISTS answering zero. In the chunked band the chunks wholly outside the window are dropped rather than walked element by element."

[[command]]
name = "LPOS"
group = "list"
since = "6.0.6"
arity = -3
plan = "cursor"
bounded = "yes"
status = "shipped"
wire = "verified"
notes = "The positions go into the reply as they are found, so LPOS key x COUNT 0 over a list with ten thousand matches never builds a list of ten thousand numbers anywhere. MAXLEN is the bound and it is the client's to set. Three replies for what looks like one outcome: a null with no COUNT, an empty array with one, and an empty array again for a key that is not there."

[[command]]
name = "RPOPLPUSH"
group = "list"
since = "1.2.0"
arity = 3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "LMOVE with both ends fixed, kept as its own name because it is the one every client library still sends. The element is copied once, for the reason SPOP gives: what comes back has no structure left to borrow from."

[[command]]
name = "LMOVE"
group = "list"
since = "6.2.0"
arity = 5
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The destination's type is checked before anything is taken, so LMOVE list string LEFT LEFT is a WRONGTYPE with the source untouched rather than an element that has gone nowhere. The source and the destination being the same key is not a case to work around, it is LMOVE k k LEFT RIGHT, which is how a list is rotated and what a round robin scheduler is built out of."

[[command]]
name = "LMPOP"
group = "list"
since = "7.0.0"
arity = -4
plan = "merge"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The keys are behind a count, so COMMAND INFO reports no key positions and a cluster client has to ask COMMAND GETKEYS. The first key holding anything is the one that is popped, which is the point: one round trip instead of an LLEN per key and then an LPOP. A key of another type anywhere in the list is an error even when an earlier key would have answered."

[[command]]
name = "BLPOP"
group = "list"
since = "2.0.0"
arity = -3
plan = "merge"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "LPOP with a client that can be parked. What is kept while it waits is the command and not the client: the keys it named, what it meant to do with them and when to give up, so waking it is running the same attempt again against a database that has changed since. A timeout of exactly zero is no timeout, and -0.0 is exactly zero, so BLPOP k -0.0 waits forever while BLPOP k -0.1 is an error. The reply names the key that answered, which is the one difference from LPOP."

[[command]]
name = "BRPOP"
group = "list"
since = "2.0.0"
arity = -3
plan = "merge"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "BLPOP off the other end. Every key is type checked even when an earlier one is empty, so BRPOP empty string 0 is a WRONGTYPE rather than a wait, and a key that somebody turns into a set while a client is parked on it does not wake that client and does not error at it either: the wake condition is that the key holds a list with something in it, and anything else leaves the client waiting until its own deadline."

[[command]]
name = "BLMOVE"
group = "list"
since = "6.2.0"
arity = 6
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "LMOVE with a wait on the source. The destination is only looked at once there is something to move, so BLMOVE empty string LEFT RIGHT 0.1 times out rather than answering WRONGTYPE, which is the one place the type check order is visible from outside. A waiter that serves itself wakes the next one in the same moment, so a chain of BLMOVE clients passes an element along without a turn of the loop in between."

[[command]]
name = "BRPOPLPUSH"
group = "list"
since = "2.2.0"
arity = 4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "BLMOVE RIGHT LEFT under the older name, and it is the same code. On a timeout it answers a null array and not a null string, even though what it sends when it succeeds is a single element, which a RESP2 client can see: *-1 and not $-1. All five of the blocking list commands do that."

[[command]]
name = "BLMPOP"
group = "list"
since = "7.0.0"
arity = -5
plan = "merge"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "LMPOP with a wait, and the same parse shifted along by one. The timeout is read before the key count, so BLMPOP abc 0 k LEFT complains about the timeout and not about the count. A COUNT that is not a number at all gets the same sentence a zero or a negative one gets, which is count should be greater than 0 rather than the usual message about integers."

# ------------------------------------------------------------------ sorted set

[[command]]
name = "ZADD"
group = "zset"
since = "1.2.0"
arity = -4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "One key lookup for the whole pair list, then a hash probe and a tree descent per pair. Every score is parsed before the first one is stored, so ZADD key 1 a nonsense b adds nothing at all, which is Redis's answer and the only behaviour that makes the command safe to retry. The option parse has one surprise in it and it is Redis's: the pairs are counted before the incompatible options are looked at, so ZADD key NX XX is a syntax error about having no pairs rather than the complaint about NX and XX. GT and LT are worked out before the add and not after, because both are questions about the score that is already there."

[[command]]
name = "ZINCRBY"
group = "zset"
since = "1.2.0"
arity = 4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "ZADD INCR without the gates, and the same code underneath, because a version of this that did its own add would be a second place the NaN rule lives. Infinity plus its opposite is refused and the score is left alone, since a NaN compares equal to nothing including itself and a sorted set is nothing but comparisons. A key that was created for an increment that then fails is deleted again, so a refused ZINCRBY leaves no empty sorted set behind."

[[command]]
name = "ZCARD"
group = "zset"
since = "1.2.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The length is held in whichever band the sorted set is on and neither has to be walked to find it."

[[command]]
name = "ZSCORE"
group = "zset"
since = "1.2.0"
arity = 3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A hash probe on the element table and nothing else, because a score is a property of a member and not a question about order. This is the half of the sorted set the tree is not involved in, and it is why the tree holds row numbers rather than scores."

[[command]]
name = "ZMSCORE"
group = "zset"
since = "6.2.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "ZSCORE once per member, with the keyspace memo answering the second and later lookups without going back to the map. The reply is written a score at a time straight into the out buffer, so asking about a thousand members allocates nothing."

[[command]]
name = "ZREM"
group = "zset"
since = "1.2.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A probe to find the member, a search to find where it sits, and then the removal renumbers whichever row moved into the hole. That last part is the whole reason the tree can be updated in place rather than rebuilt: the element table fills a hole with its last row, so exactly one row number in the tree changes and the search that finds it is the same search everything else uses. The key goes when the last member goes."

[[command]]
name = "ZRANK"
group = "zset"
since = "2.0.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A probe for the score and then a descent for the position, which is the two structures answering the two halves of one question. WITHSCORE changes the shape of the answer both ways: the rank becomes a two element array and a member that is not there becomes the array nil rather than the string one, and a RESP2 client tells those apart. An argument too many is the arity error and a bad option is the syntax one, which is Redis's split and reads backwards until you notice the option is optional."

[[command]]
name = "ZREVRANK"
group = "zset"
since = "2.0.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "ZRANK counted from the other end, which is the length minus the rank minus one and not a second search."

[[command]]
name = "ZCOUNT"
group = "zset"
since = "2.0.0"
arity = 4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Two descents and a subtraction. This is ZRANGEBYSCORE with the walk left off, and it is the same Query the range commands build, which is why an exclusive bound cannot be right in one of them and wrong in the other."

[[command]]
name = "ZLEXCOUNT"
group = "zset"
since = "2.8.9"
arity = 4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "ZCOUNT against the other kind of bound. A lexical range only means anything when every member has the same score, which the command does not check and Redis does not either, because the order is by score and then by member and the answer is well defined either way."

[[command]]
name = "ZRANGE"
group = "zset"
since = "1.2.0"
arity = -4
plan = "cursor"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "Nine spellings of a range go through one parse and produce one Query, and this is the one that can say all of it: three by-modes, REV on any of them, LIMIT on the two that take bounds and WITHSCORES on the two that are not lexical. The window is measured before anything is walked, so the array header goes out in front of the members and the read path never builds a list. ZRANGE key 0 -1 is still the whole set on the wire, which is the risk the verdict names and is the same one LRANGE carries, since a client asking for everything gets everything. WITHSCORES nests each pair on RESP3 and flattens it on RESP2, which is the one place in this group where the two protocols disagree about the shape of a reply rather than the type of one value in it."

[[command]]
name = "ZREVRANGE"
group = "zset"
since = "1.2.0"
arity = -4
plan = "cursor"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "ZRANGE with REV and no options, and the same code underneath. It still reads the WITHSCORES and LIMIT tokens and then refuses LIMIT afterwards, because that is what Redis does and a client that sends ZREVRANGE key 0 -1 WITHSCORES LIMIT 0 1 expects to hear about LIMIT rather than about the word after it."

[[command]]
name = "ZRANGEBYSCORE"
group = "zset"
since = "1.0.5"
arity = -4
plan = "cursor"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "Two descents to find the ends of the window and then a walk between them, so the cost is the size of the answer and not the size of the set. An exclusive bound is a bound on the same descent and not a member skipped afterwards."

[[command]]
name = "ZREVRANGEBYSCORE"
group = "zset"
since = "2.2.0"
arity = -4
plan = "cursor"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "The same window backwards, and it names its high end first, which ZRANGE key min max BYSCORE REV does not. That swap is one line in the parse and it is the only difference between the two spellings."

[[command]]
name = "ZRANGEBYLEX"
group = "zset"
since = "2.8.9"
arity = -4
plan = "cursor"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "The lexical bounds, which are the four shapes a member bound can take: a minus for the low end, a plus for the high one, a bracket for inclusive and a paren for exclusive. Anything else is min or max not valid string range item, which is a different error from the one a bad score bound gives."

[[command]]
name = "ZREVRANGEBYLEX"
group = "zset"
since = "2.8.9"
arity = -4
plan = "cursor"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "ZRANGEBYLEX backwards with its high end named first. Redis refuses WITHSCORES on any lexical range even though it could answer it, and the refusal is a sentence of its own rather than a plain syntax error, so it is copied as one."

[[command]]
name = "ZRANGESTORE"
group = "zset"
since = "6.2.0"
arity = -5
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The same parse with the destination in front, and the one spelling that does not take WITHSCORES at all, because the destination is a sorted set and keeps the scores whatever is asked for. The result is built whole before the destination is written, so ZRANGESTORE z z 1 2 reads the old body and is safe. A window that comes out empty deletes the destination rather than leaving an empty sorted set behind."

[[command]]
name = "ZREMRANGEBYRANK"
group = "zset"
since = "2.0.0"
arity = 4
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The same Query the read side builds, with the walk turned into a removal. A negative index counts back from the end before anything is removed, so the window is decided once against the length the command started with."

[[command]]
name = "ZREMRANGEBYSCORE"
group = "zset"
since = "1.2.0"
arity = 4
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "By-mode in the name and no options at all, so the arity check is the whole of the syntax. The key is deleted when the last member goes."

[[command]]
name = "ZREMRANGEBYLEX"
group = "zset"
since = "2.8.9"
arity = 4
plan = "whole-value"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The lexical removal, and the third of the three that share a parse with the reads. Three separate window calculations would have been three chances to get an exclusive bound wrong in exactly one of them."

[[command]]
name = "ZUNION"
group = "zset"
since = "6.2.0"
arity = -3
plan = "merge"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "The accumulator is the result rather than something the result is copied out of, so a union gathers into an unordered element table and the order is put on it once at the end, by sorting row numbers and filling the tree by appending. A plain set is a legal input because Redis says it is, and it behaves as a sorted set in which every member scores one. A key that is not there keeps its place in the input list rather than being dropped, since WEIGHTS is positional and dropping it would line the weights up against the wrong keys."

[[command]]
name = "ZINTER"
group = "zset"
since = "6.2.0"
arity = -3
plan = "merge"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "The same gather with the smallest input walked first, which is Y18's rule and is what stopped aki's version at a fraction of the speed. The answer can only be as big as the smallest input, so that is what the accumulator is presized from."

[[command]]
name = "ZDIFF"
group = "zset"
since = "6.2.0"
arity = -3
plan = "merge"
bounded = "risk"
status = "shipped"
wire = "verified"
notes = "Takes neither WEIGHTS nor AGGREGATE, because a difference keeps the first input's scores and never combines two of them, so there is nothing for either option to do. Redis calls both a syntax error and so does this."

[[command]]
name = "ZUNIONSTORE"
group = "zset"
since = "2.0.0"
arity = -4
plan = "merge"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The gather with the walk left off and a store put on. The result is built whole before the destination is touched, so the destination is allowed to be one of the sources and ZUNIONSTORE z 2 z y reads the old body. An empty result deletes the destination rather than leaving an empty sorted set behind, because an empty one does not exist."

[[command]]
name = "ZINTERSTORE"
group = "zset"
since = "2.0.0"
arity = -4
plan = "merge"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "ZINTER with the store, and the same rule about the destination naming its own source."

[[command]]
name = "ZDIFFSTORE"
group = "zset"
since = "6.2.0"
arity = -4
plan = "merge"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "ZDIFF with the store. The count it answers is the size of what was written and not the size of the difference before the destination was cleared, which are the same number and would not be if the destination were cleared first."

[[command]]
name = "ZINTERCARD"
group = "zset"
since = "7.0.0"
arity = -3
plan = "merge"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Counting does not need any of the ordering an intersection needs, so this does not go through the gather at all: nothing is stored, no score is worked out, and a limit stops the walk the moment it is reached. That is the whole reason the command exists and it is why it is not ZINTER with the members thrown away."

[[command]]
name = "ZRANDMEMBER"
group = "zset"
since = "6.2.0"
arity = -2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A positive count draws without replacement with a partial shuffle of the row numbers, not a retry loop, because a retry loop on a count near the size of the set spends most of its time drawing members it already has. A negative count draws with replacement and answers exactly as many as asked for. A count at or over the size hands back the whole set in storage order, which is what Redis does and saves shuffling in order to return everything anyway. Without a count at all it answers one member or a nil, which is a different reply type from the empty array a count of zero gives."

[[command]]
name = "ZSCAN"
group = "zset"
since = "2.8.0"
arity = -3
plan = "cursor"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The guarantee is the one every scan gives: a member that was there for the whole walk is seen at least once. A listpack sorted set comes back whole with a cursor of zero, since a listpack has no stable position to resume from and 128 members is not worth a resume. This is the one sorted set reply where a score is not a double on RESP3, because a scan answers pairs of bulk strings whatever the protocol, which is Redis's shape and the same one HSCAN has."

[[command]]
name = "ZPOPMIN"
group = "zset"
since = "5.0.0"
arity = -2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The presence of the count decides the reply shape and its value does not. Without a count the answer is one flat member and score, and with one it is a list of pairs, nested on RESP3 and flattened on RESP2. A missing key answers an empty array rather than a null, which is where a sorted set pop and a list pop part company, and ZPOPMIN key 0 answers the same empty array a missing key does. A count that is negative or is not a number at all gets value is out of range, must be positive rather than the usual sentence about integers."

[[command]]
name = "ZPOPMAX"
group = "zset"
since = "5.0.0"
arity = -2
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "ZPOPMIN from the other end and the same code. Nothing is collected on the way out: the member is handed to the writer and only then removed, so a pop of a thousand members allocates nothing."

[[command]]
name = "ZMPOP"
group = "zset"
since = "7.0.0"
arity = -4
plan = "merge"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The keys are behind a count, so COMMAND INFO reports no key positions and a cluster client has to ask COMMAND GETKEYS. The first key holding anything is the one that is popped and a key of another type anywhere in the list is an error even when an earlier key would have answered. The pairs are nested on both protocols, unlike ZPOPMIN with a count, because the reply already has the key name in front of them and there is nothing left to flatten into. Nothing to pop is a null array and not a null."

[[command]]
name = "BZPOPMIN"
group = "zset"
since = "5.0.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "ZPOPMIN with a wait, and the reply is three elements side by side rather than a key and a pair: the key, the member and the score. That is not the shape ZPOPMIN has and it is Redis's. A key that holds something other than a sorted set is an error when the command arrives and is skipped when a parked client is retried, so a ZADD to a key somebody is blocked on serves them and a SET to it leaves them waiting."

[[command]]
name = "BZPOPMAX"
group = "zset"
since = "5.0.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "BZPOPMIN from the other end and the same code. On a timeout it answers a null array and not a null member, which a RESP2 client can see as *-1 rather than $-1."

[[command]]
name = "BZMPOP"
group = "zset"
since = "7.0.0"
arity = -5
plan = "merge"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "ZMPOP with a wait, and the same parse shifted along by one. The timeout is read before the key count, so BZMPOP abc 1 k MIN complains about the timeout and not about the count. A key count that leaves no room for the direction is a plain syntax error, because the word that should have been MIN or MAX is swallowed as a key and there is nothing left to read."


# ---------------------------------------------------------------------- array

[[command]]
name = "ARSET"
group = "array"
since = "8.8.0"
arity = -4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-18"
notes = "One key lookup and then a write per value into consecutive positions from the index given. The reply is how many of those positions were empty before, so overwriting ten values in place answers zero. A value of seven bytes or less lives in the position word itself, an integer that fits sixty one bits and a double that prints back as the exact bytes the client sent live there too, and everything else goes into one growable blob per key."

[[command]]
name = "ARMSET"
group = "array"
since = "8.8.0"
arity = -4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-19"
notes = "ARSET for positions that are not neighbours. Every index in the argument list is parsed before the key is touched, so a bad index in the last pair writes none of the earlier ones."

[[command]]
name = "ARGET"
group = "array"
since = "8.8.0"
arity = 3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A binary search over the slice directory and then one index into the slice, so it does not care where in the sixty four bit index space the index sits. A hole and a missing key are both a null, which is the same answer HGET gives for a missing field."

[[command]]
name = "ARMGET"
group = "array"
since = "8.8.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "ARGET once per index named, with the array header found once. The reply has one entry per index asked for and holes come back as nulls, so the client can line the answers up with what it asked without counting."

[[command]]
name = "ARGETRANGE"
group = "array"
since = "8.8.0"
arity = 4
plan = "cursor"
bounded = "yes"
status = "shipped"
wire = "verified"
notes = "One reply per position and not per element, which is why the range is capped at a million positions and refused rather than trimmed above that. Without the cap a range over the whole space against a missing key is eighteen quintillion nulls, and Redis says in as many words that the limit is not tunable."

[[command]]
name = "ARLEN"
group = "array"
since = "8.8.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The highest populated index plus one, read off the last slice in the directory. It is not the population and it does not go down when an element in the middle is deleted, though deleting the highest one does bring it down. The reply is unsigned, because an array with something at the top of the index space has a length that does not fit a signed integer."

[[command]]
name = "ARCOUNT"
group = "array"
since = "8.8.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "How many indices hold something, kept as a counter on the array rather than summed over the slices, so it is the same cost whatever shape the array is in."

[[command]]
name = "ARDEL"
group = "array"
since = "8.8.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Empties the positions named and answers how many of them held something. A slice that loses its last element is dropped, and a key that loses its last element is deleted, which is the rule every collection here follows."

[[command]]
name = "ARDELRANGE"
group = "array"
since = "8.8.0"
arity = -4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The cost is the elements it touches and not the span it was asked about, because a range that covers whole slices drops those slices whole. A pair may come in either order and the two ends are sorted before the delete, which is not what ARGETRANGE does with a reversed pair."

[[command]]
name = "ARINSERT"
group = "array"
since = "8.8.0"
arity = -3
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Appends at the insert cursor, which starts at zero and is moved by nothing except ARINSERT, ARRING and ARSEEK. A batch that would run off the top of the index space is refused before any of it lands, so the array is never left half written."

[[command]]
name = "ARRING"
group = "array"
since = "8.8.0"
arity = -4
plan = "point"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A ring buffer built out of indices rather than out of a structure, so writes go to the cursor plus one modulo the size given. Changing the size between calls renumbers the run that survives so that reading it back in index order is still reading it in the order it arrived, and the rebuild stops at the first hole. The size is read before the key, so a bad size against a string is a bad size and not a wrong type."

[[command]]
name = "ARNEXT"
group = "array"
since = "8.8.0"
arity = 2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Where the next append would go. Zero for a key that is not there and zero for a cursor nothing has moved yet, which are the same answer because they mean the same thing, and a null once the cursor has been parked at the top of the space and there is no honest index to name."

[[command]]
name = "ARSEEK"
group = "array"
since = "8.8.0"
arity = 3
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Points the cursor. A missing key answers zero and is not created, because an array with nothing in it is not a key here. This is the only array command that takes two to the sixty four minus one as an index, and it takes it because the log that rebuilds a database has to be able to say the terminal state."

[[command]]
name = "ARLASTITEMS"
group = "array"
since = "8.8.0"
arity = -3
plan = "cursor"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The newest positions walking back from the cursor, wrapping at the bottom of the array back to the top, oldest first unless REV. Positions and not elements, so a hole inside the window comes back as a null. A count of zero or less is an empty reply and Redis answers it before it has read the option or looked at the key, which is visible when both are wrong."

[[command]]
name = "ARSCAN"
group = "array"
since = "8.8.0"
arity = -4
plan = "cursor"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Index and value pairs for everything a range holds, holes skipped, reversed when the start is above the end. It needs none of the million position cap ARGETRANGE has because the cost is the elements found and the slices they sit in, not the width of the range, so a scan of the whole index space over a key holding three elements is three visits."

[[command]]
name = "ARGREP"
group = "array"
since = "8.8.0"
arity = -6
plan = "cursor"
bounded = "yes"
status = "shipped"
wire = "verified"
divergent = "D-22"
notes = "ARSCAN's walk with up to two hundred and fifty predicates in front of the reply, combined with OR unless AND was asked for, answering the indexes that matched or index and value pairs with WITHVALUES. EXACT is byte equality, MATCH is containment, GLOB is the pattern language KEYS uses and RE is a POSIX extended regular expression. The two bounds take - and + for the two ends of the array as well as an index, and they are read before the rest of the command, so a bad index beats a syntax error whichever way round the two are written. LIMIT counts what matched and not what was looked at, which is why this is the one array walk that is bounded by the option rather than inherently."

[[command]]
name = "AROP"
group = "array"
since = "8.8.0"
arity = -5
plan = "cursor"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-21"
notes = "One number out of a range, under one of eight operations. SUM, MIN and MAX read what parses as a number and ignore the rest, and answer a null when nothing in the range did. AND, OR and XOR truncate a float toward zero, skip anything that will not fit a signed sixty four bit integer, and answer a null when they saw no integer. MATCH and USED count rather than aggregate, so a missing key is a zero for those two and a null for the other six. The aggregate replies go through the seventeen significant digit printer Redis uses for them, which is why AROP says 0.29999999999999999 where ZSCORE says 0.3 for the same number."

[[command]]
name = "ARINFO"
group = "array"
since = "8.8.0"
arity = -2
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-20"
notes = "Seven fields about the key, or twelve with FULL. It is the one array command where a missing key is an error rather than an empty answer, which is deliberate on Redis's part: this is a question about a key that exists. The seven short fields are all struct reads, so the short form is constant time, and only FULL walks the directory to average the slices."


# ------------------------------------------------------------------ scripting

[[command]]
name = "SCRIPT"
group = "scripting"
since = "2.6.0"
arity = -2
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-16"
notes = "FLUSH, EXISTS and HELP. The cache is empty and there is nothing that can put anything in it, so flushing it is a no-op that is true and EXISTS answering zero is the true answer to the question it was asked. LOAD, KILL and DEBUG would need an interpreter to answer honestly and are not there at all."

[[command]]
name = "FUNCTION"
group = "scripting"
since = "7.0.0"
arity = -2
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-16"
notes = "FLUSH, LIST, DELETE and HELP, all of which are exactly right with no libraries loaded. STATS is the one that looks answerable and is not, because a real server lists LUA in its engines map and there is no engine here to list, so an empty map would be a different answer rather than the same one."

# ----------------------------------------------------------------- connection

[[command]]
name = "PING"
group = "connection"
since = "1.0.0"
arity = -1
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The table says a minimum of one and a real server then refuses a third argument as a wrong number of them, which the arity alone does not say."

[[command]]
name = "ECHO"
group = "connection"
since = "1.0.0"
arity = 2
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"

[[command]]
name = "HELLO"
group = "connection"
since = "6.0.0"
arity = -1
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-12"
notes = "AUTH is accepted for the default user with any password, which is how a real server with no requirepass behaves. The reply goes out in the protocol just agreed rather than the one the request arrived in."

[[command]]
name = "SELECT"
group = "connection"
since = "1.0.0"
arity = 2
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Sixteen databases, and the number is fixed for the life of the process, so CONFIG GET databases answers from a constant."

[[command]]
name = "RESET"
group = "connection"
since = "6.2.0"
arity = 1
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Puts the protocol back to RESP2 as well as the database back to zero, which is the half that is easy to miss and leaves a pooled connection speaking the wrong one."

[[command]]
name = "QUIT"
group = "connection"
since = "1.0.0"
arity = -1
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "The reply is written before the socket closes, so this answers with a flow decision rather than doing anything to the connection itself."

# --------------------------------------------------------------------- server

[[command]]
name = "COMMAND"
group = "server"
since = "2.8.13"
arity = -1
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-13"
notes = "COUNT, LIST, INFO, DOCS, GETKEYS and HELP. GETKEYS is the one a cluster aware client routes on, so MSETEX, whose keys are not where the first, last and step triple says, is special cased there rather than being answered wrongly."

[[command]]
name = "CONFIG"
group = "server"
since = "2.0.0"
arity = -2
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-14"
notes = "Every setting is fixed for the life of the process, so SET accepts a write that changes nothing and refuses everything else rather than pretending to have taken it."

[[command]]
name = "INFO"
group = "server"
since = "1.0.0"
arity = -1
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-12"
notes = "Only the fields this layer can stand behind. There is no rdb_last_save_time because there is no save, and a field that is not there is a client falling back rather than a client believing a zero. The CPU section was absent for the same reason and is there now, from one getrusage call, because Redis's own unit/info-command asks for used_cpu_user by name and because a monitoring tool graphs it against wall clock to tell a busy server from a waiting one."

[[command]]
name = "DBSIZE"
group = "server"
since = "1.0.0"
arity = 1
plan = "metadata"
bounded = "inherent"
status = "shipped"
wire = "verified"
divergent = "D-15"
notes = "The size of the index, not a walk over it, which is what Redis does too. A key that is past its deadline and has not been read since is counted by both servers, and Redis then takes it out on its next active expiry tick where we wait for somebody to read it."

[[command]]
name = "FLUSHALL"
group = "server"
since = "1.0.0"
arity = -1
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "A fresh index and a fresh arena per database rather than a walk that deletes each key in turn, because the one thing a client that has just said this is entitled to expect is the memory back. ASYNC and SYNC are both accepted and neither changes anything, since the keyspace is empty before the OK goes out either way."

[[command]]
name = "FLUSHDB"
group = "server"
since = "1.0.0"
arity = -1
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "FLUSHALL on the one database this connection is on."

[[command]]
name = "SWAPDB"
group = "server"
since = "4.0.0"
arity = 3
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "In the server group and not the keyspace one, which is Redis's answer and is the right one: it names no key and what it changes is what every connected client is looking at. A database here is a value in a slice, so the swap is the slice's own swap and costs two pointer sized writes whatever is in either database, which is what makes this fast and dangerous at the same time. Nobody is told. A client on database zero is still on database zero and is now looking at what used to be database one, and a client parked in BLPOP remembers the index it blocked on rather than the database, so it wakes against the swapped in one. That is Redis's behaviour and here it falls out of the index being the thing that is stored rather than being a rule anybody wrote. The two arguments have two different complaints, and the split is Redis's: a word that is not a number says which of the two arguments was wrong, and a number that is not one of ours gets the same out of range message SELECT gives, because the first check happens while reading the argument and the second happens inside the swap."

[[command]]
name = "TIME"
group = "server"
since = "2.6.0"
arity = 1
plan = "none"
bounded = "inherent"
status = "shipped"
wire = "verified"
notes = "Two bulk strings and not one integer, seconds and then microseconds within that second, both as decimal text. It reads the wall clock and not the coarse cached millisecond the keyspace uses, because the coarse one is refreshed on a tick and a client that calls TIME twice and gets the same microsecond has been lied to. The ACL categories are @fast and nothing else, which reads like an omission and is not: the categories say what a command can reach and this one reaches nothing."
